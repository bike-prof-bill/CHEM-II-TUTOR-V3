    // free ion: five degenerate lines
    ctx.strokeStyle = C('level'); ctx.lineWidth = 2;
    for (var i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(freeX + i * (lw + 2), midY); ctx.lineTo(freeX + i * (lw + 2) + lw - 4, midY); ctx.stroke(); }
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('free ion', freeX, midY + 6);
    // split levels, centred on the free-ion level (barycentre)
    var levels, rx = 138;
    if (c.geo === 'oct') levels = [[0, 1, 2, midY + 0.4 * D, 't₂g'], [3, 4, -1, midY - 0.6 * D, 'e_g']];
    else if (c.geo === 'tet') levels = [[0, 1, -1, midY + 0.6 * D, 'e'], [2, 3, 4, midY - 0.4 * D, 't₂']];
    else levels = [[0, 1, -1, midY + 44, 'dxz, dyz'], [2, -1, -1, midY + 24, 'dz²'], [3, -1, -1, midY + 4, 'dxy'], [4, -1, -1, midY - 58, 'dx²−y²']];   // the textbook's ordering (OpenStax 19.3), spaced for legibility
    var pos = {};
    levels.forEach(function (L) {
      var orbs = L.slice(0, 3).filter(function (o) { return o >= 0; }), y = L[3], x0 = rx + (3 - orbs.length) * (lw + gap) / 2;
      orbs.forEach(function (o, k) { var x = x0 + k * (lw + gap); pos[o] = [x, y]; ctx.strokeStyle = C('level'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + lw, y); ctx.stroke(); });
      ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(L[4], rx + 3 * (lw + gap) + 2, y);
    });
    // dashed links from the free ion to the split sets
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 0.8; ctx.setLineDash([2, 3]);
    levels.forEach(function (L) { ctx.beginPath(); ctx.moveTo(freeX + 5 * (lw + 2) - 2, midY); ctx.lineTo(rx - 4, L[3]); ctx.stroke(); }); ctx.setLineDash([]);
    // Δ: a double arrow between the lowest and the highest set
    var yLo = levels[0][3], yHi = levels[levels.length - 1][3], ax = rx - 14;
    ctx.strokeStyle = C('fg'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(ax, yLo - 2); ctx.lineTo(ax, yHi + 2);
    ctx.moveTo(ax - 3, yHi + 6); ctx.lineTo(ax, yHi + 1); ctx.lineTo(ax + 3, yHi + 6); ctx.moveTo(ax - 3, yLo - 6); ctx.lineTo(ax, yLo - 1); ctx.lineTo(ax + 3, yLo - 6); ctx.stroke();
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(c.geo === 'tet' ? 'Δtet' : c.geo === 'sq' ? 'Δ' : 'Δoct', ax - 3, (yLo + yHi) / 2);
    // pairing energy: a dashed line at the fixed height P above t₂g (octahedral d⁴–d⁷ only)
    if (choice(c)) {
      var yP = yLo - (22 + P_POS * 0.84);
      ctx.strokeStyle = C('pair'); ctx.lineWidth = 1.4; ctx.setLineDash([5, 3]); ctx.beginPath(); ctx.moveTo(rx - 6, yP); ctx.lineTo(W - 6, yP); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('pair'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('pairing energy', W - 6, yP - 2);
    }
    // electrons: half-arrows, up for the first in an orbital, down for the second
    var count = [0, 0, 0, 0, 0];
    for (var k = 0; k < shown; k++) {
      var o = seq[k], p = pos[o]; if (!p) continue; var up = count[o] === 0; count[o]++;
      var x = p[0] + (up ? lw * 0.33 : lw * 0.67), y0 = p[1] - 1, y1 = p[1] - 15;
      ctx.strokeStyle = C('focus'); ctx.lineWidth = 1.6; ctx.beginPath();
      if (up) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.lineTo(x - 4, y1 + 5); } else { ctx.moveTo(x, y1); ctx.lineTo(x, y0); ctx.lineTo(x + 4, y0 - 5); }
      ctx.stroke();
    }
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(c.geo === 'oct' ? 'octahedral' : c.geo === 'tet' ? 'tetrahedral' : 'square planar', rx, Hh - 4);
  }

  // ===========================================================================
  // b. Colour (the magnet was removed on 18 Oct: no measured magnetic moments in this course)
  // ===========================================================================
  var panelCv = el('panel');
  function wlRGB(l) {   // a standard visible-wavelength to colour conversion, 380–750 nm (drawing only)
    var r = 0, g = 0, b = 0;
    if (l < 440) { r = -(l - 440) / 60; b = 1; } else if (l < 490) { g = (l - 440) / 50; b = 1; } else if (l < 510) { g = 1; b = -(l - 510) / 20; }
    else if (l < 580) { r = (l - 510) / 70; g = 1; } else if (l < 645) { r = 1; g = -(l - 645) / 65; } else { r = 1; }
    var f = l < 420 ? 0.3 + 0.7 * (l - 380) / 40 : l > 700 ? 0.3 + 0.7 * (750 - l) / 50 : 1;
    return 'rgb(' + Math.round(255 * r * f) + ',' + Math.round(255 * g * f) + ',' + Math.round(255 * b * f) + ')';
  }
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, Hh = cv.H, c = cur();
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('b. Colour', 6, 4);
    var sx0 = 14, sx1 = W - 70, sy = 24, sh = 26, X = function (l) { return sx0 + (l - 380) / 370 * (sx1 - sx0); };
    if (c.lam || c.band) {
      for (var x = sx0; x < sx1; x++) { var l = 380 + (x - sx0) / (sx1 - sx0) * 370; ctx.fillStyle = wlRGB(l); ctx.fillRect(x, sy, 1.5, sh); }
      ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textBaseline = 'top';
      if (c.lam) {   // a measured λmax: a marker on the strip
        var lx = X(c.lam), rt = lx > (sx0 + sx1) / 2;
        ctx.beginPath(); ctx.moveTo(lx, sy + sh + 1); ctx.lineTo(lx - 5, sy + sh + 9); ctx.lineTo(lx + 5, sy + sh + 9); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = C('fg'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(lx, sy - 2); ctx.lineTo(lx, sy + sh + 2); ctx.stroke();
        ctx.textAlign = rt ? 'right' : 'left'; ctx.fillText('λmax ' + c.lam + ' nm', lx + (rt ? 6 : -6), sy + sh + 11); ctx.fillText('absorbed: ' + c.abs, rt ? sx1 : sx0, sy + sh + 24);
      } else {   // only the colour absorbed: its approximate band, bracketed
        var b0 = X(c.band[0]), b1 = X(c.band[1]);
        ctx.strokeStyle = C('fg'); ctx.lineWidth = 2; ctx.strokeRect(b0 + 0.5, sy - 3.5, b1 - b0, sh + 7);
        ctx.textAlign = 'center'; ctx.fillText('absorbed: ' + c.abs, Math.min(Math.max((b0 + b1) / 2, sx0 + 60), sx1 - 60), sy + sh + 8);
        ctx.fillStyle = C('muted'); ctx.fillText('approximate band; no λmax in this course', (sx0 + sx1) / 2, sy + sh + 21);
      }
      var cx = W - 54, cy = 18; ctx.fillStyle = c.cuv; ctx.fillRect(cx, cy, 30, 44); ctx.strokeStyle = C('fg'); ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy + 0.5, 30, 44);
      ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('seen:', cx + 15, cy + 47); ctx.fillText(c.seen, Math.min(cx + 15, W - 4 - ctx.measureText(c.seen).width / 2), cy + 59);
    } else {
      ctx.fillStyle = C('grid'); ctx.fillRect(sx0, sy, sx1 - sx0, sh); ctx.strokeStyle = C('rule'); ctx.strokeRect(sx0 + 0.5, sy + 0.5, sx1 - sx0, sh);
      ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('no data in this course', (sx0 + sx1) / 2, sy + sh / 2);
    }
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('muted'); ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillText('380 nm', sx0, Hh - 15); ctx.textAlign = 'right'; ctx.fillText('750 nm', sx1, Hh - 15);
  }

  // ===========================================================================
  // Text
  // ===========================================================================
  function readout() { var c = cur(), o = occupancy(c, sequence(c)); return c.label + ': ' + c.metal + sup(c.ox) + '+, d' + c.d + ', ' + spinText(c) + ' spin, ' + o.text + ', ' + o.unp + ' unpaired.'; }
  function updateText() {
    var c = cur(), seq = sequence(c), o = occupancy(c, seq), ch = choice(c);
    setText('rC', c.label); setText('rM', c.metal + sup(c.ox) + '⁺'); setText('rD', 'd' + sup(c.d)); setText('rGeo', c.geo === 'oct' ? 'octahedral' : c.geo === 'tet' ? 'tetrahedral' : 'square planar');
    setText('rS', spinText(c)); setText('rO', o.text); setText('rU', String(o.unp));
    var col = !!c.lam; setHidden('rowL', !col); setHidden('rowJ', !col); setHidden('rowK', !col);
    setHidden('rowSeen', !c.seen); setHidden('rowAbs', !c.abs); if (c.seen) { setText('rSeen', c.seen); setText('rAbs', c.abs); }
    if (col) { var J = H * CL / (c.lam * 1e-9); setText('rL', c.lam + ' nm'); setText('rJ', sci4(J) + ' J'); setText('rK', (Math.round(J * NA / 1000 * 10) / 10).toFixed(1) + ' kJ/mol'); }
    var s = el('field'); setDisabled('field', !ch); if (s.value !== String(st.field)) s.value = String(st.field);
    setAttr(s, 'aria-valuetext', ch ? (st.field > P_POS ? 'Δ above the pairing-energy line' : 'Δ below the pairing-energy line') : 'not used for this complex');
    if (el('complex').value !== st.id) el('complex').value = st.id;
    var out = c.label + ', ' + (c.geo === 'oct' ? 'octahedral' : c.geo === 'tet' ? 'tetrahedral' : 'square planar') + '. ' + (st.running ? 'Filling the orbitals.' : 'Readings are steady.');
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch.';
    setText('status', out); setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    setText('caption', 'a. Energy levels not to scale; Δ drawn larger for strong-field ligands; the dashed line marks the pairing energy. Electrons drawn as up and down half-arrows.');
    setText('caption2', 'b. Spectrum 380 to 750 nm: a marker at λmax where the course gives one; otherwise a box around the approximate band of the colour absorbed. The cuvette shows the colour seen.');
    setText('quick', 'Quick start: press Play, choose a complex, and for octahedral d⁴–d⁷ move the field slider.');
    var lv = c.geo === 'oct' ? 't₂g below e_g' : c.geo === 'tet' ? 'e below t₂' : 'four lower orbitals below d(x²−y²)';
    setText('descScene', 'Energy diagram for ' + c.label + ': five free-ion d orbitals at one level; in the complex, ' + lv + ', separated by Δ.' + (ch ? ' A dashed pairing-energy line sits ' + (st.field > P_POS ? 'below' : 'above') + ' the upper set.' : '') + ' Electrons drawn: ' + o.text + '; ' + o.unp + ' unpaired.');
    setText('descPanel', c.lam ? 'Spectrum strip from 380 to 750 nm with λmax at ' + c.lam + ' nm (' + c.abs + ' absorbed); the cuvette is drawn ' + c.seen + '.' : c.band ? 'Spectrum strip from 380 to 750 nm with the ' + c.abs + ' band boxed as absorbed (approximate; no λmax in this course); the cuvette is drawn ' + c.seen + '.' : 'Spectrum strip: no data in this course.');
  }

  // ===========================================================================
  // Loop: Play fills one electron at a time; the dish slides as the unpaired count changes
  // ===========================================================================
  var rafId = null, lastT = 0, clock = 0;
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(t) {
    rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; clock += dt;
    var seq = sequence(cur());
    if (clock > 0.6) { clock = 0; st.shown = Math.min(seq.length, (st.shown || 0) + 1); }
    render();
    if (st.shown >= seq.length) { st.running = false; st.shown = null; render(); say(readout()); return; }
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); return; }
    rafId = requestAnimationFrame(frame);
  }
  function start() { if (isReduced()) return; st.lastInput = performance.now(); st.started = true; st.running = true; if (st.shown === null) st.shown = 0; clock = 0; lastT = performance.now(); if (!rafId) rafId = requestAnimationFrame(frame); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } render(); }

  var restTimer = null;
  function changed(msg) { st.lastInput = performance.now(); render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500); }
  (function fillMenu() { var g = null, og = null; COMPLEXES.forEach(function (c) { if (c.group !== g) { og = document.createElement('optgroup'); og.label = c.group; el('complex').appendChild(og); g = c.group; } var o = document.createElement('option'); o.value = c.id; o.textContent = c.label; og.appendChild(o); }); })();
  el('complex').addEventListener('change', function () { var k = el('complex').value; if (!byId[k]) return; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } st.running = false; st.id = k; st.field = startField(byId[k]); st.shown = null; changed('Now showing ' + byId[k].label + '.'); });
  el('field').addEventListener('input', function () { st.field = parseInt(el('field').value, 10); st.shown = null; changed(''); });
  el('field').addEventListener('keydown', function (e) {
    var v = st.field, ok = true; switch (e.key) { case 'ArrowRight': case 'ArrowUp': v += 2; break; case 'ArrowLeft': case 'ArrowDown': v -= 2; break; case 'PageUp': v += 10; break; case 'PageDown': v -= 10; break; case 'Home': v = 0; break; case 'End': v = 100; break; default: ok = false; }
    if (ok) { e.preventDefault(); st.field = Math.max(0, Math.min(100, v)); st.shown = null; changed(''); }
  });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });

  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  window.addEventListener('resize', function () { render(); });   // a zoom changes the device pixel ratio: redraw at the new density
  render();
})();
</script>
</body>
</html>
