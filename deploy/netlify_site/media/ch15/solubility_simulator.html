  Date: 17 Oct 2026. Built by Simulation_Claude to 00_README_BRIEF_solubility_page.md (SCENARIO_CLAUDE, 17 Oct 2026), from
    silent_beaker_simulator.html (e70c8b58): a saturated salt over its solid, ion probes, themes, keyboard steps, accessibility,
    the Safari fix (labels written only when they change), the quick-start line, and formula labels that fit their boxes.
  Brief (one line): chapter 15 solubility (ch15_ksp, ch15_common_ion, ch15_qsp), opens at the meaning question: a slightly
    soluble salt dissolves until the ion product equals Ksp, then dissolving and settling run at equal rates; an ion already
    present lowers how much dissolves; two solutions mixed form a precipitate only if Q exceeds Ksp, and then until Q falls back
    to Ksp. No sentence states a verdict, a direction or a reason.
  Data source: the brief's table (instructor, 17 Oct 2026): Ksp at 25 °C from OpenStax Appendix J and molar masses, for AgCl,
    AgBr, AgI, BaSO4, CaCO3, CaC2O4 (monohydrate), CaF2, BaF2, Mg(OH)2, Ca(OH)2, PbI2, Ag2CrO4, Ag2CO3. The pH shown for the
    hydroxides uses Kw = 1.0 × 10^-14 (OpenStax 14.1, as on the chapter 14 pages; needed for the brief's pH 10.42).
    Arithmetic, all by bisection: dissolve (a s)^a (b s)^b = Ksp; common (c0 + a s)^a (b s)^b = Ksp or its mirror; mix
    c = c(stock) × V(own) ÷ V(total), Q = c1^a c2^b, and if Q > Ksp, (c1 − a y)^a (c2 − b y)^b = Ksp.
    Display choice: turbidity 0.1 NTU per µM of precipitate, labeled as an illustration (brief).
  URL parameters:
    mode     dissolve | common | mix. Default dissolve.
    salt     the ids above, case-insensitive. Default AgCl. (Ksp, if passed, is ignored.)
    common   cation | anion. Default anion.     c_common  M, 0 to 0.50. Default 0.10 (common mode).
    c_cat, c_an   M. With v_cat and v_an (mL) given, they are the two solutions before mixing; without volumes they are the
                  concentrations after mixing, and the page shows them as equal volumes of twice those concentrations.
    theme    light | dark. Default: the system setting.
  Cartoon choices (not data): about 8 dissolved formula units drawn in pure water, fewer in proportion to s with a common ion;
    extra common ions capped at 40; in mix, the more plentiful ion drawn as 30 and the other in proportion; about 2 events a
    second each way at the surface; spectator ions (Na+, NO3-, K+) not drawn; the 2-minute idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Play or uses a control.

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 17 Oct 2026). Ksp at 25 °C, OpenStax Appendix J; molar masses in g/mol.
  // a, b: cations and anions per formula unit.
  // ===========================================================================
  var SALTS = {
    'AgCl':    { name: 'silver chloride',   show: 'AgCl',     a: 1, b: 1, K: 1.6e-10, Ks: '1.6 × 10⁻¹⁰', M: 143.32, cat: 'Ag⁺',  an: 'Cl⁻' },
    'AgBr':    { name: 'silver bromide',    show: 'AgBr',     a: 1, b: 1, K: 5e-13,   Ks: '5 × 10⁻¹³',   M: 187.77, cat: 'Ag⁺',  an: 'Br⁻' },

    'BaSO4':   { name: 'barium sulfate',    show: 'BaSO₄',    a: 1, b: 1, K: 2.3e-8,  Ks: '2.3 × 10⁻⁸',  M: 233.39, cat: 'Ba²⁺', an: 'SO₄²⁻' },
    'CaCO3':   { name: 'calcium carbonate', show: 'CaCO₃',    a: 1, b: 1, K: 8.7e-9,  Ks: '8.7 × 10⁻⁹',  M: 100.09, cat: 'Ca²⁺', an: 'CO₃²⁻' },
    'CaC2O4':  { name: 'calcium oxalate (monohydrate)', show: 'CaC₂O₄', a: 1, b: 1, K: 1.96e-9, Ks: '1.96 × 10⁻⁹', M: 146.11, cat: 'Ca²⁺', an: 'C₂O₄²⁻' },
    'CaF2':    { name: 'calcium fluoride',  show: 'CaF₂',     a: 1, b: 2, K: 4e-11,   Ks: '4 × 10⁻¹¹',   M: 78.07,  cat: 'Ca²⁺', an: 'F⁻' },
    'BaF2':    { name: 'barium fluoride',   show: 'BaF₂',     a: 1, b: 2, K: 2.4e-5,  Ks: '2.4 × 10⁻⁵',  M: 175.32, cat: 'Ba²⁺', an: 'F⁻' },
    'Mg(OH)2': { name: 'magnesium hydroxide', show: 'Mg(OH)₂', a: 1, b: 2, K: 8.9e-12, Ks: '8.9 × 10⁻¹²', M: 58.32, cat: 'Mg²⁺', an: 'OH⁻', hydroxide: true },
    'Ca(OH)2': { name: 'calcium hydroxide', show: 'Ca(OH)₂',  a: 1, b: 2, K: 1.3e-6,  Ks: '1.3 × 10⁻⁶',  M: 74.09,  cat: 'Ca²⁺', an: 'OH⁻', hydroxide: true },
    'PbI2':    { name: 'lead(II) iodide',   show: 'PbI₂',     a: 1, b: 2, K: 1.4e-8,  Ks: '1.4 × 10⁻⁸',  M: 461.01, cat: 'Pb²⁺', an: 'I⁻' },
    'Ag2CrO4': { name: 'silver chromate',   show: 'Ag₂CrO₄',  a: 2, b: 1, K: 9e-12,   Ks: '9 × 10⁻¹²',   M: 331.73, cat: 'Ag⁺',  an: 'CrO₄²⁻' },
    'Ag2CO3':  { name: 'silver carbonate',  show: 'Ag₂CO₃',   a: 2, b: 1, K: 8.1e-12, Ks: '8.1 × 10⁻¹²', M: 275.75, cat: 'Ag⁺',  an: 'CO₃²⁻' }
  };
  var KW_P = 14.00;            // Kw = 1.0 × 10^-14 (OpenStax 14.1), for the hydroxides' pH
  var NTU_PER_UM = 0.1;        // display choice, labeled as an illustration (brief)
  var C0_MAX = 0.50;

  // Cartoon choices:
  var UNITS_PURE = 8, EXTRA_CAP = 40, MIX_TOP = 30, CELL = 8, START_CELLS = 70, EVENT_RATE = 2, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  function pick(name, list, def) { var r = (params.get(name) || '').trim(); if (!r) return def; var h = list.filter(function (k) { return k.toLowerCase() === r.toLowerCase(); })[0]; if (h) return h; notices.push('Could not read ' + name + ' “' + r.slice(0, 30) + '”; using ' + def + '.'); return def; }
  function num(name, lo, hi, def) { var r = params.get(name); if (r === null || r.trim() === '') return def; var v = Number(r); if (isFinite(v) && v >= lo && v <= hi) return v; notices.push('Could not read ' + name + '; using ' + (def === null ? 'the default' : def) + '.'); return def; }
  var start0 = { mode: pick('mode', ['dissolve', 'common', 'mix'], 'dissolve'), salt: pick('salt', Object.keys(SALTS), 'AgCl'), which: pick('common', ['cation', 'anion'], 'anion'),
                 c0: num('c_common', 0, C0_MAX, 0.10) };
  var cc = num('c_cat', 0, 1.0, null), ca = num('c_an', 0, 1.0, null), vc = num('v_cat', 0.1, 1000, null), va = num('v_an', 0.1, 1000, null);
  if (vc !== null && va !== null) start0.mix = { cCat: cc === null ? 0.01 : cc, cAn: ca === null ? 0.001 : ca, vCat: vc, vAn: va };
  else if (cc !== null || ca !== null) start0.mix = { cCat: 2 * (cc === null ? 0.001 : cc), cAn: 2 * (ca === null ? 0.0009 : ca), vCat: 50, vAn: 50 };   // after-mixing values: equal volumes of twice them
  else start0.mix = { cCat: 0.01, cAn: 0.001, vCat: 1, vAn: 9 };
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry: the brief's three equations, each solved by bisection.
  // ===========================================================================
  var st, S;
  function bisect(f, lo, hi, geometric) {   // f rises from below zero to above zero across [lo, hi]
    for (var i = 0; i < 200; i++) { var m = geometric ? Math.sqrt(lo * hi) : (lo + hi) / 2; if (f(m) > 0) hi = m; else lo = m; }
    return geometric ? Math.sqrt(lo * hi) : (lo + hi) / 2;
  }
  function sPure() { var a = S.a, b = S.b; return bisect(function (s) { return Math.pow(a * s, a) * Math.pow(b * s, b) - S.K; }, 1e-30, 10, true); }
  function sCommon() {
    var a = S.a, b = S.b, c0 = st.c0;
    if (!(c0 > 0)) return sPure();
    return bisect(function (s) { return (st.which === 'cation' ? Math.pow(c0 + a * s, a) * Math.pow(b * s, b) : Math.pow(a * s, a) * Math.pow(c0 + b * s, b)) - S.K; }, 1e-40, 10, true);
  }
  function mixed() {
    var m = st.mix, V = m.vCat + m.vAn, c1 = m.cCat * m.vCat / V, c2 = m.cAn * m.vAn / V, Q = Math.pow(c1, S.a) * Math.pow(c2, S.b), y = 0;
    if (Q > S.K) { var hi = Math.min(c1 / S.a, c2 / S.b); y = bisect(function (y) { return S.K - Math.pow(c1 - S.a * y, S.a) * Math.pow(c2 - S.b * y, S.b); }, 0, hi, false); }
    return { c1: c1, c2: c2, Q: Q, y: y, l1: c1 - S.a * y, l2: c2 - S.b * y, V: V };
  }
  function state() {   // the readings for the current mode
    if (st.mode === 'mix') return mixed();
    var s = st.mode === 'common' ? sCommon() : sPure(), c0 = st.mode === 'common' ? st.c0 : 0;
    var cat = S.a * s + (st.mode === 'common' && st.which === 'cation' ? c0 : 0), an = S.b * s + (st.mode === 'common' && st.which === 'anion' ? c0 : 0);
    return { s: s, s0: sPure(), cat: cat, an: an, gpl: s * S.M };
  }

  // ===========================================================================
  // Formatting: 3 significant figures; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function supE(e) { return String(e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function fmtN(v, sf) {
    if (!(v > 0)) return '0';
    var e = Math.floor(Math.log10(v)), k = Math.pow(10, sf - 1), r = Math.round(v / Math.pow(10, e) * k + 1e-7) / k; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(sf - 1) + ' × 10' + supE(e);
    return (r * Math.pow(10, e)).toFixed(Math.max(0, sf - 1 - e));
  }
  function fmt(v) { return fmtN(v, 3); }
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }
  function fmtP(x) { var h = hundredths(x), a = Math.abs(h); return (h < 0 ? '−' : '') + Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); }
  function spoken(t) {
    return t.replace(/( × )?10(⁻?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (a, times, minus, d) { return (times ? ' times ' : '') + '10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); })
      .replace(/(\d) M\b/g, '$1 molar').replace(/(\d) mL\b/g, '$1 milliliters').replace(/µM/g, 'micromolar').replace(/Ksp/g, 'K s p')
      .replace(/²⁺/g, ' two plus').replace(/²⁻/g, ' two minus').replace(/⁺/g, ' plus').replace(/⁻/g, ' minus').replace(/[₀₁₂₃₄₅₆₇₈₉]/g, function (c) { return '₀₁₂₃₄₅₆₇₈₉'.indexOf(c); });
  }

  // ===========================================================================
  // The sketch (not to scale). Cations: light circles with "+"; anions: diamonds with "−"; the solid: cells at the bottom.
  // dissolve/common: about UNITS_PURE units dissolved in pure water, fewer in proportion to s; common ions drawn too.
  // mix: the more plentiful ion drawn as MIX_TOP, the other in proportion; pairs build solid only while Q > Ksp.
  // ===========================================================================
  var PW = { w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function nCols() { return Math.max(8, Math.floor(PW.w / CELL)); }
  function cells() { var n = 0; st.cols.forEach(function (c) { n += c; }); return n; }
  function topY(i) { return PW.h - st.cols[i] * CELL; }
  function waterBottom() { var hi = 0; st.cols.forEach(function (c) { hi = Math.max(hi, c); }); return PW.h - hi * CELL - 5; }
  function dot(k, x, y, up) { st.dots.push({ k: k, x: x, y: y, vx: rnd(-22, 22), vy: up ? rnd(-36, -18) : rnd(-22, 22) }); }
  function cnt(k) { var n = 0; st.dots.forEach(function (d) { if (d.k === k) n++; }); return n; }
  function targets() {
    var r = state();
    if (st.mode === 'mix') {
      var top = Math.max(r.c1 / S.a, r.c2 / S.b), unit = top > 0 ? top / MIX_TOP : 1, grains = Math.round(r.y / unit);
      return { cat: Math.round(r.c1 / unit), an: Math.round(r.c2 / unit), grains: grains, pairs: 0, unit: unit };
    }
    var u = UNITS_PURE * r.s / r.s0, extra = 0, extraRaw = 0;
    if (st.mode === 'common' && st.c0 > 0) { extraRaw = UNITS_PURE * st.c0 / r.s0; extra = Math.min(EXTRA_CAP, Math.round(extraRaw)); }
    return { units: u, cat: Math.round(S.a * u) + (st.which === 'cation' ? extra : 0) * (st.mode === 'common' ? 1 : 0),
             an: Math.round(S.b * u) + (st.which === 'anion' ? extra : 0) * (st.mode === 'common' ? 1 : 0), capped: extraRaw > EXTRA_CAP + 0.5 };
  }
  function seed() {
    st.dots = []; st.sprites = []; var n = nCols(); st.cols = []; for (var i = 0; i < n; i++) st.cols.push(0);
    var t = targets(), wb, j;
    if (st.mode !== 'mix') { for (i = 0; i < START_CELLS; i++) st.cols[i % n]++; }
    else if (st.mixDone) { for (i = 0; i < t.grains; i++) st.cols[Math.floor(Math.random() * n)]++; }
    wb = waterBottom();
    var nc = st.mode === 'mix' && st.mixDone ? Math.round(state().l1 / t.unit) : t.cat, na = st.mode === 'mix' && st.mixDone ? Math.round(state().l2 / t.unit) : t.an;
    for (j = 0; j < nc; j++) dot('C', rnd(6, PW.w - 6), rnd(6, Math.max(8, wb)));
    for (j = 0; j < na; j++) dot('N', rnd(6, PW.w - 6), rnd(6, Math.max(8, wb)));
    st.formed = st.mode === 'mix' && st.mixDone ? t.grains : 0;
  }
  function leave() {   // one formula unit leaves the surface: a cations and b anions
    var best = -1; st.cols.forEach(function (c, i) { if (c > 0 && (best < 0 || c > st.cols[best] || (c === st.cols[best] && Math.random() < 0.3))) best = i; });
    if (best < 0) return; st.cols[best]--;
    var x = best * CELL + CELL / 2, y = topY(best) - 6;
    for (var i = 0; i < S.a; i++) dot('C', x - 3 + i * 4, y, true);
    for (i = 0; i < S.b; i++) dot('N', x + 3 + i * 4, y, true);
  }
  function join(grain) {   // a cations and b anions that meet settle onto the solid (or form a grain, in mix)
    var cs = st.dots.filter(function (d) { return d.k === 'C'; }), ns = st.dots.filter(function (d) { return d.k === 'N'; });

  var rafId = null, lastT = 0;
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(t) { rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; tick(dt); render(); schedule(); }
  function schedule() { if (st.running && !isReduced() && !rafId) rafId = requestAnimationFrame(frame); }
  function start() { st.lastInput = performance.now(); st.started = true; if (isReduced()) { if (st.mode === 'mix' && !st.mixDone) finishMix(); render(); return; } if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  var restTimer = null;
  function changed(msg, reseed) {
    st.lastInput = performance.now(); if (reseed) { st.seeded = false; st.mixDone = false; }
    if (isReduced() && st.mode === 'mix') finishMix();
    render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500);
  }
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(false); render(); say('Reset. ' + readout()); });
  el('solid').addEventListener('click', function () {   // more solid on the bottom; no reading changes once saturated
    var n = st.cols.length; for (var i = 0; i < 16; i++) st.cols[Math.floor(Math.random() * n)]++; changed('Added more solid.', false);
  });
  Object.keys(SALTS).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = SALTS[k].show; el('salt').appendChild(o); });
  el('salt').addEventListener('change', function () { var k = el('salt').value; if (!SALTS[k]) return; st.saltKey = k; S = SALTS[k]; changed('Now showing ' + S.name + '.', true); });
  el('mode').addEventListener('change', function () { st.mode = el('mode').value; changed('View: ' + el('mode').selectedOptions[0].textContent + '.', true); });
  el('which').innerHTML = '<option value="cation"></option><option value="anion"></option>';
  el('which').addEventListener('change', function () { st.which = el('which').value === 'cation' ? 'cation' : 'anion'; changed('Common ion: ' + (st.which === 'cation' ? S.cat : S.an) + '.', true); });
  // The common-ion slider: "none" at the left end, then powers of ten from 1.0 × 10^-8 to 0.50 M.
  var sl = el('c0'); sl.min = '-9'; sl.max = String(Math.log10(C0_MAX));
  function setC0(x) {
    x = Math.max(-9, Math.min(Math.log10(C0_MAX), x));
    var v = Math.pow(10, Math.max(x, -8)), e = Math.floor(Math.log10(v)), r2 = Math.round(v / Math.pow(10, e) * 10 + 1e-7) / 10 * Math.pow(10, e);   // two significant figures
    var c = x < -8.5 ? 0 : x >= Math.log10(C0_MAX) - 1e-9 ? C0_MAX : r2;
    if (c === st.c0) { render(); return; } st.c0 = c; changed('', true);
  }
  sl.addEventListener('input', function () { setC0(Number(sl.value)); });
  sl.addEventListener('keydown', function (e) {
    var x = st.c0 > 0 ? Math.log10(st.c0) : -9, k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowRight') x = x < -8.5 ? -8 : Math.floor(x * 10 + 1e-6) / 10 + 0.1;
    else if (k === 'ArrowDown' || k === 'ArrowLeft') x = x <= -8 + 1e-9 ? -9 : Math.ceil(x * 10 - 1e-6) / 10 - 0.1;
    else if (k === 'PageUp') x = x < -8.5 ? -8 : x + 1; else if (k === 'PageDown') x = x - 1 < -8 ? -9 : x - 1;
    else if (k === 'Home') x = -9; else if (k === 'End') x = Math.log10(C0_MAX); else return;
    e.preventDefault(); setC0(x);
  });
  [['cCat', 'cCat', 0, 1.0], ['cAn', 'cAn', 0, 1.0], ['vCat', 'vCat', 0.1, 1000], ['vAn', 'vAn', 0.1, 1000]].forEach(function (p) {
    el(p[0]).addEventListener('change', function () { var v = Number(el(p[0]).value); if (!isFinite(v) || v < p[2] || v > p[3]) { updateText(); return; } st.mix[p[1]] = v; changed('', true); });
  });
  el('moreCat').addEventListener('click', function () { st.mix.vCat = Math.round((st.mix.vCat + 1) * 10) / 10; changed('Added 1.0 mL more of the ' + S.cat + ' solution.', true); });
  el('moreAn').addEventListener('click', function () { st.mix.vAn = Math.round((st.mix.vAn + 1) * 10) / 10; changed('Added 1.0 mL more of the ' + S.an + ' solution.', true); });

  // ===========================================================================
  // Start: the problem's own state, paused.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) stop(); render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  st = { mode: start0.mode, saltKey: start0.salt }; initState(false);
  if (isReduced() && st.mode === 'mix') finishMix();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
