<title>Off the Scale</title>
<!--
  DRAFT: not for students until the instructor approves it.
  Date: 15 Oct 2026. Built by Simulation_Claude to 00_README_BRIEF_off_the_scale.md (SCENARIO_CLAUDE, 15 Oct 2026),
    changed the same day to 00_CHANGE_BRIEF_off_the_scale_slider.md (a concentration slider; calcium hydroxide added),
    and on 16 Oct on the instructor's word: a substance menu, the slider's low end at 1.0 × 10^-4 M, and a drawing
    whose count grows across the whole slider (not to scale, and it says so),
    on the pattern of purple_piston_simulator.html (f3cbd440) and silent_beaker_simulator.html (e33ed9ec).
  Brief (one line): ch14_ph opener "Off the Scale" (a floater), opens at the meaning question: a strong acid or base
    comes apart completely in water; pH = −log[H3O+]; above 1 M the pH leaves 0–14; each tenfold dilution moves the pH
    one unit. No sentence explains why the pH leaves 0–14 or names the direction of a change.
  Data source: the brief's table (instructor, 15 Oct 2026): Kw = 1.0 × 10^-14 at 25 °C, so pH + pOH = 14.00
    (OpenStax Chemistry 2e, section 14.1); HCl and HNO3 give one H+ to water, NaOH and KOH one OH-, Ba(OH)2 two OH-
    (the formulas; OpenStax 14.2); Ca(OH)2 two OH- (change brief); default HCl, 2.0 M; floor 1.0 × 10^-6 M (display
    rule, SCENARIO_CLAUDE); ceilings: 5.0 M (display limit) for HCl, HNO3, NaOH, KOH; Ba(OH)2 0.10 M and Ca(OH)2
    0.0069 M (OpenStax Appendix J, Ksp 5.0 × 10^-3 and 1.3 × 10^-6). Dilution: tenfold per press, the slider down one
    power of ten, off where the next press would cross the floor.
  Model: complete ionization, no activity corrections. [ion] = (ions per formula unit) × c; the other ion from Kw.
  URL parameters:
    strong   HCl | HNO3 | NaOH | KOH | Ba(OH)2 | Ca(OH)2, read case-insensitively. Default HCl; unknown values fall
             back with a notice.
    c        mol/L of the formula, 1.0 × 10^-6 to the substance's ceiling. Default 2.0 (or the ceiling, if lower).
             The slider runs from 1.0 × 10^-4 M, or from the power of ten below c when c is lower.
    theme    light | dark. Default: the system setting.
  Cartoon choices (not data): drawn formula units from 2 at 1.0 × 10^-4 M to 20 at 5.0 M, the same steps for every
    substance, about 4 more for each tenfold step (not to scale); about 0.5 s between units coming apart; the drawing showing at most
    100 times the starting volume; the 2-minute idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Dissolve or uses a control.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f6; --fg: #1d1e1c; --muted: #4b4d49; --rule: #7f8378; --grid: #e2e3dd; --control-bg: #ffffff; --focus: #7a3a10;
    --win-bg: #f1f2ee; --cell: #c9cbc4;
    --h: #ffffff; --h-edge: #4a4f57; --o: #c8392b; --o-edge: #5a1610; --n: #2a5db0; --n-edge: #142f5c; --cl: #2f8a3c; --cl-edge: #123d18;
    --na: #7b3fa8; --k: #8f2f7f; --ba: #2f6f4a; --ca: #7a5c10; --metal-edge: #1d1e1c; --sign: #ffffff; --water: rgba(120, 124, 118, 0.38);
    --notice-bg: #fff3d1; --notice-fg: #3d2c00; --notice-rule: #8a6a00;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #18191b; --fg: #e9eaec; --muted: #b6bac0; --rule: #8d949d; --grid: #303338; --control-bg: #222428; --focus: #ffb38a;
    --win-bg: #202226; --cell: #464a50;
    --h: #e9eaec; --h-edge: #a49aa8; --o: #ff7366; --o-edge: #ffd2cc; --n: #6fa0f0; --n-edge: #d6e6ff; --cl: #5cc46a; --cl-edge: #d9f5dd;
    --na: #c08ae8; --k: #e48ad2; --ba: #6fcf97; --ca: #e0c060; --metal-edge: #f2f3f5; --sign: #18191b; --water: rgba(190, 194, 200, 0.32);
    --notice-bg: #3a3010; --notice-fg: #ffe9a8; --notice-rule: #c9a63a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 8px 12px; max-width: 640px; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 4px; }
  .notice { margin: 0 0 6px; padding: 5px 9px; background: var(--notice-bg); color: var(--notice-fg); border-left: 4px solid var(--notice-rule); font-size: 0.85rem; }
  .top { display: flex; gap: 10px; align-items: stretch; }
  canvas { display: block; }
  #scene { width: 250px; height: 150px; flex: 0 0 250px; border-radius: 4px; }
  .readings { flex: 1 1 auto; min-width: 0; }
  .readings h2 { font-size: 0.8rem; font-weight: 600; margin: 0 0 2px; color: var(--muted); }
  .readings table { border-collapse: collapse; width: 100%; }
  .readings td { padding: 0; line-height: 1.24; font-size: 0.84rem; }
  .readings td.v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { margin: 3px 0; font-size: 0.86rem; font-weight: 600; min-height: 2.4em; }
  .row { display: flex; align-items: center; gap: 4px 5px; flex-wrap: wrap; margin: 4px 0; }
  button { font: inherit; font-size: 0.82rem; color: var(--fg); background: var(--control-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  select { font: inherit; font-size: 0.82rem; color: var(--fg); background: var(--control-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
  button:disabled { opacity: 0.55; cursor: default; }
  .slider { display: flex; align-items: center; gap: 8px; margin: 2px 0 0; }
  .slider label { font-size: 0.86rem; flex: 0 0 auto; }
  .slider input { flex: 1 1 auto; min-width: 120px; margin: 0; accent-color: var(--focus); }
  .slider .val { flex: 0 0 92px; text-align: right; font-size: 0.86rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ticks { position: relative; height: 13px; margin: 6px 100px 0 0; font-size: 0.68rem; color: var(--muted); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .ticks span::before { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 3px; background: var(--rule); }
  #panel { width: 100%; height: 172px; border: 1px solid var(--grid); margin-top: 2px; }
  .small { margin: 2px 0 0; font-size: 0.76rem; color: var(--muted); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

</style>
</head>
<body>
  <h1 id="title"></h1>
  <p class="notice" id="notice" role="status" hidden></p>

  <div class="top">
    <canvas id="scene" role="img" aria-label="The bottle on the stockroom bench, with the pH meter and its scale. A text description follows." aria-describedby="descScene"></canvas>
    <div class="readings">
      <h2>Readings (the bottle)</h2>
      <table>
        <tr><td id="lSub"></td><td class="v" id="rC"></td></tr>
        <tr><td>[H₃O⁺]</td><td class="v" id="rH"></td></tr>
        <tr><td>[OH⁻]</td><td class="v" id="rOH"></td></tr>
        <tr><td>pH</td><td class="v" id="rpH"></td></tr>
        <tr><td>pOH</td><td class="v" id="rpOH"></td></tr>
        <tr><td>Diluted</td><td class="v" id="rDil"></td></tr>
        <tr><td>Temperature</td><td class="v">25 °C</td></tr>
      </table>
    </div>
  </div>
  <p class="status" id="status"></p>

  <div class="row">
    <button type="button" id="play">Dissolve</button>
    <button type="button" id="dilute">Dilute tenfold</button>
    <button type="button" id="reset">Reset</button>
    <label for="sub" class="lab" style="margin-left:6px;font-size:0.86rem">Substance</label>
    <select id="sub"></select>
  </div>
  <div class="slider"><label for="conc" id="concLab">Concentration</label><input type="range" id="conc" step="any"><span class="val" id="concVal" aria-hidden="true"></span></div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <p class="small" id="limit" hidden></p>
  <canvas id="panel" role="img" aria-label="A drawing of the particles in the solution. A text description follows." aria-describedby="descPanel"></canvas>
  <p class="small" id="caption"></p>
  <p class="small">Time is not to scale: the drawing is slowed.</p>

  <div class="sr-only" id="descScene"></div>
  <div class="sr-only" id="descPanel"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 15 Oct 2026).
  // ===========================================================================
  var KW_P = 14.00;              // Kw = 1.0 × 10^-14 at 25 °C, so pH + pOH = 14.00 (OpenStax 14.1)
  var SYS = {   // ions per formula unit: the formulas; strong acids and bases ionize completely (OpenStax 14.2)
    'HCl':     { acid: true,  n: 1, name: 'hydrochloric acid', anion: 'Cl', show: 'HCl' },
    'HNO3':    { acid: true,  n: 1, name: 'nitric acid',       anion: 'NO3', show: 'HNO₃' },
    'NaOH':    { acid: false, n: 1, name: 'sodium hydroxide',  metal: 'Na', charge: '+', show: 'NaOH' },
    'KOH':     { acid: false, n: 1, name: 'potassium hydroxide', metal: 'K', charge: '+', show: 'KOH' },
    'Ba(OH)2': { acid: false, n: 2, name: 'barium hydroxide',  metal: 'Ba', charge: '2+', show: 'Ba(OH)₂', ceil: 0.10, ceilShow: '0.10' },
    'Ca(OH)2': { acid: false, n: 2, name: 'calcium hydroxide', metal: 'Ca', charge: '2+', show: 'Ca(OH)₂', ceil: 0.0069, ceilShow: '0.0069' }
  };
  // Ceilings: 5.0 M display limit; Ba(OH)2 and Ca(OH)2 from OpenStax Appendix J (Ksp 5.0 × 10^-3 and 1.3 × 10^-6).
  Object.keys(SYS).forEach(function (k) { if (!SYS[k].ceil) { SYS[k].ceil = 5.0; SYS[k].ceilShow = '5.0'; } });
  var FLOOR = 1.0e-4, LOW_C = 1.0e-6;   // the slider's low end (instructor, 16 Oct); c from the tutor may go to LOW_C
  var DEFAULT = { strong: 'HCl', c: 2.0 };

  // Cartoon choices:
  var UNITS = 10, MAX_UNITS = 20, STEP_S = 0.5, MOVE_S = 0.6, MAX_DRAWN_LEVEL = 2, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var key = DEFAULT.strong, raw = (params.get('strong') || '').trim();
  if (raw) {
    var norm = raw.toLowerCase().replace(/[\s()]/g, '');
    var hit = Object.keys(SYS).filter(function (k) { return k.toLowerCase().replace(/[()]/g, '') === norm; })[0];   // e.g. Ba(OH)2, baoh2
    if (hit) key = hit; else notices.push('No data for “' + raw.slice(0, 40) + '” here; showing HCl.');
  }
  var S = SYS[key], c0 = Math.min(DEFAULT.c, S.ceil), rawC = params.get('c');
  if (rawC !== null && rawC.trim() !== '') {
    var v = Number(rawC);
    if (isFinite(v) && v >= LOW_C * (1 - 1e-9) && v <= S.ceil * (1 + 1e-9)) c0 = Math.min(v, S.ceil);
    else if (isFinite(v) && v > S.ceil) { c0 = S.ceil; notices.push('The concentration is above this page’s ceiling; showing ' + S.ceilShow + ' M.'); }
    else notices.push('The concentration could not be read; showing ' + (c0 === S.ceil ? S.ceilShow : '2.0') + ' M.');
  }
  if (c0 < FLOOR * (1 - 1e-9)) FLOOR = Math.pow(10, Math.floor(Math.log10(c0) + 1e-9));   // the problem's own bottle stays on the slider
  var key0 = key;
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry: complete ionization; the other ion from Kw. Values are kept in hundredths so pH + pOH = 14.00 exactly.
  // ===========================================================================
  var st;
  function formulaC() { return st.c; }
  function ionC() { return S.n * st.c; }   // [H3O+] for an acid, [OH-] for a base
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }   // half away from zero
  function reading() {
    var ion = ionC(), pMain = hundredths(-Math.log10(ion)), pOther = KW_P * 100 - pMain;   // in hundredths
    var other = Math.pow(10, -(KW_P + Math.log10(ion)));   // Kw / ion
    return S.acid ? { h: ion, oh: other, pH: pMain, pOH: pOther } : { h: other, oh: ion, pH: pOther, pOH: pMain };
  }
  function canDilute() { return st.dissolved && st.c / 10 >= FLOOR * (1 - 1e-9); }
  function atFloor() { return st.c <= FLOOR * (1 + 1e-9); }
  function atCeil() { return st.c >= S.ceil * (1 - 1e-9); }

  // ===========================================================================
  // Formatting: concentrations to 3 significant figures, pH and pOH to 2 decimals; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function sig(v) { var e = Math.floor(Math.log10(v)), r = Math.round(v / Math.pow(10, e) * 100 + 1e-7) / 100; if (r >= 10) { r /= 10; e++; } return { m: r, e: e }; }
  function fmt(v) {
    if (!(v > 0)) return '0';
    var s = sig(v);
    if (s.e < -3 || s.e > 3) return s.m.toFixed(2) + ' × 10' + String(s.e).split('').map(function (ch) { return SUP[ch]; }).join('');
    return (s.m * Math.pow(10, s.e)).toFixed(Math.max(0, 2 - s.e));
  }
  function fmt2(v) {   // two significant figures, for the slider's concentration
    var e = Math.floor(Math.log10(v)), r = Math.round(v / Math.pow(10, e) * 10 + 1e-7) / 10; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(1) + ' × 10' + String(e).split('').map(function (ch) { return SUP[ch]; }).join('');
    return (r * Math.pow(10, e)).toFixed(Math.max(0, 1 - e));
  }
  function round2(v) { var e = Math.floor(Math.log10(v)); return Math.round(v / Math.pow(10, e) * 10 + 1e-7) / 10 * Math.pow(10, e); }
  function fmtP(h) { var a = Math.abs(h), s = Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); return (h < 0 ? '−' : '') + s; }
  function spokenP(h) { return (h < 0 ? 'minus ' : '') + fmtP(Math.abs(h)); }
  function spoken(t) { return t.replace(/ × 10(⁻?)(\S+)/g, function (a, minus, d) { return ' times 10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); }); }
  function dilWord(k) { return k === 0 ? 'not yet' : '×' + fmt(Math.pow(10, k)).replace(/\.0+$/, ''); }
  function dilShow(k) { return k === 0 ? 'none' : k <= 3 ? '×' + Math.pow(10, k) : '×10' + String(k).split('').map(function (ch) { return SUP[ch]; }).join(''); }

  // ===========================================================================
  // The drawing. Positions are in "volume units": the starting volume is a 1 × 1 square; after the first dilution
  // the drawing holds 10 such squares (5 × 2), after the second 100 (10 × 10). Beyond that it is capped.
  // ===========================================================================
  var PW = { x: 0, y: 0, w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var GRID = [[1, 1], [5, 2], [10, 10]];
  function grid() { return GRID[Math.min(st.dil, MAX_DRAWN_LEVEL)]; }
  function newParticle(kind, u, v) { return { k: kind, u: u, v: v, vu: rnd(-0.06, 0.06), vv: rnd(-0.06, 0.06), a: rnd(0, 6.3) }; }
  function seedWater() {   // faint water: a fixed scatter in the starting square
    st.water = []; for (var i = 0; i < 26; i++) st.water.push(newParticle('W', rnd(0.04, 0.96), rnd(0.30, 0.96)));
  }
  // Not to scale: 2 units at 1.0 × 10^-4 M rising evenly with each power of ten to 20 at 5.0 M, the same for every substance.
  var STEPS_LO = -4, STEPS_HI = Math.log10(5.0), PER_DECADE = (MAX_UNITS - 2) / (STEPS_HI - STEPS_LO);
  function unitsFor() { return Math.max(1, Math.min(MAX_UNITS, Math.round(2 + PER_DECADE * (Math.log10(st.c) - STEPS_LO)))); }
  function seedUnits() {   // the formula units, waiting just above the water at the start (two rows if needed)
    st.parts = []; st.nUnits = unitsFor();
    var perRow = Math.min(st.nUnits, 10), rows = Math.ceil(st.nUnits / perRow);
    for (var i = 0; i < st.nUnits; i++) { var row = Math.floor(i / perRow), col = i % perRow, p = newParticle(S.acid ? 'HA' : 'MOH', 0.07 + 0.86 * (col + 0.5) / perRow, rows === 1 ? 0.10 : 0.06 + row * 0.09); p.held = true; st.parts.push(p); }
  }
  function seedDissolved() {   // the same picture as after dissolving, for the slider's concentration
    st.parts = []; st.moves = []; st.spread = null; st.nUnits = unitsFor();
    for (var i = 0; i < st.nUnits; i++) {
      if (S.acid) { st.parts.push(newParticle('A', rnd(0.04, 0.96), rnd(0.28, 0.95))); st.parts.push(newParticle('H3O', rnd(0.04, 0.96), rnd(0.28, 0.95))); }
      else { st.parts.push(newParticle('M', rnd(0.04, 0.96), rnd(0.28, 0.95))); for (var j = 0; j < S.n; j++) st.parts.push(newParticle('OH', rnd(0.04, 0.96), rnd(0.28, 0.95))); }
    }
  }
  function intact() { var n = 0; st.parts.forEach(function (p) { if (p.k === 'HA' || p.k === 'MOH') n++; }); return n; }
  function count(k) { var n = 0; st.parts.forEach(function (p) { if (p.k === k) n++; }); return n; }
  function nearestWater(p) { var best = null, bd = Infinity; st.water.forEach(function (w) { if (w.taken) return; var d = (w.u - p.u) * (w.u - p.u) + (w.v - p.v) * (w.v - p.v); if (d < bd) { bd = d; best = w; } }); return best; }
  function comeApart(p) {   // one formula unit: an acid gives its proton to a water molecule; a base splits into its ions
    if (S.acid) {
      var w = nearestWater(p) || newParticle('W', Math.min(0.96, p.u + 0.05), p.v); w.taken = true;
      st.moves.push({ from: { u: p.u, v: p.v }, w: w, t: 0, p: p });
      p.k = 'A';   // the anion is left behind; the proton is drawn moving to the water molecule
    } else {
      var t = rnd(0, 6.283); p.k = 'M'; p.vu = -0.08 * Math.cos(t); p.vv = -0.08 * Math.sin(t);   // the ions drift apart in a random direction
      for (var i = 0; i < S.n; i++) { var ti = t + (S.n === 2 ? (i ? 0.6 : -0.6) : 0), o = newParticle('OH', p.u + 0.04 * Math.cos(ti), p.v + 0.04 * Math.sin(ti)); o.vu = 0.08 * Math.cos(ti); o.vv = 0.08 * Math.sin(ti); st.parts.push(o); }
    }
  }
  function finishMoves(all) {
    st.moves = st.moves.filter(function (mv) {
      if (!all && mv.t < MOVE_S) return true;
      var w = mv.w, i = st.water.indexOf(w); if (i >= 0) st.water.splice(i, 1);
      st.parts.push(newParticle('H3O', w.u, w.v)); return false;
    });
  }
  function dissolveAllNow() {
    st.parts.forEach(function (p) { if (p.held) { p.held = false; p.v = rnd(0.3, 0.95); } });
    st.parts.slice().forEach(function (p) { if (p.k === 'HA' || p.k === 'MOH') comeApart(p); });
    finishMoves(true); st.dissolved = true; st.next = 0;
  }
  function spreadTo(level) {   // after a dilution the same particles spread through all the squares
    var g = GRID[Math.min(level, MAX_DRAWN_LEVEL)], old = GRID[Math.min(level - 1, MAX_DRAWN_LEVEL)];
    if (g === old) return;   // the drawing is capped: no change
    st.parts.concat(st.water).forEach(function (p) { p.tu = rnd(0.03, g[0] - 0.03); p.tv = rnd(0.05, g[1] - 0.05); });
    st.spread = { t: 0 };
    // more water is drawn into the new squares (faint)
    var extra = Math.max(0, Math.min(26 * (g[0] * g[1] - old[0] * old[1]), 110 - st.water.length));   // drawn water capped
    for (var i = 0; i < extra; i++) { var w = newParticle('W', rnd(0.02, g[0] - 0.02), rnd(0.02, g[1] - 0.02)); w.fresh = true; st.water.push(w); }
  }

  // ===========================================================================
  // State and time
  // ===========================================================================
  function initState() {
    key = key0; S = SYS[key];
    st = { c: c0, nUnits: UNITS, dil: 0, dissolved: false, started: false, running: false, lastInput: 0, next: 0.3, moves: [], spread: null, parts: [], water: [] };
    seedWater(); seedUnits();
  }
  function tick(dt) {
    var g = grid();
    if (!st.dissolved) {
      st.next -= dt;
      if (st.next <= 0) {
        var waiting = st.parts.filter(function (p) { return p.held; });
        var ready = st.parts.filter(function (p) { return !p.held && (p.k === 'HA' || p.k === 'MOH'); });
        if (waiting.length) { var p = waiting[0]; p.held = false; p.drop = { from: p.v, to: rnd(0.35, 0.92), t: 0 }; }
        if (ready.length) comeApart(ready[0]);
        st.next = Math.min(STEP_S, 5 / Math.max(1, st.nUnits));   // about 5 s in all, however many units are drawn
      }

  var slider = el('conc');
  slider.addEventListener('input', function () { setC(Number(slider.value)); });
  slider.addEventListener('keydown', function (e) {
    var x = Math.log10(st.c), k = e.key, lo = Math.log10(FLOOR), hi = Math.log10(S.ceil);
    var shown = function (y) { return fmt2(Math.min(S.ceil, Math.max(FLOOR, Math.pow(10, y)))); };
    if (k === 'ArrowUp' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft') {   // a tenth of a power of ten, to the next value that reads differently
      var up = k === 'ArrowUp' || k === 'ArrowRight', y = up ? Math.floor(x * 10 + 1e-6) / 10 : Math.ceil(x * 10 - 1e-6) / 10;
      for (var i = 0; i < 4; i++) { y = Math.round((y + (up ? 0.1 : -0.1)) * 10) / 10; if (shown(y) !== shown(x) || y <= lo || y >= hi) break; }
      x = y;
    }
    else if (k === 'PageUp') x = x + 1;
    else if (k === 'PageDown') x = x - 1;
    else if (k === 'Home') x = lo;
    else if (k === 'End') x = hi;
    else return;
    e.preventDefault(); setC(x);
  });
  function setupSubstance() {   // title, labels, slider range and ticks for the substance shown
    el('title').textContent = 'Off the Scale: ' + S.show + ' (' + S.name + ') in water, 25 °C';
    el('sub').value = key;
    slider.min = String(Math.log10(FLOOR)); slider.max = String(Math.log10(S.ceil));
    el('concLab').textContent = 'Concentration of ' + S.show;
    ticks();
  }
  function ticks() {   // a tick at each power of ten, placed where the thumb sits
    var box = el('ticks'), lo = Math.log10(FLOOR), hi = Math.log10(S.ceil), html = '';
    for (var p = Math.ceil(lo); p <= Math.floor(hi + 1e-9); p++) {
      var f = (p - lo) / (hi - lo), lab = p === 0 ? '1' : '10' + String(p).split('').map(function (ch) { return SUP[ch]; }).join('');
      html += '<span style="left: calc(' + (8 + 0) + 'px + ' + f.toFixed(4) + ' * (100% - 16px))">' + lab + '</span>';
    }
    box.innerHTML = html;
    var lab = el('concLab');   // the tick row starts where the slider starts
    box.style.marginLeft = (lab.offsetWidth + 8) + 'px';
  }
  // The substance menu: a new bottle of the chosen substance at the same concentration (or its ceiling, if lower),
  // drawn the way the drawing was (waiting above the water, or dissolved).
  Object.keys(SYS).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = SYS[k].show; el('sub').appendChild(o); });
  el('sub').addEventListener('change', function () {
    var k = el('sub').value; if (!SYS[k] || k === key) return;
    key = k; S = SYS[k]; st.c = Math.min(st.c, S.ceil); st.dil = 0; st.lastInput = performance.now();
    if (st.started && !st.dissolved) dissolveAllNow();
    seedWater(); if (st.dissolved) seedDissolved(); else seedUnits();
    setupSubstance(); render(); say('Now showing ' + S.name + '. ' + readout());
  });

  // ===========================================================================
  // Start: the problem's own bottle; the drawing paused before the units go in.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) { stop(); if (!st.dissolved && st.started) dissolveAllNow(); } render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  initState(); setupSubstance();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
