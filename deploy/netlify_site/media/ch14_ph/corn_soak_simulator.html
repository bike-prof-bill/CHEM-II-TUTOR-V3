  Brief (one line): ch14_ph opener "The Corn Soak" (the worked scenario), opens at the meaning question: water both gives
    and takes protons; pure water makes equal hydronium and hydroxide; adding HCl or a base raises one ion and lowers the
    other, and their product stays 1.0 × 10^-14 at 25 °C. No sentence names the direction of a change or explains it.
  Data source: the brief's table (instructor, 16 Oct 2026): Kw = 1.0 × 10^-14 at 25 °C (OpenStax 14.1, Example 14.1);
    HCl gives one H+ to water, NaOH and KOH one OH-, Ca(OH)2 two OH- (OpenStax 14.2; Exercise 18(d)); Ca(OH)2 ceiling
    0.0069 M (OpenStax Appendix J, Ksp 1.3 × 10^-6); the ions for any added amount c:
    [major] = (c + √(c² + 4Kw)) / 2, [minor] = Kw / [major]; presets: HCl 1.0 × 10^-3 M, pure water, Ca(OH)2 at its ceiling.
  Model: complete ionization, no activity corrections.
  URL parameters (the same placeholders as Off the Scale):
    strong   HCl | NaOH | KOH | Ca(OH)2, read case-insensitively. Default: pure water, with NaOH in the base menu.
    c        mol/L of the formula, 1.0 × 10^-8 to 0.10 (Ca(OH)2 to 0.0069), or 0 for pure water. Default 0.
    theme    light | dark. Default: the system setting.
  The slider: one scale through pure water. Left half HCl, right half the base in the menu; powers of ten from
    1.0 × 10^-8 M beside the center out to 0.10 M at the ends; between the center and 1.0 × 10^-8 M the added amount
    falls evenly to zero, so the readings pass smoothly through 7.
  Cartoon choices (not data): the drawing is not to scale. Each ion's drawn count is 2 at 1.0 × 10^-7 M and about 3 more
    for each tenfold step above it; below 1.0 × 10^-7 M it is in proportion (so a rare ion appears only now and then).
    Water's own ion pairs last about 2 s. 32 water molecules drawn faintly. The 2-minute idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Play or uses a control.

<body>
  <h1>The Corn Soak: the ions in water, 25 °C</h1>
  <p class="notice" id="notice" role="status" hidden></p>

  <div class="top">
    <canvas id="bars" role="img" aria-label="Two bars on one power-of-ten scale, for hydronium and hydroxide. A text description follows." aria-describedby="descBars"></canvas>

      <table>

        <tr><td>[H₃O⁺]</td><td class="v" id="rH"></td></tr>
        <tr><td>[OH⁻]</td><td class="v" id="rOH"></td></tr>
        <tr><td>[H₃O⁺] × [OH⁻]</td><td class="v" id="rKw"></td></tr>
        <tr><td>pH</td><td class="v" id="rpH"></td></tr>
        <tr><td>pOH</td><td class="v" id="rpOH"></td></tr>
        <tr><td>Temperature</td><td class="v">25 °C</td></tr>
      </table>
    </div>

  <div class="row">

    <select id="base"></select>
  </div>
  <div class="row" role="group" aria-label="Presets">
    <span class="lab">Presets:</span>
    <button type="button" id="pStomach">Stomach acid</button>

  <div class="ticks" id="ticks" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 16 Oct 2026).
  // ===========================================================================
  var KW = 1.0e-14, KW_P = 14.00;   // at 25 °C (OpenStax 14.1)
  var BASES = {   // hydroxides per unit: OpenStax 14.2; Exercise 18(d) for Ca(OH)2
    'NaOH':    { n: 1, metal: 'Na', charge: '+',  show: 'NaOH',    name: 'sodium hydroxide',    metalName: 'sodium',    ceil: 0.10,   ceilShow: '0.10' },
    'KOH':     { n: 1, metal: 'K',  charge: '+',  show: 'KOH',     name: 'potassium hydroxide', metalName: 'potassium', ceil: 0.10,   ceilShow: '0.10' },
    'Ca(OH)2': { n: 2, metal: 'Ca', charge: '2+', show: 'Ca(OH)₂', name: 'calcium hydroxide',   metalName: 'calcium',   ceil: 0.0069, ceilShow: '0.0069' }   // OpenStax Appendix J
  };
  var ACID_CEIL = 0.10, LOW = 1.0e-8;                 // the slider's ends and the power of ten beside the center (brief)
  var PRESET = { stomach: 1.0e-3 };                    // HCl 1.0 × 10^-3 M; pure water; Ca(OH)2 at its ceiling

  // Cartoon choices:
  var PAIR_LIFE_S = 2.0, N_WATER = 32, IDLE_STOP_S = 120, PER_DECADE = 3;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var baseKey = 'NaOH', start0 = { side: 0, c: 0 };   // side: -1 acid, +1 base, 0 pure water
  var rawS = (params.get('strong') || '').trim(), rawC = params.get('c'), want = null;
  if (rawS) {
    var norm = rawS.toLowerCase().replace(/[\s()]/g, '');
    if (norm === 'hcl') want = -1;
    else { var hit = Object.keys(BASES).filter(function (k) { return k.toLowerCase().replace(/[()]/g, '') === norm; })[0];
      if (hit) { baseKey = hit; want = 1; } else notices.push('No data for “' + rawS.slice(0, 40) + '” here; showing pure water.'); }
  }
  if (want !== null && rawC !== null && rawC.trim() !== '') {
    var v = Number(rawC), ceil = want < 0 ? ACID_CEIL : BASES[baseKey].ceil;
    if (isFinite(v) && v === 0) start0 = { side: 0, c: 0 };
    else if (isFinite(v) && v >= LOW * (1 - 1e-9) && v <= ceil * (1 + 1e-9)) start0 = { side: want, c: Math.min(v, ceil) };
    else if (isFinite(v) && v > ceil) { start0 = { side: want, c: ceil }; notices.push('The concentration is above this page’s limit; showing ' + (want < 0 ? '0.10' : BASES[baseKey].ceilShow) + ' M.'); }
    else notices.push('The concentration could not be read; showing pure water.');
  }
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }
  var base0 = baseKey;

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry: water's own ions plus the added ones (the brief's formula); pH and pOH kept in hundredths.
  // ===========================================================================
  var st;
  function B() { return BASES[st.base]; }
  function ions() {
    var c = st.side < 0 ? st.c : st.side > 0 ? st.c * B().n : 0;
    var major = (c + Math.sqrt(c * c + 4 * KW)) / 2, minor = KW / major;
    return st.side < 0 ? { h: major, oh: minor } : st.side > 0 ? { h: minor, oh: major } : { h: major, oh: minor };
  }
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }
  function reading() {
    var r = ions(), pH, pOH;
    if (st.side > 0) { pOH = hundredths(-Math.log10(r.oh)); pH = KW_P * 100 - pOH; }
    else { pH = hundredths(-Math.log10(r.h)); pOH = KW_P * 100 - pH; }
    return { h: r.h, oh: r.oh, pH: pH, pOH: pOH };
  }

  // ===========================================================================
  // The slider: s from −8 (HCl 0.10 M) through 0 (pure water) to the base's end (+8 at 0.10 M).
  // |s| from 1 to 8 is a power of ten (c = 10^(|s| − 9)); between 0 and 1, c = 1.0 × 10^-8 × |s|.
  // ===========================================================================
  function sMax() { return 9 + Math.log10(B().ceil); }
  function cOf(s) { var a = Math.abs(s); return a < 1e-9 ? 0 : a <= 1 ? LOW * a : Math.pow(10, a - 9); }
  function sOf(side, c) { if (!side || !c) return 0; var a = c <= LOW ? c / LOW : 9 + Math.log10(c); return side * a; }
  function round2(v) { if (!(v > 0)) return 0; var e = Math.floor(Math.log10(v)); return Math.round(v / Math.pow(10, e) * 10 + 1e-7) / 10 * Math.pow(10, e); }

  // ===========================================================================
  // Formatting: 3 significant figures for the ions, 2 for the added amount, 2 decimals for pH; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function supE(e) { return String(e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function fmtN(v, sf) {
    if (!(v > 0)) return '0';
    var e = Math.floor(Math.log10(v)), k = Math.pow(10, sf - 1), r = Math.round(v / Math.pow(10, e) * k + 1e-7) / k; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(sf - 1) + ' × 10' + supE(e);
    return (r * Math.pow(10, e)).toFixed(Math.max(0, sf - 1 - e));
  }
  function fmt(v) { return fmtN(v, 3); }
  function fmt2(v) { return fmtN(v, 2); }
  function fmtP(h) { var a = Math.abs(h), s = Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); return (h < 0 ? '−' : '') + s; }
  function spoken(t) {
    return t.replace(/( × )?10(⁻?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (a, times, minus, d) { return (times ? ' times ' : '') + '10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); })
      .replace(/−(\d)/g, 'minus $1').replace(/\[H₃O⁺\]|H₃O⁺/g, 'hydronium').replace(/\[OH⁻\]|OH⁻/g, 'hydroxide').replace(/Ca\(OH\)₂/g, 'calcium hydroxide')
      .replace(/(\d) M\b/g, '$1 molar');
  }
  function addedShow() { return st.side === 0 ? 'nothing' : (st.side < 0 ? 'HCl' : B().show) + ' ' + fmt2(st.c) + ' M'; }

  // ===========================================================================
  // The drawing (not to scale). Drawn count for an ion: 2 at 1.0 × 10^-7 M, about 3 more per tenfold step above it,
  // and in proportion below it. Water's own ions come and go in pairs; the added ions stay.
  // ===========================================================================
  var PW = { w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function drawnOf(conc) { var x = Math.log10(conc) + 7; return x >= 0 ? 2 + PER_DECADE * x : 2 * Math.pow(10, x); }
  function pairMean() { var r = ions(); return drawnOf(Math.min(r.h, r.oh)); }   // water's own pairs, on average
  function addedTarget() {   // ions of the added acid or base: the major ion's drawn count less water's share
    if (st.side === 0) return 0;
    var r = ions(), a = Math.max(0, Math.round(drawnOf(Math.max(r.h, r.oh)) - pairMean()));
    if (st.side > 0 && B().n === 2) a = 2 * Math.round(a / 2);
    return a;
  }
  function P(kind, x, y) { return { k: kind, x: x, y: y, vx: rnd(-22, 22), vy: rnd(-22, 22), a: rnd(0, 6.3) }; }
  function count(k, f) { var n = 0; st.parts.forEach(function (p) { if (p.k === k && (!f || f(p))) n++; }); return n; }
  function freeWater() { return st.parts.filter(function (p) { return p.k === 'W' && !p.busy; }); }
  function nearest(list, x, y) { var best = null, bd = Infinity; list.forEach(function (q) { var d = (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y); if (d < bd) { bd = d; best = q; } }); return best; }
  function seedAll() {   // the state at once: water, the added ions, and water's own pairs (rounded)
    st.parts = []; st.moves = [];
    for (var i = 0; i < N_WATER; i++) st.parts.push(P('W', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    placeAdded(addedTarget(), false);
    var pairs = Math.round(pairMean());
    for (i = 0; i < pairs; i++) makePair(false);
  }
  function placeAdded(n, animate) {   // add n ions of the major kind from the acid or base, with their partners
    var acid = st.side < 0, per = acid ? 1 : B().n;
    for (var i = 0; i < n; i += per) {
      var x = rnd(12, PW.w - 12), y = rnd(12, PW.h - 12);
      if (animate) { var u = P(acid ? 'HCl' : 'MOH', x, y); u.added = true; u.wait = rnd(0.2, 0.7); st.parts.push(u); continue; }
      if (acid) { var cl = P('Cl', x, y); cl.added = true; st.parts.push(cl); var h = P('H3O', rnd(12, PW.w - 12), rnd(12, PW.h - 12)); h.added = true; st.parts.push(h); }
      else { var m = P('M', x, y); m.added = true; st.parts.push(m); for (var j = 0; j < per; j++) { var o = P('OH', rnd(12, PW.w - 12), rnd(12, PW.h - 12)); o.added = true; st.parts.push(o); } }
    }
  }
  function removeAdded(n) {   // take away n added major ions, with their partners
    var acid = st.side < 0, major = acid ? 'H3O' : 'OH', partner = acid ? 'Cl' : 'M', per = acid ? 1 : B().n;
    for (var i = 0; i < n; i += per) {
      for (var j = 0; j < per; j++) { var k = st.parts.findIndex(function (p) { return p.k === major && p.added; }); if (k >= 0) st.parts.splice(k, 1); }
      var q = st.parts.findIndex(function (p) { return p.k === partner && p.added; }); if (q >= 0) st.parts.splice(q, 1);
    }
    st.parts = st.parts.filter(function (p) { return !(p.added && (p.k === 'HCl' || p.k === 'MOH') && n > 0); });
  }
  function addedNow() { var acid = st.side < 0; return acid ? count('H3O', function (p) { return p.added; }) + count('HCl') : count('OH', function (p) { return p.added; }) + count('MOH') * B().n; }
  function clearAdded() { st.parts = st.parts.filter(function (p) { return !p.added; }); }
  function makePair(animate) {   // a water molecule passes a proton to a neighbor: hydronium and hydroxide
    var ws = freeWater(); if (ws.length < 2) return;
    var a = ws[Math.floor(Math.random() * ws.length)], b = nearest(ws.filter(function (w) { return w !== a; }), a.x, a.y);
    if (!animate) { a.k = 'OH'; b.k = 'H3O'; a.pair = b; b.pair = a; a.life = b.life = rnd(0.6, 1.4) * PAIR_LIFE_S; return; }
    a.busy = b.busy = true; st.moves.push({ from: a, to: b, t: 0, dur: 0.45, after: function () { a.k = 'OH'; b.k = 'H3O'; a.busy = b.busy = false; a.pair = b; b.pair = a; a.life = b.life = rnd(0.6, 1.4) * PAIR_LIFE_S; } });
  }
  function endPair(p) {   // the pair meets: the proton goes back, two water molecules again
    var q = p.pair; if (!q || q.ending) return; p.ending = q.ending = true;
    st.moves.push({ from: q, to: p, t: 0, dur: 0.5, meet: true, after: function () { p.k = 'W'; q.k = 'W'; p.pair = q.pair = null; p.ending = q.ending = false; delete p.life; delete q.life; } });
  }
  function settleAdded(animate) {   // bring the added ions to the target for the current slider
    var want = addedTarget(), have = addedNow();
    if (want > have) placeAdded(want - have, animate); else if (want < have) removeAdded(have - want);
  }
  function settlePairs() {   // with the drawing paused or reduced, show water's own pairs as their rounded mean
    var want = Math.round(pairMean()), have = count('OH', function (p) { return !!p.pair; });
    while (have > want) { var p = st.parts.find(function (q) { return q.k === 'OH' && q.pair; }); if (!p) break; var q = p.pair; p.k = q.k = 'W'; p.pair = q.pair = null; delete p.life; delete q.life; have--; }
    while (have < want) { var before = have; makePair(false); have = count('OH', function (p) { return !!p.pair; }); if (have === before) break; }
  }

  // ===========================================================================
  // State and time
  // ===========================================================================
  function initState() {
    st = { side: start0.side, c: start0.c, base: base0, running: false, started: false, lastInput: 0, parts: [], moves: [], seeded: false };
  }
  function tick(dt) {
    // added units come apart: HCl gives its proton to the nearest water; a base unit splits into its ions
    st.parts.slice().forEach(function (u) {
      if (u.k !== 'HCl' && u.k !== 'MOH') return;
      u.wait -= dt; if (u.wait > 0 || u.going) return;
      if (u.k === 'HCl') {
        var w = nearest(freeWater(), u.x, u.y); if (!w) { u.k = 'Cl'; var h0 = P('H3O', u.x + 8, u.y); h0.added = true; st.parts.push(h0); return; }
        u.going = true; w.busy = true;
        st.moves.push({ from: u, to: w, t: 0, dur: 0.5, after: function () { u.k = 'Cl'; u.going = false; w.busy = false; w.k = 'H3O'; w.added = true; var nw = P('W', rnd(8, PW.w - 8), rnd(8, PW.h - 8)); st.parts.push(nw); } });
        // keep the water count: the water molecule that took the proton is replaced elsewhere (water is plentiful)
      } else {
        u.k = 'M'; var t = rnd(0, 6.28); u.vx = -22 * Math.cos(t); u.vy = -22 * Math.sin(t);
        for (var i = 0; i < B().n; i++) { var ti = t + (B().n === 2 ? (i ? 0.6 : -0.6) : 0), o = P('OH', u.x + 9 * Math.cos(ti), u.y + 9 * Math.sin(ti)); o.vx = 22 * Math.cos(ti); o.vy = 22 * Math.sin(ti); o.added = true; st.parts.push(o); }
      }
    });
    st.moves.forEach(function (mv) { mv.t += dt; }); st.moves = st.moves.filter(function (mv) { if (mv.t < mv.dur) return true; mv.after(); return false; });
    // water's own pairs: form now and then, and meet again after a while
    var mean = pairMean(), have = count('OH', function (p) { return !!p.pair; });
    if (have < Math.ceil(2 * mean) && Math.random() < mean / (PAIR_LIFE_S + 0.9) * dt) makePair(true);   // on average about mean pairs present
    st.parts.forEach(function (p) { if (p.pair && p.k === 'OH' && !p.ending) { p.life -= dt; if (p.life <= 0) endPair(p); } });
    // movement
    st.parts.forEach(function (p) {
      if (p.busy || p.ending) return;
      p.vx += rnd(-30, 30) * dt; p.vy += rnd(-30, 30) * dt; var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy); if (sp > 26) { p.vx *= 26 / sp; p.vy *= 26 / sp; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += dt * 0.6;
      if (p.x < 9) { p.x = 9; p.vx = Math.abs(p.vx); } if (p.x > PW.w - 9) { p.x = PW.w - 9; p.vx = -Math.abs(p.vx); }
      if (p.y < 9) { p.y = 9; p.vy = Math.abs(p.vy); } if (p.y > PW.h - 9) { p.y = PW.h - 9; p.vy = -Math.abs(p.vy); }
    });
    st.moves.forEach(function (mv) { if (mv.meet) { var f = Math.min(1, mv.t / mv.dur); mv.from.x += (mv.to.x - mv.from.x) * f * 0.25; mv.from.y += (mv.to.y - mv.from.y) * f * 0.25; } });
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }
  function settleAtOnce() {   // reduced motion or paused: finish every change and show the state
    st.moves.slice().forEach(function (mv) { mv.after(); }); st.moves = [];
    st.parts.slice().forEach(function (u) { if (u.k === 'HCl' || u.k === 'MOH') { st.parts.splice(st.parts.indexOf(u), 1); } });
    settleAdded(false); settlePairs();
  }

  // ===========================================================================
  // Drawing helpers
  // ===========================================================================
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  function C(n) { if (!colours) colours = {}; if (!(n in colours)) colours[n] = getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); return colours[n]; }
  function sizeCanvas(cv) {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w || !h) return null;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = C('bg'); ctx.fillRect(0, 0, w, h);
    return { ctx: ctx, W: w, H: h };
  }
  function atom(ctx, x, y, r, f, e) { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = C(f); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = C(e); ctx.stroke(); }
  function charge(ctx, x, y, t) { ctx.font = '700 9px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('fg'); ctx.fillText(t, x, y); }
  function drawWater(ctx, x, y, a) {
    ctx.strokeStyle = C('water'); ctx.lineWidth = 1; var c = Math.cos(a), s = Math.sin(a);
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + c * 4.6 - s * 2.4, y + s * 4.6 + c * 2.4, 2, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - c * 4.6 - s * 2.4, y - s * 4.6 + c * 2.4, 2, 0, 2 * Math.PI); ctx.stroke();
  }
  function drawMetal(ctx, x, y, b) { atom(ctx, x, y, 7.2, b.metal.toLowerCase(), 'metal-edge'); ctx.font = '700 8px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('sign'); ctx.fillText(b.metal, x, y + 0.5); }
  function drawOH(ctx, x, y, a) { var c = Math.cos(a), s = Math.sin(a); atom(ctx, x, y, 4.6, 'o', 'o-edge'); atom(ctx, x + c * 5.2, y + s * 5.2, 2.8, 'h', 'h-edge'); }
  function drawP(ctx, p, b) {
    var x = p.x, y = p.y, c = Math.cos(p.a), s = Math.sin(p.a);
    if (p.k === 'W') return drawWater(ctx, x, y, p.a);
    if (p.k === 'HCl') { atom(ctx, x - c * 3, y - s * 3, 6, 'cl', 'cl-edge'); if (!p.going) atom(ctx, x + c * 5.6, y + s * 5.6, 3, 'h', 'h-edge'); return; }
    if (p.k === 'Cl') { atom(ctx, x, y, 6, 'cl', 'cl-edge'); ctx.strokeStyle = C('sign'); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x - 2.4, y); ctx.lineTo(x + 2.4, y); ctx.stroke(); charge(ctx, x + 7, y - 7, '−'); return; }
    if (p.k === 'H3O') { atom(ctx, x, y, 4.8, 'o', 'o-edge'); for (var i = 0; i < 3; i++) { var t = p.a + i * 2.094; atom(ctx, x + Math.cos(t) * 5.4, y + Math.sin(t) * 5.4, 2.6, 'h', 'h-edge'); } charge(ctx, x + 7, y - 7, '+'); return; }
    if (p.k === 'OH') { drawOH(ctx, x, y, p.a); charge(ctx, x + 6, y - 7, '−'); return; }
    if (p.k === 'MOH') { drawMetal(ctx, x, y, b); drawOH(ctx, x + 10, y + (b.n === 2 ? -5 : 0), 0); if (b.n === 2) drawOH(ctx, x - 10, y + 5, Math.PI); return; }
    if (p.k === 'M') { drawMetal(ctx, x, y, b); charge(ctx, x + 7, y - 8, b.charge); }
  }

  // ---------------------------------------------------------------------------
  // The two bars on one power-of-ten scale
  // ---------------------------------------------------------------------------
  var barsCv = document.getElementById('bars');
  function drawBars() {
    var cv = sizeCanvas(barsCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, r = ions();
    var x0 = 34, top = 12, bot = H - 22, ph = bot - top, yOf = function (e) { return bot - (e + 14) / 14 * ph; };   // 10^-14 at the bottom, 10^0 at the top
    ctx.font = '10px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.strokeStyle = C('grid'); ctx.lineWidth = 1;
    for (var e = -14; e <= 0; e += 2) { var y = yOf(e); ctx.beginPath(); ctx.moveTo(x0, y + 0.5); ctx.lineTo(W - 6, y + 0.5); ctx.stroke(); ctx.fillStyle = C('muted'); ctx.fillText(e === 0 ? '1' : '10' + supE(e), x0 - 4, y); }
    var y7 = yOf(-7); ctx.setLineDash([3, 3]); ctx.strokeStyle = C('muted'); ctx.beginPath(); ctx.moveTo(x0, y7 + 0.5); ctx.lineTo(W - 6, y7 + 0.5); ctx.stroke(); ctx.setLineDash([]);
    [[r.h, 'hbar', '[H₃O⁺]', false], [r.oh, 'ohbar', '[OH⁻]', true]].forEach(function (b, i) {
      var bx = x0 + 22 + i * 82, bw = 46, e = Math.log10(b[0]), yt = yOf(Math.max(-14, Math.min(0, e))), bh = bot - yt;
      ctx.fillStyle = C(b[1]);
      if (!b[3]) ctx.fillRect(bx, yt, bw, bh);
      else { ctx.save(); ctx.beginPath(); ctx.rect(bx, yt, bw, bh); ctx.clip(); ctx.strokeStyle = C(b[1]); ctx.lineWidth = 2.5;
        for (var k = -bh; k < bw + bh; k += 6) { ctx.beginPath(); ctx.moveTo(bx + k, bot); ctx.lineTo(bx + k + bh, yt); ctx.stroke(); } ctx.restore();
        ctx.strokeStyle = C(b[1]); ctx.lineWidth = 2; ctx.strokeRect(bx + 1, yt + 1, bw - 2, Math.max(0, bh - 2)); }
      ctx.font = '600 10px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = C('fg');
      ctx.fillText(fmt2(b[0]), bx + bw / 2, yt - 1);
      ctx.textBaseline = 'top'; ctx.font = '600 11px ' + FONT; ctx.fillText(b[2], bx + bw / 2, bot + 4);
    });
    ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(x0, bot + 0.5); ctx.lineTo(W - 6, bot + 0.5); ctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // The panel: the particles
  // ---------------------------------------------------------------------------
  var panelCv = document.getElementById('panel');
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, b = B();
    var nw = { w: W - 12, h: H - 18 - 22 };
    if (PW.w && (PW.w !== nw.w || PW.h !== nw.h)) st.parts.forEach(function (p) { p.x *= nw.w / PW.w; p.y *= nw.h / PW.h; });
    PW = nw;
    if (!st.seeded) { seedAll(); st.seeded = true; }
    ctx.font = '600 11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C('fg');
    ctx.fillText('In the water (a drawing)', 6, 3);
    ctx.textAlign = 'right'; ctx.fillText('Intact units: ' + (count('HCl') + count('MOH')), W - 6, 3);
    ctx.save(); ctx.translate(6, 18);
    ctx.fillStyle = C('win-bg'); ctx.fillRect(0, 0, PW.w, PW.h); ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, PW.w - 1, PW.h - 1);
    ctx.beginPath(); ctx.rect(0, 0, PW.w, PW.h); ctx.clip();
    st.parts.forEach(function (p) { if (p.k === 'W') drawP(ctx, p, b); });
    st.parts.forEach(function (p) { if (p.k !== 'W') drawP(ctx, p, b); });
    st.moves.forEach(function (mv) {   // a proton on its way
      if (mv.meet) return;
      var f = Math.min(1, mv.t / mv.dur); atom(ctx, mv.from.x + (mv.to.x - mv.from.x) * f, mv.from.y + (mv.to.y - mv.from.y) * f, 3, 'h', 'h-edge');
    });
    ctx.restore();
    var y = H - 11, x = 14; ctx.font = '11px ' + FONT; ctx.textBaseline = 'middle';
    function item(kind, label, w) { drawP(ctx, { k: kind, x: x, y: y, a: 0 }, b); ctx.font = '11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('fg'); ctx.fillText(label, x + 12, y); x += w; }
    item('H3O', 'H₃O⁺', 52); item('OH', 'OH⁻', 48); item('Cl', 'Cl⁻', 44); item('M', b.metal + (b.charge === '+' ? '⁺' : '²⁺'), 50);
    drawWater(ctx, x, y, 0); ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.fillText('water (faint)', x + 10, y);
  }

  // ===========================================================================
  // Text
  // ===========================================================================
  var el = function (id) { return document.getElementById(id); };
  function readout() {
    var r = reading();
    return 'Added: ' + addedShow() + '; H₃O⁺ ' + fmt(r.h) + ' M; OH⁻ ' + fmt(r.oh) + ' M; their product ' + fmt2(r.h * r.oh) + '; pH ' + fmtP(r.pH) + '; pOH ' + fmtP(r.pOH) + '.';
  }
  function statusText() {
    var out = st.side === 0 ? 'Pure water: nothing added.' : (st.side < 0 ? 'HCl' : B().show) + ' added: ' + fmt2(st.c) + ' M.';
    if (st.running) out += ''; else if (!isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch the water.';
    return out;
  }
  function captionText() {
    return 'Each drawn particle stands for a great many. Drawing not to scale: an ion drawn twice at 1.0 × 10⁻⁷ M gains about ' + PER_DECADE +
      ' for each tenfold step above it; below 1.0 × 10⁻⁷ M it is drawn in proportion, so it shows only now and then.';
  }
  function edgeText() {
    var atL = st.side < 0 && st.c >= ACID_CEIL * (1 - 1e-9), atR = st.side > 0 && st.c >= B().ceil * (1 - 1e-9);
    if (atL) return 'The slider stops at 0.10 M HCl.';
    if (atR) return st.base === 'Ca(OH)2' ? 'Calcium hydroxide dissolves only to about 0.0069 M.' : 'The slider stops at 0.10 M ' + B().show + '.';
    return '';
  }
  function describeBars() {
    var r = reading();
    return spoken('Two bars on one power-of-ten scale from 10⁻¹⁴ at the bottom to 1 at the top, with a dashed line at 10⁻⁷. The hydronium bar reaches ' +
      fmt(r.h) + ' M and the hydroxide bar reaches ' + fmt(r.oh) + ' M; together their heights fill the scale. ' + readout());
  }
  function describePanel() {
    var b = B(), pairs = count('OH', function (p) { return !!p.pair; });
    return spoken('A drawing of the water, with water molecules drawn faintly. It shows ' + count('H3O') + ' hydronium ions (an oxygen with three hydrogens), ' +
      count('OH') + ' hydroxide ions (an oxygen with one hydrogen), ' + count('Cl') + ' chloride ions, and ' + count('M') + ' ' + b.metalName + ' ions. ' +
      (pairs ? pairs + (pairs === 1 ? ' hydronium and hydroxide pair was' : ' hydronium and hydroxide pairs were') + ' made by water passing a proton to water. ' : '') +
      'Intact units: ' + (count('HCl') + count('MOH')) + '.');
  }
  var live = el('live');
  function say(msg) { live.textContent = ''; setTimeout(function () { live.textContent = spoken(msg); }, 30); }
  // Safari cancels a click if a button's text is rewritten between press and release, so text, attributes and
  // control values are written only when they change (the page redraws many times a second while running).
  function setText(id, t) { var e = el(id); if (e.textContent !== t) e.textContent = t; }
  function setAttr(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setHidden(id, h) { var e = el(id); if (e.hidden !== h) e.hidden = h; }
  function setDisabled(id, d) { var e = el(id); if (e.disabled !== d) e.disabled = d; }
  function setNum(e, n, v) { if (Math.abs(Number(e[n]) - Number(v)) > 1e-9 || e[n] === '') e[n] = String(v); }
  function updateText() {
    var r = reading();
    setText('rAdd', addedShow()); setText('rH', fmt(r.h) + ' M'); setText('rOH', fmt(r.oh) + ' M');
    setText('rKw', fmt2(r.h * r.oh)); setText('rpH', fmtP(r.pH)); setText('rpOH', fmtP(r.pOH));
    setText('status', statusText()); setText('caption', captionText());
    setText('descBars', describeBars()); setText('descPanel', describePanel());
    var ed = edgeText(); setText('limit', ed); setHidden('limit', !ed);
    setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    var sl = el('amt'), s = st.side * (st.side ? sOf(1, st.c) : 0);
    setNum(sl, 'min', '-8'); setNum(sl, 'max', String(sMax())); setNum(sl, 'value', s);
    setAttr(sl, 'aria-valuetext', st.side === 0 ? 'pure water, nothing added' : spoken((st.side < 0 ? 'hydrochloric acid' : B().name) + ', ' + fmt2(st.c) + ' M'));
    setText('baseEnd', B().show); if (el('base').value !== st.base) el('base').value = st.base;
  }

  // ===========================================================================
  // Loop
  // ===========================================================================
  var rafId = null, lastT = 0;
  function render() { drawBars(); drawPanel(); updateText(); }
  function frame(t) { rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; tick(dt); render(); schedule(); }
  function schedule() { if (st.running && !isReduced() && !rafId) rafId = requestAnimationFrame(frame); }
  function start() { st.lastInput = performance.now(); st.started = true; if (isReduced()) return; if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (st.seeded) settleAtOnce(); render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  var restTimer = null;
  function setState(side, c, baseKey2) {   // a new state from the slider, a preset or the menu
    var oldSide = st.side, oldBase = st.base;
    if (baseKey2) st.base = baseKey2;
    if (side > 0) c = Math.min(c, B().ceil);
    st.side = c > 0 ? side : 0; st.c = c > 0 ? c : 0; st.lastInput = performance.now();
    if (st.seeded) {
      if (oldSide !== st.side || oldBase !== st.base) clearAdded();   // the added ions belong to the old substance
      if (st.running && !isReduced()) settleAdded(true); else settleAtOnce();
    }
    render();
    if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say(readout()); }, 600);
  }
  function setS(s) {
    var lo = -8, hi = sMax(); s = Math.max(lo, Math.min(hi, s));
    var side = s < -1e-9 ? -1 : s > 1e-9 ? 1 : 0, c = cOf(s);
    if (Math.abs(s) >= 1 - 1e-9) c = Math.abs(s - hi) < 1e-9 && side > 0 ? B().ceil : Math.abs(s - lo) < 1e-9 ? ACID_CEIL : round2(c); else c = round2(c);
    setState(side, c);
  }
  var slider = el('amt');
  slider.addEventListener('input', function () { setS(Number(slider.value)); });
  slider.addEventListener('keydown', function (e) {
    var s = st.side ? st.side * sOf(1, st.c) : 0, k = e.key, lo = -8, hi = sMax();
    var shown = function (y) { var c = cOf(y); return (y < 0 ? '-' : y > 0 ? '+' : '0') + fmt2(Math.min(y > 0 ? B().ceil : ACID_CEIL, c)); };
    if (k === 'ArrowUp' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft') {   // a tenth of a power of ten, to the next value that reads differently
      var up = k === 'ArrowUp' || k === 'ArrowRight', y = up ? Math.floor(s * 10 + 1e-6) / 10 : Math.ceil(s * 10 - 1e-6) / 10;
      for (var i = 0; i < 4; i++) { y = Math.round((y + (up ? 0.1 : -0.1)) * 10) / 10; if (shown(y) !== shown(s) || y <= lo || y >= hi) break; }
      s = y;
    } else if (k === 'PageUp') s = s + 1; else if (k === 'PageDown') s = s - 1; else if (k === 'Home') s = lo; else if (k === 'End') s = hi; else return;
    e.preventDefault(); setS(s);
  });
  Object.keys(BASES).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = BASES[k].show; el('base').appendChild(o); });
  el('base').addEventListener('change', function () { var k = el('base').value; if (!BASES[k]) return; setState(st.side, st.c, k); ticks(); say('Base menu: ' + BASES[k].name + '. ' + readout()); });
  el('pStomach').addEventListener('click', function () { setState(-1, PRESET.stomach); say('Stomach acid preset. ' + readout()); });
  el('pWater').addEventListener('click', function () { setState(0, 0); say('Pure water preset. ' + readout()); });
  el('pLime').addEventListener('click', function () { setState(1, BASES['Ca(OH)2'].ceil, 'Ca(OH)2'); ticks(); say('Lime soak preset. ' + readout()); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(); ticks(); render(); say('Reset. ' + readout()); });
  function ticks() {   // a tick at each power of ten; labels at every second one, and at the center
    var box = el('ticks'), lo = -8, hi = sMax(), html = '', sl = el('amt'), endL = sl.previousElementSibling, endR = sl.nextElementSibling;
    var put = function (s, lab) { var f = (s - lo) / (hi - lo); html += '<span style="left: calc(8px + ' + f.toFixed(4) + ' * (100% - 16px))">' + lab + '</span>'; };
    for (var a = 1; a <= 8; a++) { var lab = (a % 2 === 0) ? '10' + supE(a - 9) : ''; put(-a, lab); if (a <= hi + 1e-9) put(a, lab); }
    put(0, 'water');
    box.innerHTML = html;
    box.style.marginLeft = (endL.offsetWidth + 8) + 'px'; box.style.marginRight = (endR.offsetWidth + 8) + 'px';
  }

  // ===========================================================================
  // Start: the problem's own state, paused.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) stop(); render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  initState();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render(); ticks(); render();
})();
</script>
</body>
