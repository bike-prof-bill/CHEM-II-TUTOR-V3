<title>Radioactive decay</title>
<!--
  DRAFT: not for students until the instructor approves it.
  Date: 18 Oct 2026. Built by Simulation_Claude to 02_BRIEF_decay_page.md (SCENARIO_CLAUDE, 18 Oct 2026) on buffer_simulator.html
    (98b62a53: shell, colours, readings, guarded setters), titration_simulator.html (61254251: the curve with a marked point),
    entropy_simulator.html (5dbf18b4: random particles that start paused), electrolysis_simulator.html (569656a5: time with
    units, the "time needed" mode).
  Brief (one line): ch21_decay, opens at the meaning question: first-order decay, λ = ln 2 ÷ t½, Nt/N0 = e^(−λt),
    t = −(1/λ) ln(Nt/N0); for rocks N0 = parent now + daughter, in moles. No "never reaches zero", no reason sentences.
  Data source: the brief's table only (Appendix M; Table 21.2 for Tc-99m and F-18); λ computed as ln 2 ÷ t½. Rock molar masses
    are the mass numbers (U-238 238, Pb-206 206, Rb-87 87, Sr-87 87), as Example 21.7 does.
  Model: exact. Readouts to 4 significant figures (ratios to 4 decimals); ages in scientific notation from 10⁴ up.
    The nuclei: each of the 100 is given one random lifetime, −ln(u)/λ, when the sample is made; at time t it is drawn open if
    its lifetime is shorter. This has the same statistics as the brief's per-step probability 1 − e^(−λΔt) (decay has no
    memory) and stays the same sample when the slider moves back.
  URL parameters:
    mode     decay | dating | rock. Default decay.
    isotope  Co-60 Sr-90 Rn-222 P-32 I-131 Na-24 Tc-99m F-18 C-14 U-238 Rb-87. Default Co-60.
    t        in the isotope's own unit, 0 to 6 half-lives. Default one half-life.
    ratio    Nt/N0 for dating, more than 0 and at most 1. Default 0.5.
    m0       g, the starting mass (optional; mass left is shown only when it is given).
    parent   U-238 | Rb-87 (rock mode). Default U-238.
    gp, gd   g of parent now and of daughter (rock mode). Defaults 9.58e-05 and 2.51e-05 (problem OR1).
    theme    light | dark. Default: the system setting.
  Drawing choices (not data): 100 nuclei in a 10 × 10 grid, filled while undecayed and open after, with a brief flash; Play
    runs one half-life every 2 s up to 6 half-lives (decay mode) or up to the found time (dating and rock modes).
    The opening sample uses a fixed seed chosen so its counts sit near the expected curve; each Reset sample draws a new one.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Play.

  <p class="notice" id="notice" role="status" hidden></p>

  </div>

<script>
(function () {

  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

    var Xp = function (h) { return px0 + h / Tm * (px1 - px0); }, Yp = function (f) { return py1 - f * (py1 - py0); };

    ctx.font = '600 10px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('b. Nt/N0 against t (' + x.id + ', t½ = ' + sig(x.half, 4) + ' ' + x.unit + ')', px0, 3);
    ctx.font = '10px ' + FONT; ctx.fillStyle = C('muted');

  }

  // ===========================================================================

    setText('rE', sig(100 * r.f, 4)); setText('rC', String(counted(h)) + (st.td !== null && Math.abs(st.td - r.t) > 1e-12 * x.half ? ' (at ' + sig(h, 3) + ' t½)' : ''));
    setHidden('rowM', !(st.mode === 'decay' && st.m0)); if (st.mode === 'decay' && st.m0) setText('rM', sig(st.m0 * r.f, 4) + ' g of ' + sig(st.m0, 4) + ' g');
    setHidden('isoRow', rock); setHidden('rockRow', !rock); setHidden('m0Box', st.mode !== 'decay'); setHidden('ratioBox', st.mode !== 'dating'); setHidden('tRow', st.mode !== 'decay');
    if (el('mode').value !== st.mode) el('mode').value = st.mode; if (el('isotope').value !== st.iso) el('isotope').value = st.iso; if (el('parent').value !== st.parent) el('parent').value = st.parent;
    var s = el('t'), p = String(Math.round(Math.min(st.t, 6 * x.half) / x.half * 100)); if (s.value !== p) s.value = p;
    setText('vT', tText(st.t, x)); setAttr(s, 'aria-valuetext', tText(st.t, x) + ', ' + sig(st.t / x.half, 3) + ' half-lives');
    [['m0', st.m0 === null ? '' : String(st.m0)], ['ratio', String(st.ratio)], ['gp', String(st.gp)], ['gd', String(st.gd)]].forEach(function (f) { var e = el(f[0]); if (document.activeElement !== e && e.value !== f[1]) e.value = f[1]; });
    var out = x.name + ', t½ = ' + sig(x.half, 4) + ' ' + x.unit + ', ' + st.mode + ' mode. ' + (st.running ? 'Time is running.' : 'Readings are steady.');
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch.';
    setText('status', out); setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    setText('caption', 'a. Each nucleus has the same chance of decaying in each moment; drawn 100 at a time; random, so counts vary. Filled: undecayed; open' + (rock ? ' (gold): decayed to ' + ROCK[st.parent].daughter : ': decayed') + '.' + (rock ? ' Rock mode takes all the daughter as made by the parent, with none at the start.' : ''));
    setText('caption2', 'b. Nt/N0 = exp(−λt); marks at each half-life and at ½, ¼ and ⅛; the marked point is at ' + (st.mode === 'decay' ? 'the slider position.' : 'the ratio.'));
    setText('quick', 'Quick start: press Play, choose a mode and an isotope, then set the time, the ratio or the masses.');
    setText('descScene', 'A 10 by 10 grid of nuclei: ' + counted(h) + ' filled (undecayed) and ' + (100 - counted(h)) + ' open (decayed), at ' + sig(h, 3) + ' half-lives; expected ' + sig(100 * Math.pow(2, -h), 3) + '.');
    setText('descPanel', 'Curve of Nt/N0 against time from 0 to 6 half-lives, halving at each half-life mark. The marked point is at ' + sig(Math.min(6, r.t / x.half), 3) + ' half-lives, Nt/N0 = ' + r.f.toFixed(4) + (r.t / x.half > 6 ? '; the time is beyond the plotted range.' : '.'));
  }

  // ===========================================================================
  // Loop: one half-life every 2 s
  // ===========================================================================
  var rafId = null, lastT = 0;
  function render() { drawScene(); drawPanel(); updateText(); }
  function target() { var x = X(); return st.mode === 'decay' ? 6 * x.half : result().t; }
  function frame(t) {
    rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; clockS += dt;
    var x = X(), before = (st.mode === 'decay' ? st.t : st.td) / x.half, now = Math.min(target(), (st.mode === 'decay' ? st.t : st.td) + dt / PLAY_S_PER_HALF * x.half);
    if (st.mode === 'decay') st.t = now; else st.td = now;
    for (var i = 0; i < 100; i++) if (life[i] > before && life[i] <= now / x.half) flashAt[i] = clockS;
    render();
    if (now >= target()) { st.running = false; if (st.mode !== 'decay') st.td = null; render(); say(readout()); return; }
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); return; }
    rafId = requestAnimationFrame(frame);
  }
  function start() {
    if (isReduced()) return; st.lastInput = performance.now(); st.started = true; st.running = true; lastT = performance.now();

    if (!rafId) rafId = requestAnimationFrame(frame); render();
  }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (st.mode !== 'decay') st.td = null; render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  var restTimer = null;
  function changed(msg) { st.lastInput = performance.now(); render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500); }
  function fresh() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } st.running = false; st.td = null; newSample(); }
  ISOTOPES.forEach(function (x) { var o = document.createElement('option'); o.value = x.id; o.textContent = x.id + ' (t½ ' + sig(x.half, 3) + ' ' + x.unit + ')'; el('isotope').appendChild(o); });
  el('mode').addEventListener('change', function () { st.mode = el('mode').value; fresh(); changed('Mode: ' + st.mode + '.'); });
  el('isotope').addEventListener('change', function () { st.iso = el('isotope').value; st.t = byId[st.iso].half; fresh(); changed('Now ' + byId[st.iso].name + '.'); });
  el('parent').addEventListener('change', function () { st.parent = el('parent').value; fresh(); changed('Parent ' + st.parent + '.'); });
  el('t').addEventListener('input', function () { st.t = parseInt(el('t').value, 10) / 100 * X().half; changed(''); });
  el('t').addEventListener('keydown', function (e) {
    var k = Math.round(st.t / X().half * 100), ok = true; switch (e.key) { case 'ArrowRight': case 'ArrowUp': k += 1; break; case 'ArrowLeft': case 'ArrowDown': k -= 1; break; case 'PageUp': k += 25; break; case 'PageDown': k -= 25; break; case 'Home': k = 0; break; case 'End': k = 600; break; default: ok = false; }
    if (ok) { e.preventDefault(); st.t = Math.max(0, Math.min(600, k)) / 100 * X().half; changed(''); }
  });
  [['m0', function (v) { return v > 0; }], ['ratio', function (v) { return v > 0 && v <= 1; }], ['gp', function (v) { return v > 0; }], ['gd', function (v) { return v >= 0; }]].forEach(function (f) {
    el(f[0]).addEventListener('change', function () { var raw = el(f[0]).value, v = parseFloat(raw); if (f[0] === 'm0' && raw.trim() === '') st.m0 = null; else if (isFinite(v) && f[1](v)) st[f[0]] = v; changed(''); });
  });
  el('reset').addEventListener('click', function () { fresh(); if (st.mode === 'decay') st.t = 0; changed('A fresh sample of 100.'); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });

  applyTheme(); newSample();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
