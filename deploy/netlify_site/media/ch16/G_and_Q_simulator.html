    for (var i = 0; i < n; i++) { var a1 = a0 + Math.PI * 2 / n; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a0, a1); ctx.closePath(); ctx.fillStyle = EL[els[i]]; ctx.fill(); a0 = a1; }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = C('fg'); ctx.lineWidth = 0.8; ctx.stroke();
    if (qq) { var bx = x + r * 0.85, by = y - r * 0.85; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 3.4, 0, 6.28); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 0.7; ctx.stroke(); ctx.fillStyle = '#000'; ctx.font = '700 7.5px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(qq, bx, by + 0.4); }
  }
  var tAnim = 0;
  function tick(dt) {
    var d = cur(), fl = floorY(d);
    tAnim += dt;
    parts.forEach(function (p) {
      var v;
      if (p.sp.st === 'g') { v = 30 * Math.min(2.2, Math.max(0.45, Math.sqrt(30 / (MASS[p.sp.key] || 30)))); if (rand() < 0.8 * dt) { var g = rand() * 6.283; p.vx = Math.cos(g); p.vy = Math.sin(g); } }   // a gas: free flight, with an occasional collision that turns it
      else { v = 9; if (rand() < 5 * dt) { var a = rand() * 6.283; p.vx = Math.cos(a); p.vy = Math.sin(a); } }   // dissolved ions: short wandering steps
      p.x += p.vx * v * dt; p.y += p.vy * v * dt;
      if (p.x < 8) { p.x = 8; p.vx = Math.abs(p.vx); } if (p.x > PW.w - 8) { p.x = PW.w - 8; p.vx = -Math.abs(p.vx); }
      if (p.y < 8) { p.y = 8; p.vy = Math.abs(p.vy); } if (p.y > fl - 8) { p.y = fl - 8; p.vy = -Math.abs(p.vy); }
    });
    spread();
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, d = cur(), nw = { w: W - 8, h: H - 18 };
    if (PW.w && (PW.w !== nw.w || PW.h !== nw.h)) parts.forEach(function (p) { p.x *= nw.w / PW.w; p.y *= nw.h / PW.h; });
    var first = !PW.w; PW = nw; if (first || !st.seeded) { buildParticles(); st.seeded = true; } else if (st.resync) { syncCounts(); } st.resync = false;
    ctx.font = '600 10px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C('fg');
    ctx.fillText('b. The mixture: a simulated sketch, not to scale', 4, 3);
    ctx.save(); ctx.translate(4, 16);
    ctx.fillStyle = C('win-bg'); ctx.fillRect(0, 0, PW.w, PW.h);
    if (d.species.some(function (x) { return x.st === 'aq'; })) { ctx.fillStyle = C('water-tint'); ctx.fillRect(0, 0, PW.w, PW.h); }
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, PW.w - 1, PW.h - 1);
    ctx.beginPath(); ctx.rect(0, 0, PW.w, PW.h); ctx.clip();
    var pure = d.species.filter(function (x) { return x.st === 'l' || x.st === 's'; });
    ctx.font = '10px ' + FONT;
    if (!activeSpecies(d).length) {   // only pure solids: each fills half the box as a lattice
      var hw = PW.w / pure.length;
      pure.forEach(function (x, i) { var bx = i * hw; ctx.fillStyle = C('layer'); ctx.fillRect(bx + 1, 1, hw - 2, PW.h - 2);
        var gr = x.key === 'Cgrap';   // graphite in flat layers, diamond as a staggered 3-D lattice
        for (var r = 0; r < 5; r++) for (var c = 0; c < Math.floor((hw - 16) / 9); c++) glyph(ctx, 'C', bx + 10 + c * 9 + (!gr && r % 2 ? 4.5 : 0), 12 + r * (gr ? 15 : 11), null);
        ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(x.f + ', pure solid', bx + 6, PW.h - 10); });
      ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(Math.round(hw) + 0.5, 0); ctx.lineTo(Math.round(hw) + 0.5, PW.h); ctx.stroke();
      ctx.restore(); return;
    }
    if (pure.length) {   // a layer along the bottom
      var y0 = PW.h - 20; ctx.fillStyle = C('layer'); ctx.fillRect(1, y0, PW.w - 2, PW.h - 1 - y0);
      ctx.strokeStyle = C('rule'); ctx.setLineDash(pure[0].st === 'l' ? [4, 3] : []); ctx.beginPath(); ctx.moveTo(1, y0 + 0.5); ctx.lineTo(PW.w - 1, y0 + 0.5); ctx.stroke(); ctx.setLineDash([]);
      var ION = { AgCl: ['Ag', 'Cl'], KCl: ['K', 'Cl'], NaCl: ['Na', 'Cl'] };
      var xx = 10; pure.forEach(function (x) { for (var k = 0; k < 10; k++) { var gx = xx + k * 13 + (x.st === 'l' ? Math.sin(tAnim * 2 + k) * 1.5 : 0); if (ION[x.key]) glyph(ctx, ION[x.key][k % 2], gx, y0 + 10, null); else glyph(ctx, glyphKey(x), gx, y0 + 10, null); } xx += 136; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(x.f + (x.st === 'l' ? ', pure liquid' : ', pure solid'), xx, y0 + 10); xx += 130; });
    }
    parts.forEach(function (p) { glyph(ctx, glyphKey(p.sp), p.x, p.y, p.sp.q); });
    var ov = overVP();
    if (ov.length) {   // dashed border and a band naming the species above its vapor pressure
      ctx.strokeStyle = C('fg'); ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.strokeRect(0.75, 0.75, PW.w - 1.5, PW.h - 1.5); ctx.setLineDash([]);
      var txt = vpText(ov); ctx.font = '600 9px ' + FONT; var tw = ctx.measureText(txt).width + 12;
      ctx.fillStyle = C('band'); ctx.fillRect((PW.w - tw) / 2, 1.5, tw, 12); ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, PW.w / 2, 8);
    }
    ctx.restore();
  }

  // ===========================================================================
  // Sliders: powers of ten; arrows a tenth of a power, Page keys a whole power, Home and End the ends
  // ===========================================================================
  var sliderEls = {};
  function posFromVal(v) { return Math.round(Math.log10(v) * 100); }   // hundredths of a power of ten, −600 to 200
  function valFromPos(p) { var v = Math.pow(10, p / 100), e = Math.floor(Math.log10(v)); return Math.round(v / Math.pow(10, e - 2)) * Math.pow(10, e - 2); }
  function unitFor(x) { return x.st === 'g' ? 'atm' : 'mol/L'; }
  function buildSliders() {
    var box = el('sliders'); box.textContent = ''; sliderEls = {};
    cur().species.forEach(function (x) {
      var row = document.createElement('div'); row.className = 'sl';
      var lab = document.createElement('label'); lab.textContent = (x.st === 'g' ? 'P(' + x.f + ')' : x.st === 'aq' ? '[' + x.f + ']' : x.f); row.appendChild(lab);
      if (x.st === 'g' || x.st === 'aq') {
        var id = 's_' + x.key; lab.htmlFor = id;
        var inp = document.createElement('input'); inp.type = 'range'; inp.id = id; inp.min = '-600'; inp.max = String(pmax(x)); inp.step = '1'; inp.value = String(posFromVal(vals[x.key]));
        var out = document.createElement('span'); out.className = 'val'; out.setAttribute('aria-hidden', 'true');
        row.appendChild(inp); row.appendChild(out);
        inp.addEventListener('input', function () { vals[x.key] = valFromPos(parseInt(inp.value, 10)); changed(''); });
        inp.addEventListener('keydown', function (e) {
          var p = posFromVal(vals[x.key]), ok = true;
          switch (e.key) { case 'ArrowRight': case 'ArrowUp': p += 10; break; case 'ArrowLeft': case 'ArrowDown': p -= 10; break; case 'PageUp': p += 100; break; case 'PageDown': p -= 100; break; case 'Home': p = -600; break; case 'End': p = pmax(x); break; default: ok = false; }
          if (ok) { e.preventDefault(); p = Math.max(-600, Math.min(pmax(x), p)); vals[x.key] = valFromPos(p); changed(''); }
        });
        sliderEls[x.key] = { inp: inp, out: out, x: x };
      } else {
        var fx = document.createElement('span'); fx.className = 'fixed'; fx.textContent = 'pure ' + (x.st === 'l' ? 'liquid' : 'solid') + ': left out of Q'; row.appendChild(fx);
      }
      box.appendChild(row);
    });
    panelCv.style.height = (cur().species.length >= 3 ? 96 : 114) + 'px';   // the layout budget: the page height stays put between reactions
  }

  // ===========================================================================
  // State, text, loop
  // ===========================================================================
  var st = { running: false, started: false, lastInput: 0, seeded: false, resync: false };
  function readout() { var d = cur(), lq = logQ(d, vals); return 'Q ' + (activeSpecies(d).length ? sci(Math.pow(10, lq)) : '1') + ', ΔG ' + fmt2(dG(d, lq)) + ' kJ, K ' + sci(Math.exp(-d.g0 * 1000 / (R * TK))) + '.'; }
  function legend(d) {
    var ION = { AgCl: 'silver and chloride ions', KCl: 'potassium and chloride ions', NaCl: 'sodium and chloride ions' };
    return d.species.map(function (x) {
      if (ION[x.key]) return x.f + ': ' + ION[x.key];
      var g = GLYPH[glyphKey(x)] || [], n = {}; g.forEach(function (a) { n[a[0]] = (n[a[0]] || 0) + 1; });
      return x.f + ': ' + Object.keys(n).map(function (e) { return n[e] + ' ' + ELNAME[e]; }).join(', ') + (x.q ? ', charge ' + x.q : '');
    }).join('; ');
  }
  function updateText() {
    var d = cur(), act = activeSpecies(d), lq = logQ(d, vals), Q = Math.pow(10, lq), K = Math.exp(-d.g0 * 1000 / (R * TK)), g = dG(d, lq), lk = logK(d);
    setText('title', 'ΔG and Q at 298 K: ' + d.label);
    setText('rG0', fmt2(d.g0) + ' kJ'); setText('rQ', act.length ? sci(Q) : '1 (fixed)'); setText('rG', fmt2(g) + ' kJ'); setText('rK', sci(K));
    Object.keys(sliderEls).forEach(function (k) {
      var s = sliderEls[k], v = vals[k], p = String(posFromVal(v));
      if (s.inp.value !== p) s.inp.value = p;
      setText(s.out, sci(v) + ' ' + unitFor(s.x));
      setAttr(s.inp, 'aria-valuetext', spoken(sci(v) + ' ' + unitFor(s.x)));
    });
    var out = 'Showing ' + d.label + ' at 298 K.' + (act.length ? '' : ' No gas or aqueous species; Q stays 1.') + ' Readings are steady.';
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch.';
    setText('status', out);
    setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    if (el('reaction').value !== rid) el('reaction').value = rid;
    setText('caption', el('view').value === 'p' ? 'a. G of the mixture against reaction progress at 298 K, simulated (amounts in mol equal to the slider values; gases at constant total pressure); ring at Q = K; at the slider positions the short line has slope ΔG.' : 'a. ΔG against log Q at 298 K, simulated; ring at Q = K; marked point at the slider positions; tints mark ΔG above and below zero.');
    setText('caption2', 'b. Particles represent ensembles; each count follows its own slider on a log scale (1 at 10⁻⁶, 25 at 1, 33 at 100); not to scale; gas speeds at 298 K follow the molar mass; a pure liquid or solid is a layer at the bottom, left out of Q; spectator ions not depicted; motion slowed. Dashed box: a gas above its vapor pressure at 298 K. ' + legend(d) + '.');
    setText('quick', 'Quick start: press Play, pick a reaction and a view, and move the sliders.');
    setText('descScene', spoken(el('view').value === 'p' ? progDesc : d.label + ' at 298 K. Plot of ΔG against log Q: a straight line that passes ΔG° = ' + fmt2(d.g0) + ' kJ at log Q = 0 and crosses the zero line at log Q = ' + fmt2(lk) + ', marked with a ring as Q = K. The marked point for the slider positions sits at log Q = ' + fmt2(lq) + ', ΔG = ' + fmt2(g) + ' kJ, ' + where(g) + '.'));
    var pure = d.species.filter(function (x) { return x.st === 'l' || x.st === 's'; });
    setText('descPanel', act.length ? 'A box of particles. ' + act.map(function (x, i) { return counts[i] + ' of ' + x.f; }).join(', ') + (pure.length ? ', with a layer of the pure ' + pure.map(function (x) { return x.f; }).join(' and ') + ' along the bottom' : '') + '.' + (overVP().length ? ' Marked: ' + vpText(overVP()) + '.' : '') : 'Two blocks of packed grey discs, ' + d.species.map(function (x) { return x.f; }).join(' on the left and ') + ' on the right.');
  }
  var rafId = null, lastT = 0;
  function render() { if (el('view').value === 'p') drawProgress(); else drawScene(); drawPanel(); updateText(); }
  function frame(t) { rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; tick(dt); drawPanel(); updateText(); schedule(); }
  function schedule() { if (st.running && !isReduced() && !rafId) rafId = requestAnimationFrame(frame); }
  function start() { st.lastInput = performance.now(); st.started = true; if (isReduced()) return; if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  var restTimer = null;
  function changed(msg) {
    st.lastInput = performance.now(); st.resync = true; render();
    if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500);
  }
  (function fillMenu() { var g = null, og = null; DATA.forEach(function (d) { if (d.group !== g) { og = document.createElement('optgroup'); og.label = d.group; el('reaction').appendChild(og); g = d.group; } var o = document.createElement('option'); o.value = d.id; o.textContent = d.label; og.appendChild(o); }); })();
  el('reaction').addEventListener('change', function () {   // a fresh start: every species at 1
    var k = el('reaction').value; if (!byId[k]) return; rid = k; vals = {}; activeSpecies(byId[rid]).forEach(function (x) { vals[x.key] = 1; }); buildSliders(); st.seeded = false; changed('Now showing ' + byId[rid].label + ', every species at 1.');
  });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('view').addEventListener('change', function () { changed(el('view').value === 'p' ? 'Showing G against reaction progress.' : 'Showing ΔG against log Q.'); });

  // ===========================================================================
  // Start: paused
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) stop(); render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  el('reaction').value = rid;
  buildSliders();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
