    table, captions, guarded setters) and titration_simulator.html (61254251: the plotted line with a marked current point and
    the "a." and "b." views). Previous file: d8e169ae.
  Brief (one line): ch16, archetypes 2 to 4, opens at the meaning question: ΔG° = ΔH° − TΔS°; temperature can change the sign of
    ΔG° only when ΔH° and ΔS° share a sign, at the T where ΔG° = 0, ΔH° ÷ ΔS°; for a phase change that is the transition
    temperature. No verdict, direction or reason words.
  Data source: the brief's table only, OpenStax Chemistry 2e, Appendix G: ΔH° (kJ), ΔS° (J/K) and ΔG°(298 K) from ΔG°f (kJ) for
    the reaction as written. The small temperature dependence of ΔH° and ΔS° is neglected, as the course does. For CaCO₃(s) → CaO(s) + CO₂(g) the ΔG°f
    route shows "—" (change brief, 18 Oct: Appendix G's calcite entries disagree with each other).
  Model (exact, integer arithmetic): h = ΔH° in 0.01 kJ, s = ΔS° in 0.01 J/K, T in whole kelvin.
    ΔG°(T) × 10 = (1000 h − T s) ÷ 10 000 kJ, rounded half away from zero; −TΔS° the same with h = 0;
    T where ΔG° = 0: 1000 |h| ÷ |s| K, rounded to a whole kelvin, only when h and s share a sign.
    ΔS(univ) = −ΔG°/T (chapter Table 16.3): (s T − 1000 h) ÷ T, in hundredths of J/K, rounded half away from zero; none at 0 K.
    Phase changes also show the measured transition temperature (MEASURED; NIST via the instructor, CS₂ from the chapter).
  URL parameters:
    reaction  one of the ids in DATA below. Default H2Ol_to_H2Og; unknown values and unfilled placeholders fall back with a notice.
    T         kelvin, 0 to 2500, whole kelvin. Default 298; values outside fall to the nearer end, others round, with a notice.
    theme     light | dark. Default: the system setting.
  Drawing choices (not data): the plot's y-range fits the line over the chosen temperature range and stays put while T moves;
    the parts above and below the zero line are tinted and labelled ΔG° > 0 and ΔG° < 0; a ring marks the T where ΔG° = 0. The bars
    are a waterfall: ΔH° from zero, then −TΔS° from the end of ΔH°, so the second bar ends at ΔG°(T), which is marked. View b.
    shows the four sign cases of ΔH° and ΔS°; the one that fits the chosen reaction is outlined.
  Nothing is fetched, stored, or sent. Nothing moves; this page has no animation.

    ctx.font = '10px ' + FONT; ctx.fillStyle = C('muted'); ctx.textBaseline = 'middle'; ctx.fillText('0', W - 11, zeroY);
    var w = 34, c1 = 34, c2 = 92, c3 = 150;
    // ΔH°
    ctx.fillStyle = C('hbar'); if (hK >= 0) ctx.fillRect(c1 - w / 2, zeroY - S(hK), w, S(hK)); else ctx.fillRect(c1 - w / 2, zeroY, w, S(-hK));
    ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.fillText(fmtFixed(d.h, 2), c1, hK >= 0 ? zeroY - S(hK) - 7 : zeroY + S(-hK) + 7);
    ctx.fillStyle = C('muted'); ctx.fillText('ΔH°', c1, hK >= 0 ? zeroY + 8 : zeroY - 8);
    // −TΔS° from the end of ΔH°, hatched so colour is not the only carrier
    var base = zeroY - S(hK);
    ctx.fillStyle = C('tsbar'); if (tsK >= 0) ctx.fillRect(c2 - w / 2, base - S(tsK), w, S(tsK)); else ctx.fillRect(c2 - w / 2, base, w, S(-tsK));
    ctx.save(); ctx.beginPath(); ctx.rect(c2 - w / 2, Math.min(base, base - S(tsK)), w, Math.abs(S(tsK))); ctx.clip(); ctx.strokeStyle = C('win-bg'); ctx.lineWidth = 1;
    for (var x = c2 - w / 2 - 40; x < c2 + w / 2 + 40; x += 8) { ctx.beginPath(); ctx.moveTo(x, by0); ctx.lineTo(x + 40, by1); ctx.stroke(); } ctx.restore();
    ctx.strokeStyle = C('rule'); ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(c1 + w / 2, Math.round(base) + 0.5); ctx.lineTo(c2 - w / 2, Math.round(base) + 0.5); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C('fg'); ctx.fillText(fmtFixed(mTS10(d, T), 1), c2, tsK >= 0 ? base - S(tsK) - 7 : base + S(-tsK) + 7);
    ctx.fillStyle = C('muted'); ctx.fillText('−TΔS°', c2, tsK >= 0 ? Math.min(base + 8, by1 - 2) : Math.max(base - 8, by0 + 2));
    // ΔG°: a heavy tick at the end of the second bar
    var endY = zeroY - S(gK);
    ctx.strokeStyle = C('rule'); ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(c2 + w / 2, Math.round(endY) + 0.5); ctx.lineTo(c3 - w / 2, Math.round(endY) + 0.5); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = C('fg'); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(c3 - w / 2, Math.round(endY) + 0.5); ctx.lineTo(c3 + w / 2, Math.round(endY) + 0.5); ctx.stroke();
    ctx.strokeStyle = C('focus'); ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(c3 + 0.5, zeroY); ctx.lineTo(c3 + 0.5, endY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C('fg'); ctx.fillText(fmtFixed(dG10(d, T), 1), c3, gK >= 0 ? endY - 8 : endY + 8);
    ctx.fillStyle = C('muted'); ctx.fillText('ΔG°', c3, gK >= 0 ? zeroY + 8 : zeroY - 8);
  }

  // ---------------------------------------------------------------------------
  // a. ΔG° against T
  // ---------------------------------------------------------------------------
  var curveCv = el('curve');
  function niceStep(range) { var p = Math.pow(10, Math.floor(Math.log10(range))), f = range / p; return f <= 1 ? p : f <= 2 ? 2 * p : f <= 5 ? 5 * p : 10 * p; }
  function drawCurve() {
    var cv = sizeCanvas(curveCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, d = cur(), Tm = tmax();
    var px0 = 38, px1 = W - 8, py0 = 18, py1 = H - 26;
    var g0 = dGfloat(d, 0), g1 = dGfloat(d, Tm);
    var ymin = Math.min(0, g0, g1), ymax = Math.max(0, g0, g1); if (ymax - ymin < 1) { ymax += 1; ymin -= 1; }
    var pad = (ymax - ymin) * 0.1; ymin -= pad; ymax += pad;
    var X = function (t) { return px0 + t / Tm * (px1 - px0); }, Y = function (g) { return py1 - (g - ymin) / (ymax - ymin) * (py1 - py0); };
    var zy = Y(0);
    ctx.fillStyle = C('above'); ctx.fillRect(px0, py0, px1 - px0, zy - py0);
    ctx.fillStyle = C('below'); ctx.fillRect(px0, zy, px1 - px0, py1 - zy);
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(px0 + 0.5, py0 + 0.5, px1 - px0, py1 - py0);
    ctx.font = '600 10px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('a. ΔG° in kJ against T', px0, 3);
    ctx.font = '10px ' + FONT; ctx.fillStyle = C('muted'); ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    var g1Y = Y(g1), labTopLeft = g1Y < py0 + 18, labBotLeft = g1Y > py1 - 18;   // keep the region labels off the line
    if (zy - py0 > 14) { ctx.textAlign = labTopLeft ? 'left' : 'right'; ctx.fillText('ΔG° > 0', labTopLeft ? px0 + 4 : px1 - 4, py0 + 8); }
    if (py1 - zy > 14) { ctx.textAlign = labBotLeft ? 'left' : 'right'; ctx.fillText('ΔG° < 0', labBotLeft ? px0 + 4 : px1 - 4, py1 - 8); }
    // x ticks
    var xt = Tm === 500 ? [0, 100, 200, 300, 400, 500] : [0, 500, 1000, 1500, 2000, 2500];
    xt.forEach(function (t, i) { var x = Math.round(X(t)) + 0.5; ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(x, py1); ctx.lineTo(x, py1 + 3); ctx.stroke(); ctx.textAlign = i === xt.length - 1 ? 'right' : i === 0 ? 'left' : 'center'; ctx.fillStyle = C('muted'); ctx.fillText(String(t), X(t) + (i === xt.length - 1 ? 2 : i === 0 ? -2 : 0), py1 + 10); });
    ctx.textAlign = 'center'; ctx.fillText('T in K', (px0 + px1) / 2, py1 + 20);
    // y ticks
    var stp = niceStep((ymax - ymin) / 3); ctx.textAlign = 'right';
    for (var v = Math.ceil(ymin / stp) * stp; v <= ymax; v += stp) { var y = Math.round(Y(v)) + 0.5; ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(px0 - 3, y); ctx.lineTo(px0, y); ctx.stroke(); ctx.fillText(String(Math.round(v * 100) / 100).replace('-', '−'), px0 - 4, Y(v)); }
    // zero line
    ctx.strokeStyle = C('fg'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(px0, Math.round(zy) + 0.5); ctx.lineTo(px1, Math.round(zy) + 0.5); ctx.stroke(); ctx.setLineDash([]);
    // the line
    ctx.strokeStyle = C('curve'); ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(X(0), Y(g0)); ctx.lineTo(X(Tm), Y(g1)); ctx.stroke();
    // crossover ring
    var xo = crossover(d);
    if (xo !== null && xo <= Tm) {
      ctx.strokeStyle = C('fg'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(xo), zy, 5, 0, 2 * Math.PI); ctx.stroke();
      var right = X(xo) > px1 - 60, xT = X(T); if (Math.abs(xT - X(xo)) < 44 && X(xo) - px0 > 50 && px1 - X(xo) > 50) right = xT > X(xo); ctx.fillStyle = C('fg'); ctx.textAlign = right ? 'right' : 'left'; ctx.fillText(xo + ' K', X(xo) + (right ? -8 : 8), zy + (d.s > 0 ? -11 : 11));
    }
    // where the reaction is now
    var xm = X(T), ym = Y(dGfloat(d, T));
    ctx.strokeStyle = C('focus'); ctx.lineWidth = 1; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(Math.round(xm) + 0.5, py0); ctx.lineTo(Math.round(xm) + 0.5, py1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C('focus'); ctx.beginPath(); ctx.arc(xm, ym, 3.8, 0, 2 * Math.PI); ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // b. The four sign cases
  // ---------------------------------------------------------------------------
  var casesCv = el('cases');
  var CASES = [[-1, 1], [-1, -1], [1, 1], [1, -1]];
  function drawCases() {
    var cv = sizeCanvas(casesCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, d = cur();
    ctx.font = '600 10px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('b. Sign cases', 4, 3);
    var gx = 4, gy = 18, cw = (W - 8 - 4) / 2, ch = (H - gy - 4 - 4) / 2;
    CASES.forEach(function (c, i) {
      var cx = gx + (i % 2) * (cw + 4), cy = gy + Math.floor(i / 2) * (ch + 4), mine = Math.sign(d.h) === c[0] && Math.sign(d.s) === c[1];
      ctx.fillStyle = C('win-bg'); ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = mine ? C('focus') : C('rule'); ctx.lineWidth = mine ? 2.5 : 1; ctx.strokeRect(cx + (mine ? 1.25 : 0.5), cy + (mine ? 1.25 : 0.5), cw - (mine ? 2.5 : 1), ch - (mine ? 2.5 : 1));
      var mx0 = cx + 5, mx1 = cx + 23, my0 = cy + 8, my1 = cy + ch - 8, mz = (my0 + my1) / 2;   // a small ΔG°-against-T sketch
      ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.moveTo(mx0, Math.round(mz) + 0.5); ctx.lineTo(mx1, Math.round(mz) + 0.5); ctx.stroke(); ctx.setLineDash([]);
      var ys = c[0] < 0 ? mz + 7 : mz - 7, ye = ys + (c[1] > 0 ? 11 : -11);
      ctx.strokeStyle = C('curve'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(mx0, ys); ctx.lineTo(mx1, ye); ctx.stroke();
      ctx.font = (mine ? '600 ' : '') + '9px ' + FONT; ctx.fillStyle = mine ? C('fg') : C('muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C('fg'); ctx.fillText('ΔH° ' + (c[0] < 0 ? '< 0' : '> 0'), cx + 27, cy + ch * 0.17);
      ctx.fillText('ΔS° ' + (c[1] < 0 ? '< 0' : '> 0'), cx + 27, cy + ch * 0.39);
      ctx.fillStyle = mine ? C('fg') : C('muted');
      var one = c[0] === c[1];   // ΔH° and ΔS° share a sign: ΔG° < 0 at high T (both > 0) or at low T (both < 0)
      ctx.fillText(one ? 'ΔG° < 0 at' : 'ΔG° = 0 at', cx + 27, cy + ch * 0.62); ctx.fillText(one ? (c[0] > 0 ? 'high T' : 'low T') : 'no T', cx + 27, cy + ch * 0.84);
    });
  }

  // ===========================================================================
  // Readings, captions, descriptions
  // ===========================================================================
  function kelvinText() { return T + ' K · ' + fmtFixed(T * 100 - 27315, 2) + ' °C'; }
  function readout() {
    var d = cur(), xo = crossover(d);
    return d.label + ' at ' + T + ' K: ΔG° ' + fmtFixed(dG10(d, T), 1) + ' kJ; ΔH° ' + fmtFixed(d.h, 2) + ' kJ; −TΔS° ' + fmtFixed(mTS10(d, T), 1) + ' kJ; ΔG° = 0 at ' + (xo === null ? 'no temperature' : xo + ' K') + '.';
  }
  function updateText() {
    var d = cur(), xo = crossover(d), Tm = tmax();
    setText('title', 'Free energy and temperature: ΔG° = ΔH° − TΔS°');
    setText('rH', fmtFixed(d.h, 2) + ' kJ'); setText('rS', fmtFixed(d.s, 2) + ' J/K'); 
    setText('rTS', fmtFixed(mTS10(d, T), 1) + ' kJ'); setText('rG', fmtFixed(dG10(d, T), 1) + ' kJ'); setText('rX', xo === null ? 'none' : xo + ' K');
    var u = univ100(d, T); setText('rU', u === null ? '—' : fmtFixed(u, 2) + ' J/K');
    var phaseRow = d.group === 'Phase changes' && d.id !== 'Csdiam_to_Csgrap'; setHidden('rowM', !phaseRow);
    setHidden('bpNote', !BPNOTE[d.id]); if (BPNOTE[d.id]) setText('bpNote', BPNOTE[d.id]);
    if (phaseRow) { setText('rMlab', d.id === 'I2s_to_I2g' ? 'Measured sublimation T' : 'Measured b.p.'); setText('rM', MEASURED[d.id] !== undefined ? MEASURED[d.id] + ' K' : '—'); }
    setText('r298a', fmtFixed(dG10(d, 298), 1) + ' kJ'); setText('r298b', d.gfShow ? fmtFixed(d.gf, 2) + ' kJ' : '—'); setHidden('gfNote', d.gfShow);
    setText('vT', kelvinText());
    var s = el('T'); if (s.value !== String(T)) s.value = String(T); setAttr(s, 'max', String(Tm));
    setAttr(s, 'aria-valuetext', T + ' kelvin, ' + spoken(fmtFixed(T * 100 - 27315, 2)) + ' degrees Celsius');
    if (el('reaction').value !== rid) el('reaction').value = rid;
    if (el('trange').value !== String(Tm)) el('trange').value = String(Tm);
    setText('status', 'Showing ' + d.label + ' at ' + T + ' K. Readings are steady.');
    setText('caption', 'The bars: ΔH° from zero, then −TΔS° from the end of ΔH°; the second bar ends at ΔG°(T). a. ΔG° against T, simulated; the small temperature dependence of ΔH° and ΔS° is neglected. The tints mark ΔG° above and below zero; the ring marks ΔG° = 0, where it exists; the marked point is at the slider position.');
    setText('caption2', 'b. The four sign cases of ΔH° and ΔS°; the outlined one fits the chosen reaction.');
    setText('quick', 'Quick start: choose a reaction, then drag the temperature slider.');
    setText('descScene', spoken('Bars at ' + T + ' K: ΔH° ' + fmtFixed(d.h, 2) + ' kJ, ' + where(d.h) + '; −TΔS° ' + fmtFixed(mTS10(d, T), 1) + ' kJ, drawn from the end of the ΔH° bar; the second bar ends at ΔG° = ' + fmtFixed(dG10(d, T), 1) + ' kJ, ' + where(dG10(d, T)) + '.'));
    setText('descCurve', spoken(d.label + '. Plot of ΔG° against T from 0 to ' + Tm + ' K: a straight line from ' + fmtFixed(dG10(d, 0), 1) + ' kJ at 0 K to ' + fmtFixed(dG10(d, Tm), 1) + ' kJ at ' + Tm + ' K. ' + (xo === null ? 'The line does not cross the zero line.' : 'The line crosses the zero line at ' + xo + ' K' + (xo > Tm ? ', beyond the plotted range.' : ', marked with a ring.')) + ' The marked point at T = ' + T + ' K is ' + where(dG10(d, T)) + '.'));
    setText('descCases', spoken('Four sign cases: ΔH° below zero with ΔS° above zero, ΔG° = 0 at no temperature; both below zero, ΔG° below zero at low temperature; both above zero, ΔG° below zero at high temperature; ΔH° above zero with ΔS° below zero, ΔG° = 0 at no temperature. Outlined: ΔH° ' + (d.h < 0 ? 'below' : 'above') + ' zero and ΔS° ' + (d.s < 0 ? 'below' : 'above') + ' zero.'));
  }
  function render() { drawScene(); drawCurve(); drawCases(); updateText(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  function defaultRange(d) { var x = crossover(d); return (d.group === 'Phase changes' && x !== null && x <= 450 && T <= 500) ? 500 : 2500; }
  function applyRange(maxK) { if (T > maxK) T = maxK; if (el('trange').value !== String(maxK)) el('trange').value = String(maxK); }
  var restTimer = null;
  function changed(msg) { render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500); }
  (function fillMenu() { var g = null, og = null; DATA.forEach(function (d) { if (d.group !== g) { og = document.createElement('optgroup'); og.label = d.group; el('reaction').appendChild(og); g = d.group; } var o = document.createElement('option'); o.value = d.id; o.textContent = d.label; og.appendChild(o); }); })();
  el('reaction').addEventListener('change', function () { var k = el('reaction').value; if (!byId[k]) return; rid = k; applyRange(defaultRange(byId[rid])); changed('Now showing ' + byId[rid].label + '.'); });
  el('T').addEventListener('input', function () { T = parseInt(el('T').value, 10); changed(''); });
  el('T').addEventListener('keydown', function (e) {
    var maxK = tmax(), nt = T, ok = true;
    switch (e.key) { case 'PageUp': nt = T + 100; break; case 'PageDown': nt = T - 100; break; case 'Home': nt = 0; break; case 'End': nt = maxK; break; default: ok = false; }
    if (ok) { e.preventDefault(); T = Math.max(0, Math.min(maxK, nt)); changed(''); }
  });
  el('trange').addEventListener('change', function () { applyRange(tmax()); changed('Range 0 to ' + tmax() + ' K.'); });

  // ===========================================================================
  // Start
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  el('reaction').value = rid;
  applyRange(defaultRange(byId[rid]));
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
