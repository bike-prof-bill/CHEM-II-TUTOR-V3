    to 00_CHANGE_BRIEF_rebase_ch16_pages.md on buffer_simulator.html (98b62a53: shell, colour tokens, fonts, readings table, bars,
    captions, guarded setters, Play), titration_simulator.html (61254251: the plotted curve with a marked current point and the
    "a." and "b." views) and solubility_simulator.html (afabb987: the particle sketch and its caption). Previous file: 325aee7a.
  Brief (one line): ch16, archetype 1, opens at the meaning question: a process is spontaneous when the entropy of the universe
    rises; ΔS(univ) = ΔS(sys) + ΔS(surr), ΔS(surr) = −ΔH ÷ T; the system's term is fixed by the process and the surroundings'
    term depends on temperature. No verdict, direction or reason words.
  Data source: the brief's table only: ΔH° (kJ) and ΔS° (J/K) from OpenStax Chemistry 2e, Appendix G; the ice row from OpenStax
    Example 16.4. ΔH° and ΔS° are held constant with T, as the course does.
  Model (exact, integer arithmetic): h = ΔH° in 0.01 kJ, s = ΔS° in 0.01 J/K, t = T in 0.01 K.
    ΔS(surr) × 10 = −10⁴ h ÷ t J/K, rounded half away from zero, shown to 1 decimal;
    ΔS(univ) × 100 = (s t − 10⁵ h) ÷ t J/K, rounded half away from zero, shown to 2 decimals.
    "Reverse (freezing)", for ice only, flips the signs of h and s.
  URL parameters:
    process  one of the ids in DATA below. Default ice_melting; unknown values and unfilled placeholders fall back with a notice.
    T        kelvin, 100 to 2000. Default 298; values outside fall to the nearer end, unreadable ones to 298, with a notice.
    theme    light | dark. Default: the system setting.
  Drawing choices (not data): the bars share one scale, ±50, ±500 or ±20 000 J/K (a menu; the default is the smallest that
    holds ΔS(sys) and ΔS(surr)); a bar that runs off the scale carries a break mark. The plot's y-range fits the curve over the
    slider range. The slider runs 100 to 400 K for phase changes, 273.15 to 373.15 K for dissolving, 100 to 2000 K otherwise
    (a menu), in 0.01 K steps; arrows move 1 K, Page keys 10 K. The sketch draws the reactants, the products (particles split
    by mole number, 4 to 24 per species) and the surroundings: the water for dissolving, otherwise the reactants and products
    not reacting at this moment, kept at the slider's T; once heat flows, energy packets cross and spread; a wavy arrow shows the
    way the heat goes. The full drawing rules are in the comment above the sketch code. Atom colours: carbon grey, oxygen red,
    hydrogen white, nitrogen blue; other elements in distinct non-blue colours; compounds as pie discs whose shares follow
    the atom counts; ions carry their charge sign. The 2-minute idle stop.
  Phase-change and decomposition temperatures (drawing only: each species in reactions and dissolving is drawn in its state at
    this T and 1 atm; past a decomposition temperature it is labelled "decomposes"): NIST Chemistry WebBook and NIST-JANAF
    tables, supplied by the instructor 18 Oct 2026; water 273.15 and 373.15 K. See TRANS. For a phase change the two boxes
    are the phase below and the phase above the transition temperature (titled "below m.p.", "above b.p." and so on); at the
    temperature where ΔS(univ) reads 0.00 (ΔH° ÷ ΔS°, nearest 0.01 K) both show the same two-phase system, titled "at m.p."
    or "at b.p.", molecules crossing both ways. The slider settles there within 0.5 K of it, and moves in 0.01 K steps. The
    plot caption gives the measured (NIST) transition temperature; the two differ because the small temperature dependence of
    ΔH° and ΔS° is neglected.

<script>
(function () {

  var EL = { C: '#6e6e6e', O: '#d13b2a', H: '#ffffff', N: '#2f5fd0', K: '#8e44ad', Cl: '#2f9a3a', Br: '#8b4a1c', Fe: '#a0522d', Cu: '#b87333', Zn: '#7d8a84', S: '#d1b000', Na: '#8e44ad' };

    { id: 'CH3OHg_to_CH3OHl', group: 'Condensing', label: 'CH₃OH(g) → CH₃OH(l)', h: -3820, s: -11310, phase: true, before: [f('CH₃OH(g)', 1, 'g', ['C', 'O', 'H'])], after: [f('CH₃OH(l)', 1, 'l', ['C', 'O', 'H'])] },
    { id: 'CCl4g_to_CCl4l', group: 'Condensing', label: 'CCl₄(g) → CCl₄(l)', h: -3250, s: -9530, phase: true, before: [f('CCl₄(g)', 1, 'g', ['C', 'Cl'])], after: [f('CCl₄(l)', 1, 'l', ['C', 'Cl'])] },

    { id: 'C2H5OHg_to_C2H5OHl', group: 'Condensing', label: 'C₂H₅OH(g) → C₂H₅OH(l)', h: -4280, s: -12090, phase: true, before: [f('C₂H₅OH(g)', 1, 'g', ['C', 'O', 'H'])], after: [f('C₂H₅OH(l)', 1, 'l', ['C', 'O', 'H'])] },
    { id: 'Fes_O2g_to_Fe2O3s', group: 'Oxidations and combustions', label: '4 Fe(s) + 3 O₂(g) → 2 Fe₂O₃(s)', h: -164840, s: -55000, before: [f('Fe(s)', 4, 's', ['Fe']), f('O₂(g)', 3, 'g', ['O'])], after: [f('Fe₂O₃(s)', 2, 's', ['Fe', 'O'])] },
    { id: 'Cus_O2g_to_CuOs', group: 'Oxidations and combustions', label: '2 Cu(s) + O₂(g) → 2 CuO(s)', h: -31460, s: -18624, before: [f('Cu(s)', 2, 's', ['Cu']), f('O₂(g)', 1, 'g', ['O'])], after: [f('CuO(s)', 2, 's', ['Cu', 'O'])] },
    { id: 'Zns_O2g_to_ZnOs', group: 'Oxidations and combustions', label: '2 Zn(s) + O₂(g) → 2 ZnO(s)', h: -70100, s: -20100, before: [f('Zn(s)', 2, 's', ['Zn']), f('O₂(g)', 1, 'g', ['O'])], after: [f('ZnO(s)', 2, 's', ['Zn', 'O'])] },
    { id: 'SO2g_O2g_to_SO3g', group: 'Oxidations and combustions', label: '2 SO₂(g) + O₂(g) → 2 SO₃(g)', h: -19778, s: -18808, before: [f('SO₂(g)', 2, 'g', ['S', 'O', 'O']), f('O₂(g)', 1, 'g', ['O'])], after: [f('SO₃(g)', 2, 'g', ['S', 'O', 'O', 'O'])] },
    { id: 'H2g_O2g_to_H2Ol', group: 'Oxidations and combustions', label: '2 H₂(g) + O₂(g) → 2 H₂O(l)', h: -57166, s: -32660, before: [f('H₂(g)', 2, 'g', ['H']), f('O₂(g)', 1, 'g', ['O'])], after: [f('H₂O(l)', 2, 'l', ['O', 'H', 'H'])] },
    { id: 'CH4g_O2g_to_CO2g_H2Ol', group: 'Oxidations and combustions', label: 'CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l)', h: -89057, s: -24290, before: [f('CH₄(g)', 1, 'g', ['C', 'H']), f('O₂(g)', 2, 'g', ['O'])], after: [f('CO₂(g)', 1, 'g', ['C', 'O']), f('H₂O(l)', 2, 'l', ['O', 'H', 'H'])] }
  ];
  var byId = {}; DATA.forEach(function (d) { byId[d.id] = d; });
  var IDLE_STOP_S = 120;

  // ===========================================================================
  // Exact arithmetic (unchanged from 325aee7a)
  // ===========================================================================
  function roundRatio(n, d) { var a = Math.abs(n), r = Math.floor((2 * a + d) / (2 * d)); return n < 0 ? -r : r; }
  function fmtFixed(intVal, dec) { var neg = intVal < 0, s = String(Math.abs(intVal)); while (s.length < dec + 1) s = '0' + s; if (dec > 0) s = s.slice(0, -dec) + '.' + s.slice(-dec); return (neg && /[1-9]/.test(s) ? '−' : '') + s; }
  function compute(h, s, t) {   // t in hundredths of K; ΔS(surr) in tenths and ΔS(univ) in hundredths of J/K (integers), plus floats
    var surr10 = roundRatio(-h * 1e4, t), univ100 = roundRatio(s * t - h * 1e5, t);
    return { surr10: surr10, univ100: univ100, surr: -h * 1e3 / t, univ: s / 100 - h * 1e3 / t, sys: s / 100 };
  }

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  function isPlaceholder(v) { return /^\{.*\}$/.test(v || ''); }
  var pid = (params.get('process') || '').trim();
  if (!pid) pid = 'ice_melting';
  else if (!byId[pid]) { notices.push(isPlaceholder(pid) ? 'No process given; showing H₂O(s) → H₂O(l).' : 'No data for “' + pid.slice(0, 40) + '”; showing H₂O(s) → H₂O(l).'); pid = 'ice_melting'; }
  var T0 = 298;
  if (params.has('T')) {
    var rawT = params.get('T'), v = parseFloat(rawT);
    if (!isFinite(v)) notices.push(isPlaceholder(rawT) ? 'No temperature given; using 298 K.' : 'Could not read T; using 298 K.');
    else if (v < 100 || v > 2000) { T0 = v < 100 ? 100 : 2000; notices.push('T = ' + v + ' K is outside 100 to 2000 K; using ' + T0 + ' K.'); }
    else T0 = v;
  }
  if (byId[pid].group === 'Dissolving' && (T0 < 273.15 || T0 > 373.15)) { var Tw = T0 < 273.15 ? 273.15 : 373.15; notices.push('Dissolving needs liquid water; using ' + Tw + ' K.'); T0 = Tw; }
  var tc = Math.round(Math.round(T0 * 100) / 5) * 5;   // hundredths of K, kept as an integer; slider step 0.05 K
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Text helpers (labels and attributes are written only when they change: the Safari fix)
  // ===========================================================================
  var el = function (id) { return document.getElementById(id); };
  function setText(id, t) { var e = el(id); if (e.textContent !== t) e.textContent = t; }
  function setAttr(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setHidden(id, h) { var e = el(id); if (e.hidden !== h) e.hidden = h; }
  function setDisabled(id, d) { var e = el(id); if (e.disabled !== d) e.disabled = d; }
  function spoken(t) {
    return t.replace(/−(\d)/g, 'minus $1').replace(/ΔS\(sys\)/g, 'delta S of the system').replace(/ΔS\(surr\)/g, 'delta S of the surroundings').replace(/ΔS\(univ\)/g, 'delta S of the universe')
      .replace(/ΔH°/g, 'delta H').replace(/ΔS°/g, 'delta S').replace(/(\d) kJ\b/g, '$1 kilojoules').replace(/(\d) J\/K\b/g, '$1 joules per kelvin').replace(/(\d) K\b/g, '$1 kelvin').replace(/°C/g, 'degrees Celsius');
  }
  var live = el('live');
  function say(msg) { live.textContent = ''; setTimeout(function () { live.textContent = spoken(msg); }, 30); }

  // ===========================================================================
  // State
  // ===========================================================================
  var st = { reversed: false, running: false, started: false, lastInput: 0, seeded: false };
  function current() { var d = byId[pid], sg = st.reversed ? -1 : 1, h = d.h * sg, s = d.s * sg; return { d: d, h: h, s: s, c: compute(h, s, tc) }; }
  function labelFor(d) { return st.reversed && d.reverse ? 'H₂O(l) → H₂O(s)' : d.label; }
  function kelvinText() { return fmtFixed(tc, 2) + ' K · ' + fmtFixed(tc - 27315, 2) + ' °C'; }
  function rangeLo() { return el('trange').value === 'water' ? 27315 : 10000; }   // hundredths of K
  function rangeHi() { var v = el('trange').value; return v === 'water' ? 37315 : parseInt(v, 10) * 100; }

    var SL = surrList();
    if (SL === WATER) particles.surr = fill(WATER, BOX.surr, [60], true);
    else { var ns = SL.reduce(function (t, x) { return t + x.n; }, 0), ks = Math.max(2, Math.floor(30 / ns)); particles.surr = fill(SL, BOX.surr, SL.map(function (x) { return x.n * ks; }), false); }

  }
  function swapPhases(list) {   // one molecule leaves the lower phase while another joins it: equal rates both ways
    var lo = list.list[0], hi = list.list[1], low = list.filter(function (p) { return p.st === lo.st; }), up = list.filter(function (p) { return p.st === hi.st; });
    if (!low.length || !up.length) return;
    var leave = low.reduce(function (m, p) { return p.y < m.y ? p : m; }), join = up.reduce(function (m, p) { return p.y > m.y ? p : m; });
    if (lo.st === 's') { var site = [leave.hx, leave.hy]; join.st = 's'; join.sp = lo; join.hx = site[0]; join.hy = site[1]; join.moving = true; leave.st = 'l'; leave.sp = hi; leave.r = list.reg.l; leave.vx = 0; leave.vy = -1; }
    else { leave.st = hi.st; leave.sp = hi; leave.r = list.reg.g; leave.vx = rand() - 0.5; leave.vy = -1; join.st = lo.st; join.sp = lo; join.r = list.reg.l; join.vy = 1; }
  }
  var rxnForward = true;
  function react(list, forward) {   // 2 SO₂ + O₂ → 2 SO₃ and back, taking molecules that are close together
    var mix = list.list, SO2 = mix[0], O2 = mix[1], SO3 = mix[2];
    function nearest(src, kind, n) { return list.filter(function (q) { return q.sp === kind && q !== src; }).sort(function (u, v) { return Math.hypot(u.x - src.x, u.y - src.y) - Math.hypot(v.x - src.x, v.y - src.y); }).slice(0, n); }
    if (forward) {
      var o = list.filter(function (q) { return q.sp === O2; }); if (!o.length) return; o = o[Math.floor(rand() * o.length)];
      var two = nearest(o, SO2, 2); if (two.length < 2) return;
      two.forEach(function (q) { q.sp = SO3; }); list.splice(list.indexOf(o), 1);
    } else {
      var t = list.filter(function (q) { return q.sp === SO3; }); if (t.length < 2) return; t = t[Math.floor(rand() * t.length)];
      var pair = [t].concat(nearest(t, SO3, 1)); if (pair.length < 2) return;
      pair.forEach(function (q) { q.sp = SO2; });
      var a = rand() * 6.283; list.push({ sp: O2, st: 'g', ph: rand() * 6.283, x: (pair[0].x + pair[1].x) / 2, y: (pair[0].y + pair[1].y) / 2, vx: Math.cos(a), vy: Math.sin(a), r: list.reg.g });
    }
  }
  function step(p, dt, sc) {
    if (p.st === 's') {
      if (p.moving) { p.x += (p.hx - p.x) * Math.min(1, dt * 6); p.y += (p.hy - p.y) * Math.min(1, dt * 6); if (Math.abs(p.hx - p.x) + Math.abs(p.hy - p.y) < 0.6) p.moving = false; return; }
      var A = 0.9 * sc; p.x = p.hx + Math.sin(tAnim * 9 + p.ph) * A; p.y = p.hy + Math.cos(tAnim * 7.7 + p.ph * 1.3) * A; return;
    }
    var v;
    if (p.st === 'g') { v = 30 * sc * Math.min(2.2, Math.max(0.45, Math.sqrt(30 / massOf(p.sp.f)))); if (rand() < 0.8 * dt) { var g = rand() * 6.283; p.vx = Math.cos(g); p.vy = Math.sin(g); } }   // a gas: free flight, with an occasional collision that turns it

  function spread(list) {   // particles do not overlap: a short-range push keeps a liquid packed and evenly spread

  }
  function tick(dt) {
    tAnim += dt; if (heatPhase < 1) heatPhase = Math.min(1, heatPhase + dt / 3);
    var sc = speedScale();
    if (coexist()) { swapClock += dt; if (swapClock > 0.7) { swapClock = 0;
      if (boxLists().rxn) { react(particles.before, rxnForward); react(particles.after, rxnForward); rxnForward = !rxnForward; }   // alternating: equal rates both ways

    particles.before.forEach(function (p) { step(p, dt, sc); }); particles.after.forEach(function (p) { step(p, dt, sc); });

    spread(particles.before); spread(particles.after); spread(particles.surr); stepPackets(dt);
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }
  function disc(ctx, x, y, r, els, q) {
    var n = els.length, a0 = -Math.PI / 2;
    for (var i = 0; i < n; i++) { var a1 = a0 + Math.PI * 2 / n; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a0, a1); ctx.closePath(); ctx.fillStyle = EL[els[i]]; ctx.fill(); a0 = a1; }

    if (q) { var bx = x + r * 0.9, by = y - r * 0.9; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 3, 0, 6.28); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 0.6; ctx.stroke(); ctx.fillStyle = '#000'; ctx.font = '700 6.5px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(q, bx, by + 0.3); }
  }
  function keyRow(ctx, list, cx, y, maxW) {   // a centred key: disc and formula for each species in the box
    var size = 8.5, items, w;
    do { ctx.font = size + 'px ' + FONT; w = 0; items = list.map(function (sp) { var t = sp.f, iw = 9 + ctx.measureText(t).width; w += iw; return [sp, t, iw]; }); w += 6 * (items.length - 1); size -= 0.5; } while (w > maxW && size > 6.5);
    var x = cx - w / 2; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    items.forEach(function (it) { disc(ctx, x + 3, y, 3, it[0].el, null); ctx.font = (size + 0.5) + 'px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(it[1], x + 9, y); x += it[2] + 6; });
  }
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, nw = { w: W - 8, h: H - 18 };
    if (!st.seeded || PW.w !== nw.w || PW.h !== nw.h || signature() !== sig) { PW = nw; resetParticles(); st.seeded = true; }
    var k = current(), L = boxLists();
    ctx.font = '600 10px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C('fg');
    ctx.fillText('b. System and surroundings, not to scale', 4, 3);
    ctx.save(); ctx.translate(4, 16);
    var water = surrList() === WATER;
    var tt = boxTitles(false);
    [['before', tt[0], 'sys-bg'], ['after', tt[1], 'sys-bg'], ['surr', 'surroundings', 'surr-bg']].forEach(function (e) {
      var bx = BOX[e[0]]; ctx.fillStyle = C(e[2]); ctx.fillRect(bx.x, bx.y, bx.w, bx.h);
      ctx.font = '9px ' + FONT; ctx.fillStyle = C('muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e[1], bx.x + bx.w / 2, 5);
    });
    function tintLiquid(list, bx) { if (list.liqTop !== null && list.liqTop !== undefined) { ctx.fillStyle = C('water-tint'); ctx.fillRect(bx.x + 1, list.liqTop, bx.w - 2, bx.y + bx.h - 1 - list.liqTop); } }
    ['before', 'after'].forEach(function (key) { var list = particles[key], bx = BOX[key]; if (list.some(function (p) { return p.st === 'aq'; })) { ctx.fillStyle = C('water-tint'); ctx.fillRect(bx.x + 1, bx.y + 1, bx.w - 2, bx.h - 2); } });
    tintLiquid(particles.before, BOX.before); tintLiquid(particles.after, BOX.after);
    if (water) { ctx.fillStyle = C('water-tint'); ctx.fillRect(BOX.surr.x + 1, BOX.surr.y + 1, BOX.surr.w - 2, BOX.surr.h - 2); }

    var ay = BOX.before.y + BOX.before.h / 2, ax0 = BOX.before.x + BOX.before.w + 4, ax1 = BOX.after.x - 4;

      var dec = e[1].filter(decomposes); if (!dec.length) return; var bx = BOX[e[0]], txt = base(dec[0].f) + ' decomposes', size = 8.5;

    });
    if (L.two) keyRow(ctx, L.b, (BOX.before.x + BOX.after.x + BOX.after.w) / 2, PW.h - 6, BOX.after.x + BOX.after.w - BOX.before.x);   // the same system in both boxes: one key under both
    else { keyRow(ctx, L.b, BOX.before.x + BOX.before.w / 2, PW.h - 6, BOX.before.w + 22); keyRow(ctx, L.a, BOX.after.x + BOX.after.w / 2, PW.h - 6, BOX.after.w + 22); }

  }

  // ===========================================================================
  // Text
  // ===========================================================================
  function speciesLegend(list) {
    return list.map(function (sp) { return sp.f + ' drawn as ' + (sp.el.length === 1 ? 'a' : 'a ' + sp.el.length + '-colour') + ' disc (' + sp.el.map(function (e) { return ELNAME[e]; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(', ') + (sp.q ? '; charge ' + sp.q : '') + ')'; }).join('; ');
  }
  function readout() { var k = current(), c = k.c; return labelFor(k.d) + ' at ' + fmtFixed(tc, 2) + ' K: ΔS(sys) ' + fmtFixed(k.s, 2) + ' J/K, ΔS(surr) ' + fmtFixed(c.surr10, 1) + ' J/K, ΔS(univ) ' + fmtFixed(c.univ100, 2) + ' J/K.'; }
  function updateText() {
    var k = current(), d = k.d, c = k.c;
    var BL = boxLists(), b = BL.b, a = BL.a, all = b.concat(a.filter(function (x) { return !b.some(function (y) { return y.f === x.f; }); }));
    setText('title', 'Entropy of the universe: ΔS(univ) = ΔS(sys) + ΔS(surr)');
    setText('rH', fmtFixed(k.h, 2) + ' kJ'); setText('rSys', fmtFixed(k.s, 2) + ' J/K'); setText('rT', fmtFixed(tc, 2) + ' K');
    setText('rSurr', fmtFixed(c.surr10, 1) + ' J/K'); setText('rUniv', fmtFixed(c.univ100, 2) + ' J/K');
    setText('vT', kelvinText());
    var s = el('T'); if (s.value !== String(tc)) s.value = String(tc);
    setAttr(s, 'aria-valuetext', fmtFixed(tc, 2) + ' kelvin, ' + spoken(fmtFixed(tc - 27315, 2)) + ' degrees Celsius');
    var out = 'Showing ' + labelFor(d) + ' at ' + fmtFixed(tc, 2) + ' K. Readings are steady.';
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch.';
    setText('status', out);
    setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    setHidden('revwrap', !d.reverse); if (el('reverse').checked !== st.reversed) el('reverse').checked = st.reversed;
    if (el('process').value !== pid) el('process').value = pid;
    var tp = isPhase(d) ? TRANS[base(d.before[0].f)] : null, tpText = '';
    if (tp) { var melt = d.id === 'ice_melting'; tpText = ' Measured ' + (melt ? 'melting' : 'boiling') + ' point: ' + kStr(melt ? tp.mp : tp.bp) + ' K (NIST).'; }
    setText('caption', 'a. ΔS(univ) against T, simulated; the small temperature dependence of ΔH° and ΔS° is neglected; the marked point is at the slider position.' + (d.group === 'Dissolving' ? ' Dissolving: 273.15 to 373.15 K only, where water is liquid at 1 atm.' : '') + tpText);
    var boxes = isPhase(d) ? 'Reactant and product: the phases either side of the transition; where the curve crosses zero, both boxes show the same two-phase system.'

    setText('caption2', 'b. Not to scale: particles represent ensembles, split by mole number; spectator ions not depicted; motion slowed, speed following √T and molar mass. ' + boxes + ' Surroundings (where heat goes to or comes from): ' + (d.group === 'Dissolving' ? 'the water' : 'the reactants and products not reacting at this moment') + ', at the slider\u2019s T; heat crosses as packets (◆) and spreads.');
    setText('quick', 'Quick start: press Play, choose a process, and drag the temperature slider.');
    setText('descScene', spoken('Bars on a scale of plus or minus ' + barScale() + ' J/K at ' + fmtFixed(tc, 2) + ' K: ΔS(sys) ' + fmtFixed(k.s, 2) + ' J/K, ' + where(k.s) + '; ΔS(surr) ' + fmtFixed(c.surr10, 1) + ' J/K, ' + where(c.surr10) + '; ΔS(univ) ' + fmtFixed(c.univ100, 2) + ' J/K, ' + where(c.univ100) + '.'));
    var zc = (k.h !== 0 && k.s !== 0 && k.h * k.s > 0) ? k.h * 1000 / k.s : null;
    setText('descCurve', spoken(labelFor(d) + '. Plot of ΔS(univ) against T from ' + rangeText() + ', with a dashed zero line and a marked point at ' + fmtFixed(tc, 2) + ' K, ' + where(c.univ100) + '.' + (zc !== null && zc >= rangeLo() / 100 && zc <= rangeHi() / 100 ? ' The curve crosses the zero line at about ' + Math.round(zc) + ' K.' : ' The curve does not cross the zero line inside the plotted range.')));
    var states = { s: 'in a lattice, vibrating in place', l: 'as a liquid, wandering among neighbours', g: 'as a gas, spread through the box', aq: 'as ions in water, each with its charge sign' };
    var sc = speedScale(), hf = heatFactor();
    var dec = b.concat(a).filter(decomposes).map(function (x) { return base(x.f) + ' decomposes at this temperature'; });
    var sys = BL.rxn ? 'Both system boxes show the same thing: SO₂(g), O₂(g) and SO₃(g) together, reacting in both directions at equal rates.'

  // ===========================================================================
  // Loop
  // ===========================================================================

  function render() { drawScene(); drawCurve(); drawPanel(); updateText(); }
  function frame(t) { rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; tick(dt); drawPanel(); updateText(); schedule(); }

  // ===========================================================================
  // Controls

  el('reverse').addEventListener('change', function () { st.reversed = el('reverse').checked && !!byId[pid].reverse; st.seeded = false; changed('Now showing ' + labelFor(byId[pid]) + '.'); });
  el('T').addEventListener('input', function () { tc = snapT(parseInt(el('T').value, 10)); changed(''); });

  });
  el('trange').addEventListener('change', function () { applyRange(el('trange').value); changed('Slider range ' + rangeText() + '.'); });
  el('bscale').addEventListener('change', function () { changed('Bar scale ±' + barScale() + ' J/K.'); });

  // ===========================================================================
  // Start: paused
  // ===========================================================================

  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }

  el('process').value = pid;
  freshStart();

  render();
})();
