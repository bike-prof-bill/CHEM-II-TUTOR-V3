# Runs on every push and pull request.
#   modules-and-regression   per-module tests and the regression tests named for their faults   must pass
#   generator   python test_ch10_cc.py + test_ch13_ice.py   must pass
#   verifier    node gas/test_core.js + gas/test_ice.js       must pass
#   generated   committed Archetype_ch10_cc.gs and bundle.json == run.py output   must pass
#   content     every authored string in content/BASELINE_authored.txt still present, unchanged   must pass
#   purity      chemistry words in the tutor shell   must pass (zero hits) since step 3
name: tests
on: [push, pull_request]

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make test-gen

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: make test-verify

  modules-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: make test-modules
      - run: make test-regression

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make gen-check

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make content-check

  purity:
    runs-on: ubuntu-latest   # required since step 3: the tutor shell names no chemistry
    steps:
      - uses: actions/checkout@v4
      - run: make purity
