  Model: Δm = Z(1.0073) + N(1.0087) + Z(0.00055) − atomic mass, evaluated in that order as the brief's table was, then

  Drawing choices (not data): A is plotted on a log scale (1 to 300) so the light nuclei spread out; the balance tilt is exaggerated (the difference is under 1%); particles above 60 of a kind are
    drawn as one labelled group; the curve joins the points in order of A with a smooth line that passes through each point

<script>
(function () {

  // DATA: the brief's table. [id, label, Z, N, atomic mass (amu)]
  // ===========================================================================
  var NUC = [['He-4', '⁴₂He', 2, 2, 4.0026], ['F-19', '¹⁹₉F', 9, 10, 18.9984], ['H-2', '²₁H (deuterium)', 1, 1, 2.0141], ['Li-7', '⁷₃Li', 3, 4, 7.0160],

  // ===========================================================================

  // ===========================================================================

  function C(n) { if (!colours) colours = {}; if (!(n in colours)) colours[n] = getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); return colours[n]; }

  }

  function sciJ(v) { var s = v.toExponential(4).split('e'); return s[0] + ' × 10' + sup(parseInt(s[1], 10)); }

  // ===========================================================================
  // a. The balance
  // ===========================================================================
  var sceneCv = el('scene');
  function drawE(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fillStyle = C('bg'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 0.7; ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - r * 0.55, y); ctx.lineTo(x + r * 0.55, y); ctx.stroke(); }

    var items = [];

    items.forEach(function (it) {

        drawP(ctx, it.kind, gx, gy, 5.5); ctx.fillStyle = C('fg'); ctx.font = '600 10.5px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('×' + it.group, gx + 9, gy);
        return;

    });

    ctx.beginPath(); ctx.arc(rx, rb - 11, 10, 0, 6.283); ctx.fillStyle = C('atom'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 0.8; ctx.stroke();
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('particles', lx, lb + 10); ctx.fillText(r.parts.toFixed(4) + ' amu', lx, lb + 21); ctx.fillText('one atom', rx, rb + 10); ctx.fillText(n.M.toFixed(4) + ' amu', rx, rb + 21);
    // Δm at the beam, and E = Δm c² beside it
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('Δm = ' + r.dm.toFixed(4) + ' amu', cx, py - 10);
    ctx.font = '10.5px ' + FONT; ctx.textBaseline = 'top'; ctx.fillText('E = Δm c² = ' + sciJ(r.J) + ' J', cx, 18); ctx.fillText('= ' + r.mev.toFixed(2) + ' MeV', cx, 31);
    ctx.font = '10.5px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; var kx = 6, ky = H - 7;
    [['p', 'proton'], ['n', 'neutron'], ['e', 'electron']].forEach(function (k) { drawP(ctx, k[0], kx + 4, ky - 1, 4); ctx.fillStyle = C('fg'); ctx.fillText(k[1], kx + 11, ky + 4); kx += 12 + ctx.measureText(k[1]).width + 8; });
  }

  // ===========================================================================
  // b. BE per nucleon against A
  // ===========================================================================
  var panelCv = el('panel');
  function curvePoints() {   // A order; two nuclides at A = 3: their mean, for the line only
    var byA = {}; NUC.forEach(function (n) { var p = calc(n).per; (byA[n.A] = byA[n.A] || []).push(p); });
    return Object.keys(byA).map(Number).sort(function (a, b) { return a - b; }).map(function (A) { var v = byA[A]; return [A, v.reduce(function (s, x) { return s + x; }, 0) / v.length]; });
  }
  function monotone(pts) {   // Fritsch–Carlson slopes: a smooth line through each point without overshoot
    var n = pts.length, d = [], m = [];
    for (var i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 3 * (pts[i + 1][0] - pts[i - 1][0]) / ((2 * pts[i + 1][0] - pts[i][0] - pts[i - 1][0]) / d[i - 1] + (pts[i + 1][0] + pts[i][0] - 2 * pts[i - 1][0]) / d[i]);
    return m;
  }
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, n = cur(), px0 = 40, px1 = W - 10, py0 = 20, py1 = H - 32;
    var LA0 = 0, LA1 = Math.log10(300), X = function (A) { return px0 + (Math.log10(A) - LA0) / (LA1 - LA0) * (px1 - px0); }, Y = function (v) { return py1 - v / 10 * (py1 - py0); };   // A on a log scale, 1 to 300
    ctx.fillStyle = C('band'); ctx.fillRect(X(56), py0, X(62) - X(56), py1 - py0);
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(px0 + 0.5, py0 + 0.5, px1 - px0, py1 - py0);
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('b. Binding energy per nucleon (MeV) against A', px0, 3);
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('muted'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('peak region', X(62) + 3, py1 - 3); ctx.textBaseline = 'top';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [1, 2, 5, 10, 20, 50, 100, 200].forEach(function (A, i) { ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(Math.round(X(A)) + 0.5, py1); ctx.lineTo(Math.round(X(A)) + 0.5, py1 + 3); ctx.stroke(); ctx.fillStyle = C('fg'); ctx.textAlign = i === 0 ? 'left' : 'center'; ctx.fillText(String(A), X(A), py1 + 4); });
    ctx.textAlign = 'right'; ctx.fillStyle = C('fg'); ctx.fillText('mass number A (log scale)', px1, py1 + 17);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    [0, 2, 4, 6, 8, 10].forEach(function (v) { ctx.strokeStyle = C('grid'); ctx.beginPath(); ctx.moveTo(px0, Math.round(Y(v)) + 0.5); ctx.lineTo(px1, Math.round(Y(v)) + 0.5); ctx.stroke(); ctx.fillStyle = C('muted'); ctx.fillText(String(v), px0 - 4, Y(v)); });
    // the line
    var pts = curvePoints().map(function (q) { return [Math.log10(q[0]), q[1]]; }), m = monotone(pts), XL = function (la) { return px0 + (la - LA0) / (LA1 - LA0) * (px1 - px0); };
    ctx.strokeStyle = C('curve'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(XL(pts[0][0]), Y(pts[0][1]));
    for (var i = 0; i < pts.length - 1; i++) { var h = pts[i + 1][0] - pts[i][0]; for (var k = 1; k <= 12; k++) { var t = k / 12, h00 = 2 * t * t * t - 3 * t * t + 1, h10 = t * t * t - 2 * t * t + t, h01 = -2 * t * t * t + 3 * t * t, h11 = t * t * t - t * t; var v = h00 * pts[i][1] + h10 * h * m[i] + h01 * pts[i + 1][1] + h11 * h * m[i + 1]; ctx.lineTo(XL(pts[i][0] + t * h), Y(v)); } }
    ctx.stroke();
    // every nuclide as a point
    NUC.forEach(function (q) { var p = calc(q).per; ctx.beginPath(); ctx.arc(X(q.A), Y(p), 3.2, 0, 6.283); ctx.fillStyle = C('bg'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 1.2; ctx.stroke(); });
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('fg'); ctx.textBaseline = 'middle';
    [['H-2', 'left', 6, 0], ['He-4', 'right', -7, -2], ['Fe-56', 'center', 0, -13], ['U-235', 'center', 0, -13]].forEach(function (k) { if (k[0] === st.id) return; var q = byId[k[0]], p = calc(q).per; ctx.textAlign = k[1]; ctx.fillText(k[0], X(q.A) + k[2], Y(p) + k[3]); });
    // optional arrows, plain
    if (st.arrows) {
      ctx.strokeStyle = C('fg'); ctx.fillStyle = C('fg'); ctx.lineWidth = 1.3;
      var arrow = function (x0, y0, x1, y1, label, lx2, ly2) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); var a = Math.atan2(y1 - y0, x1 - x0); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 7 * Math.cos(a - 0.4), y1 - 7 * Math.sin(a - 0.4)); ctx.lineTo(x1 - 7 * Math.cos(a + 0.4), y1 - 7 * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill(); ctx.font = '600 11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, lx2, ly2); };
      var he = calc(byId['He-4']).per, h3 = calc(byId['H-3']).per, u = calc(byId['U-235']).per;
      arrow(X(3) + 2, Y(h3) - 6, X(4) - 2, Y(he) + 8, 'fusion', X(3) + 8, Y(4.2));
      arrow(X(225), Y(u) + 14, X(118), Y(8.6) + 14, 'fission', X(130), Y(8.6) + 28);
    }
    // the selected nuclide
    var pn = calc(n).per;
    ctx.strokeStyle = C('focus'); ctx.lineWidth = 1; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(Math.round(X(n.A)) + 0.5, py0); ctx.lineTo(Math.round(X(n.A)) + 0.5, py1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C('focus'); ctx.beginPath(); ctx.arc(X(n.A), Y(pn), 4.5, 0, 6.283); ctx.fill();
    var right = X(n.A) > (px0 + px1) * 0.6; ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = right ? 'right' : 'left'; ctx.textBaseline = 'middle'; ctx.fillText(n.label.replace(/ \(.*\)/, '') + ' ' + pn.toFixed(3), X(n.A) + (right ? -8 : 8), Y(pn) + (pn > 8 ? 14 : -14));
  }

  // ===========================================================================
  // Text
  // ===========================================================================
  function readout() { var n = cur(), r = calc(n); return n.label + ': mass defect ' + r.dm.toFixed(4) + ' amu, ' + r.mev.toFixed(1) + ' MeV, ' + r.per.toFixed(3) + ' MeV per nucleon.'; }
  function updateText() {
    var n = cur(), r = calc(n);
    setText('rZNA', n.Z + ', ' + n.N + ', ' + n.A); setText('rM', n.M.toFixed(4) + ' amu'); setText('rP', r.parts.toFixed(4) + ' amu'); setText('rD', r.dm.toFixed(4) + ' amu');
    setText('rJ', sciJ(r.J) + ' J'); setText('rMeV', r.mev.toFixed(1) + ' MeV'); setText('rPer', r.per.toFixed(3) + ' MeV');
    if (el('nuclide').value !== st.id) el('nuclide').value = st.id; if (el('arrows').checked !== st.arrows) el('arrows').checked = st.arrows;
    setText('status', n.label + ': ' + n.Z + ' protons, ' + n.N + ' neutrons, ' + n.Z + ' electrons. Readings are steady.');
    setText('caption', 'a. Not to scale; particles drawn in groups for large nuclei; the tilt is exaggerated. Protons red, neutrons grey, electrons open circles with a minus sign.');
    setText('caption2', 'b. Binding energy per nucleon from the mass defect; the textbook’s rounded particle masses. A on a log scale. Every nuclide in the table is a point, joined by a smooth line (the mean of H-3 and He-3 at A = 3); the marked point is the selected nuclide.');
    setText('quick', 'Quick start: choose a nuclide; the box under the balance shows or hides the fusion and fission arrows on the plot.');
    setText('descScene', 'A balance with ' + n.Z + ' protons, ' + n.N + ' neutrons and ' + n.Z + ' electrons (' + r.parts.toFixed(4) + ' amu) on the lower pan and one ' + n.label + ' atom (' + n.M.toFixed(4) + ' amu) on the higher pan. At the beam: Δm = ' + r.dm.toFixed(4) + ' amu; E = Δm c² = ' + sciJ(r.J).replace(' × 10', ' times 10 to the ') + ' J = ' + r.mev.toFixed(2) + ' MeV.');
    setText('descPanel', 'Plot of binding energy per nucleon against mass number from 0 to 240, every nuclide in the table drawn as a point, the band A 56 to 62 shaded and labelled peak region' + (st.arrows ? ', with arrows labelled fusion (from A 2 and 3 toward helium-4) and fission (from uranium-235 toward the middle)' : '') + '. Marked: ' + n.label + ' at A = ' + n.A + ', ' + r.per.toFixed(3) + ' MeV per nucleon.');
  }
  function render() { drawScene(); drawPanel(); updateText(); }

  (function fillMenu() {
    ['Light (A ≤ 20)', 'Middle (A 40–64)', 'Heavy (A ≥ 138)'].forEach(function (g) { var og = document.createElement('optgroup'); og.label = g; NUC.filter(function (n) { return group(n) === g; }).sort(function (a, b) { return a.A - b.A || a.Z - b.Z; }).forEach(function (n) { var o = document.createElement('option'); o.value = n.id; o.textContent = n.label; og.appendChild(o); }); el('nuclide').appendChild(og); });
  })();
  var restTimer = null;
  function changed() { render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say(readout()); }, 500); }
  el('nuclide').addEventListener('change', function () { var k = el('nuclide').value; if (byId[k]) { st.id = k; changed(); } });
  el('arrows').addEventListener('change', function () { st.arrows = el('arrows').checked; changed(); });

  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  window.addEventListener('resize', function () { render(); });   // a zoom changes the device pixel ratio: redraw at the new density
  render();
})();
</script>
</body>
</html>
