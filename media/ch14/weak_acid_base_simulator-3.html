<!--

    themes and accessibility.
  Brief (one line): ch14_acidbase, every Acids & Bases scenario (first: "Same Label, Different pH"), opens at the meaning
    question: a weak acid or base ionizes only partly; proton transfer runs both ways; the fraction grows on dilution;
    the partner ion pushes the equilibrium back. No sentence states a verdict, a direction, or a reason.
  Data source: the brief's table (instructor, 16 Oct 2026): Ka and Kb at 25 °C from OpenStax Appendices H and I
    (acetic 1.8 × 10^-5, formic 1.8 × 10^-4, hypochlorous 2.9 × 10^-8, hydrofluoric 6.4 × 10^-4, nitrous 4.6 × 10^-4;
    ammonia 1.8 × 10^-5, methylamine 4.4 × 10^-4; added 16 Oct by change brief: trimethylamine 6.3 × 10^-5,
    dimethylamine 5.9 × 10^-4, Appendix I); Kw = 1.0 × 10^-14 (OpenStax 14.1); comparison HCl and NaOH.
    x solves x² + (s + K)x − Kc = 0 (positive root); "x if x is dropped" is √(Kc).
    Display choices: the slider from 1.0 × 10^-5 M (the instructor, 16 Oct; the brief had 1.0 × 10^-4) to 2.0 M;
    the partner salt adds s equal to c, once.
  Model: no activity corrections; water's own ions left out.
  URL parameters:
    species  acetic | formic | hypochlorous | hydrofluoric | nitrous | ammonia | methylamine | trimethylamine |
             dimethylamine. Default acetic; unknown
             values fall back with a notice.
    c        mol/L, 1.0 × 10^-5 to 2.0. Default 2.0.
    theme    light | dark. Default: the system setting.
    K        passed by the tutor; ignored (the table above is used).
  Cartoon choices (not data): 100 molecules drawn whatever the concentration; ion pairs last about 3 s; the partner
    salt's ions drawn hollow, the sodium or chloride ions not drawn; 30 water molecules drawn faintly; the 2-minute
    idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Play or uses a control.

<body>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 16 Oct 2026). Ka from OpenStax Appendix H, Kb from Appendix I.
  // ===========================================================================
  var KW_P = 14.00;   // Kw = 1.0 × 10^-14 at 25 °C (OpenStax 14.1)
  var SPECIES = {
    acetic:       { acid: true,  K: 1.8e-5, Kshow: '1.8 × 10⁻⁵', show: 'CH₃COOH', name: 'acetic acid',       ion: 'CH₃COO⁻', ionName: 'acetate ions',       salt: 'sodium acetate' },
    formic:       { acid: true,  K: 1.8e-4, Kshow: '1.8 × 10⁻⁴', show: 'HCOOH',   name: 'formic acid',       ion: 'HCOO⁻',   ionName: 'formate ions',       salt: 'sodium formate' },
    hypochlorous: { acid: true,  K: 2.9e-8, Kshow: '2.9 × 10⁻⁸', show: 'HClO',    name: 'hypochlorous acid', ion: 'ClO⁻',    ionName: 'hypochlorite ions',  salt: 'sodium hypochlorite' },
    hydrofluoric: { acid: true,  K: 6.4e-4, Kshow: '6.4 × 10⁻⁴', show: 'HF',      name: 'hydrofluoric acid', ion: 'F⁻',      ionName: 'fluoride ions',      salt: 'sodium fluoride' },
    nitrous:      { acid: true,  K: 4.6e-4, Kshow: '4.6 × 10⁻⁴', show: 'HNO₂',    name: 'nitrous acid',      ion: 'NO₂⁻',    ionName: 'nitrite ions',       salt: 'sodium nitrite' },
    ammonia:      { acid: false, K: 1.8e-5, Kshow: '1.8 × 10⁻⁵', show: 'NH₃',     name: 'ammonia',           ion: 'NH₄⁺',    ionName: 'ammonium ions',      salt: 'ammonium chloride' },
    methylamine:  { acid: false, K: 4.4e-4, Kshow: '4.4 × 10⁻⁴', show: 'CH₃NH₂',  name: 'methylamine',       ion: 'CH₃NH₃⁺', ionName: 'methylammonium ions', salt: 'methylammonium chloride' },
    trimethylamine: { acid: false, K: 6.3e-5, Kshow: '6.3 × 10⁻⁵', show: '(CH₃)₃N', name: 'trimethylamine',  ion: '(CH₃)₃NH⁺', ionName: 'trimethylammonium ions', salt: 'trimethylammonium chloride' },   // change brief, 16 Oct; Appendix I
    dimethylamine:  { acid: false, K: 5.9e-4, Kshow: '5.9 × 10⁻⁴', show: '(CH₃)₂NH', name: 'dimethylamine',  ion: '(CH₃)₂NH₂⁺', ionName: 'dimethylammonium ions', salt: 'dimethylammonium chloride' }    // change brief, 16 Oct; Appendix I
  };
  var FLOOR = 1.0e-5, CEIL = 2.0, DEFAULT = { species: 'acetic', c: 2.0 };   // display choices (brief)

  // Cartoon choices:
  var N_MOL = 100, N_WATER = 30, PAIR_LIFE_S = 3.0, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters (the tutor also passes K; it is ignored and the table above is used)
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var key = DEFAULT.species, raw = (params.get('species') || '').trim().toLowerCase();
  if (raw) { if (SPECIES[raw]) key = raw; else notices.push('No data for “' + raw.slice(0, 40) + '” here; showing acetic acid.'); }
  var c0 = DEFAULT.c, rawC = params.get('c');
  if (rawC !== null && rawC.trim() !== '') {
    var v = Number(rawC);
    if (isFinite(v) && v >= FLOOR * (1 - 1e-9) && v <= CEIL * (1 + 1e-9)) c0 = Math.min(Math.max(v, FLOOR), CEIL);
    else notices.push('The concentration could not be read; showing 2.0 M.');
  }
  var key0 = key, S = SPECIES[key];
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry: x² + (s + K)x − Kc = 0, the positive root (written so no digits are lost); pH and pOH in hundredths.
  // ===========================================================================
  var st;
  function xOf(c, s) { var b = s + S.K; return 2 * S.K * c / (b + Math.sqrt(b * b + 4 * S.K * c)); }
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }
  function reading() {
    var x = Math.min(xOf(st.c, st.s), st.c), p = hundredths(-Math.log10(x)), q = KW_P * 100 - p, other = Math.pow(10, -(KW_P + Math.log10(x)));
    var r = S.acid ? { h: x, oh: other, pH: p, pOH: q } : { h: other, oh: x, pH: q, pOH: p };
    r.x = x; r.xd = Math.sqrt(S.K * st.c); r.pct = 100 * x / st.c; return r;
  }
  function strongReading() {   // HCl or NaOH at the same c: 100 % ionized
    var p = hundredths(-Math.log10(st.c));
    return S.acid ? { name: 'HCl', pH: p } : { name: 'NaOH', pH: KW_P * 100 - p };
  }

  // ===========================================================================
  // Formatting: 3 significant figures; c to 2; pH to 2 decimals; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function supE(e) { return String(e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function fmtN(v, sf) {
    if (!(v > 0)) return '0';
    var e = Math.floor(Math.log10(v)), k = Math.pow(10, sf - 1), r = Math.round(v / Math.pow(10, e) * k + 1e-7) / k; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(sf - 1) + ' × 10' + supE(e);
    return (r * Math.pow(10, e)).toFixed(Math.max(0, sf - 1 - e));
  }
  function fmt(v) { return fmtN(v, 3); }
  function fmt2(v) { return fmtN(v, 2); }
  function round2(v) { var e = Math.floor(Math.log10(v)); return Math.round(v / Math.pow(10, e) * 10 + 1e-7) / 10 * Math.pow(10, e); }
  function fmtP(h) { var a = Math.abs(h), s = Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); return (h < 0 ? '−' : '') + s; }
  function fmtPct(p) { return p >= 99.95 ? '100' : fmtN(p, 3); }
  function spoken(t) {
    return t.replace(/( × )?10(⁻?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (a, times, minus, d) { return (times ? ' times ' : '') + '10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); })
      .replace(/−(\d)/g, 'minus $1').replace(/\[H₃O⁺\]|H₃O⁺/g, 'hydronium').replace(/\[OH⁻\]|OH⁻/g, 'hydroxide').replace(/(\d) M\b/g, '$1 molar').replace(/ %/g, ' percent')
      .replace(/CH₃COOH/g, 'acetic acid').replace(/HCOOH/g, 'formic acid').replace(/HClO/g, 'hypochlorous acid').replace(/HNO₂/g, 'nitrous acid').replace(/\bHF\b/g, 'hydrofluoric acid')
      .replace(/\(CH₃\)₃N/g, 'trimethylamine').replace(/\(CH₃\)₂NH/g, 'dimethylamine').replace(/CH₃NH₂/g, 'methylamine').replace(/NH₃/g, 'ammonia');
  }

  // ===========================================================================
  // The drawing: 100 molecules, whatever the concentration. The number ionized follows the percent ionized.
  // An acid molecule hands its proton to water (anion + hydronium); a base takes one from water (cation + hydroxide).
  // ===========================================================================
  var PW = { w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function P(kind, x, y) { return { k: kind, x: x, y: y, vx: rnd(-20, 20), vy: rnd(-20, 20), a: rnd(0, 6.3) }; }
  function count(k, f) { var n = 0; st.parts.forEach(function (p) { if (p.k === k && (!f || f(p))) n++; }); return n; }
  function nearest(list, x, y) { var best = null, bd = Infinity; list.forEach(function (q) { var d = (q.x - x) * (q.x - x) + (q.y - y) * (q.y - y); if (d < bd) { bd = d; best = q; } }); return best; }
  function target() { return reading().pct; }   // ionized molecules out of 100, on average
  function ionized() { return count('ION', function (p) { return !p.partner; }); }
  function seedAll() {
    st.parts = []; st.moves = [];
    for (var i = 0; i < N_WATER; i++) st.parts.push(P('W', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    for (i = 0; i < N_MOL; i++) st.parts.push(P('MOL', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    placePartner();
    settleStatic();
  }
  function placePartner() {   // the partner salt's ions, drawn hollow, as many as there are molecules times s/c (capped at 100)
    st.parts = st.parts.filter(function (p) { return !p.partner; });
    var n = st.s > 0 ? Math.min(N_MOL, Math.round(N_MOL * st.s / st.c)) : 0;
    for (var i = 0; i < n; i++) { var q = P('ION', rnd(8, PW.w - 8), rnd(8, PW.h - 8)); q.partner = true; st.parts.push(q); }
  }
  // A proton only ever moves between neighbours (about 11 px apart in the drawing), never across the window.
  var NEAR = 16, HOP_S = 0.35, MEET_S = 0.5;
  function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function ionize(animate, delay) {   // one molecule and the water molecule beside it become an ion pair
    var ms = st.parts.filter(function (p) { return p.k === 'MOL' && !p.busy; }), ws = st.parts.filter(function (p) { return p.k === 'W' && !p.busy; });
    if (!ms.length) return;
    var m = ms[Math.floor(Math.random() * ms.length)], w = ws.length ? nearest(ws, m.x, m.y) : null;
    if (!w || dist(w, m) > NEAR) {   // water is plentiful: the neighbour is drawn beside the molecule (a far one is no longer drawn)
      var t = rnd(0, 6.283); w = P('W', m.x + 11 * Math.cos(t), m.y + 11 * Math.sin(t)); st.parts.push(w);
      if (count('W') > N_WATER) { var far = ws.filter(function (q) { return dist(q, m) > 60; })[0]; if (far) st.parts.splice(st.parts.indexOf(far), 1); }
    }
    var done = function () { m.k = 'ION'; w.k = S.acid ? 'H3O' : 'OH'; m.busy = w.busy = false; m.mate = w; w.mate = m; m.life = rnd(0.6, 1.4) * PAIR_LIFE_S; };
    if (!animate) return done();
    m.busy = w.busy = true; st.moves.push({ from: S.acid ? m : w, to: S.acid ? w : m, t: -(delay || 0), dur: HOP_S, after: done });
  }
  function recombine(m, animate) {   // an ion and the nearest partner ion meet, and the proton goes back: a molecule and a water molecule
    var kind = S.acid ? 'H3O' : 'OH', ws = st.parts.filter(function (p) { return p.k === kind && !p.busy; });
    var w = ws.length ? nearest(ws, m.x, m.y) : m.mate; if (!w) return 0;
    var done = function () { m.k = 'MOL'; w.k = 'W'; if (m.mate && m.mate !== w) m.mate.mate = null; if (w.mate && w.mate !== m) w.mate.mate = null; m.mate = w.mate = null; m.busy = w.busy = false; delete m.life; };
    if (!animate) { done(); return 0; }
    m.busy = w.busy = true;
    var meet = dist(m, w) > NEAR ? MEET_S : 0;
    if (meet) st.moves.push({ meet: true, a: m, b: w, ax: m.x, ay: m.y, bx: w.x, by: w.y, t: 0, dur: meet, after: function () {} });
    st.moves.push({ from: S.acid ? w : m, to: S.acid ? m : w, t: -meet, dur: HOP_S, after: done });
    return meet;
  }
  function settleStatic() {   // paused or reduced motion: exactly the rounded percent
    st.moves.slice().forEach(function (mv) { mv.after(); }); st.moves = [];
    var want = Math.round(target()), have = ionized(), g = 0;
    while (have > want && g++ < 200) { var m = st.parts.find(function (p) { return p.k === 'ION' && !p.partner; }); recombine(m, false); have--; }
    while (have < want && g++ < 400) { var before = have; ionize(false); have = ionized(); if (have === before) break; }
  }
  function tick(dt) {
    st.moves.forEach(function (mv) {
      mv.t += dt;
      if (mv.meet) {   // the two ions drift together until they are neighbours
        var f = Math.max(0, Math.min(1, mv.t / mv.dur)), mx = (mv.ax + mv.bx) / 2, my = (mv.ay + mv.by) / 2, dx = mv.bx - mv.ax, dy = mv.by - mv.ay, d = Math.sqrt(dx * dx + dy * dy) || 1;
        var ex = mx - dx / d * 5.5, ey = my - dy / d * 5.5, fx = mx + dx / d * 5.5, fy = my + dy / d * 5.5;
        mv.a.x = mv.ax + (ex - mv.ax) * f; mv.a.y = mv.ay + (ey - mv.ay) * f; mv.b.x = mv.bx + (fx - mv.bx) * f; mv.b.y = mv.by + (fy - mv.by) * f;
      }
    });
    st.moves = st.moves.filter(function (mv) { if (mv.t < mv.dur) return true; mv.after(); return false; });
    var want = target(), have = ionized();
    if (want >= 1) {
      // settled: the count matches the rounded percent; a molecule ionizes as an ion pair takes its proton back
      var w = Math.round(want);
      if (have < w && Math.random() < 3 * dt) ionize(true);
      else if (have > w && Math.random() < 3 * dt) { var m = st.parts.find(function (p) { return p.k === 'ION' && !p.partner && !p.busy; }); if (m) recombine(m, true); }
