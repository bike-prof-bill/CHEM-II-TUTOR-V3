<title>Titration</title>
<!--
  DRAFT: not for students until the instructor approves it.
  Date: 17 Oct 2026. Built by Simulation_Claude to 00_README_BRIEF_titration.md (SCENARIO_CLAUDE, 17 Oct 2026), from
    buffer_simulator.html (98b62a53): its meter, scale (labeled 0, 7, 14), quick-start style, themes, keyboard steps,
    accessibility and the Safari fix (labels are written only when they change).
  Brief (one line): ch14_titration, every titration scenario (first: "The Vinegar Lab"), opens at the meaning question: as NaOH
    is added to an acid, the pH follows a curve whose regions are set by moles; an indicator changes color where the curve
    passes through its range. No sentence names a region, or states which way the pH moves or why.
  Data source: the brief's table (instructor, 17 Oct 2026): acetic acid Ka 1.8 × 10^-5 (OpenStax Appendix H); lactic acid
    Ka 1.36 × 10^-4 (OpenStax Exercise 63); HCl, complete ionization (OpenStax 14.2); Kw = 1.0 × 10^-14 (OpenStax 14.1).
    Indicators (OpenStax 14.7): phenolphthalein colorless below pH 8.2, turning pink across 8.2 to 10.0; methyl red red below
    4.4, yellow above 6.2, orange between.
    Every pH solves the charge balance by bisection: weak acid h + [Na+] = Ka C/(Ka + h) + Kw/h; HCl h + [Na+] = C + Kw/h;
    C = mol acid ÷ total volume, [Na+] = mol NaOH ÷ total volume, total volume = sample + titrant.
    Display choices: default 25.00 mL of 0.0800 M acetic acid, titrant 0.100 M NaOH (problem V1); steps of 1.00 mL, 0.10 mL
    and one drop of 0.05 mL; the titrant runs from 0 to twice the volume at which its moles equal the acid's.
  URL parameters:
    pair     strong | weak. strong means HCl; weak takes the acid from species. Default: from species.
    species  acetic | lactic | HCl. Default acetic; unknown values fall back with a notice.
    ca, cb   mol/L of the acid (0.0010 to 2.00) and the NaOH (0.0010 to 1.000). Default 0.0800 and 0.100. (Ranges widened
             17 Oct by change brief for "The Stockroom Standard" and "The Sour Whey"; the pH axis now runs −1 to 15.)
    va       mL of acid sample, 1.0 to 100. Default 25.00.
    vb       mL of NaOH already added, 0 to twice the matching volume. Default 0.
    theme    light | dark. Default: the system setting.
  Bench motion (added 17 Oct on the instructor's word): drops fall from the burette on each addition (5 for 1.00 mL, 2 for 0.10 mL,
    1 for a drop, about 6 a second during a run), ripple where they land, the stir bar turns and the flask's level rises with the
    volume; the flask's color follows the indicator over about half a second, while the meter reads at once.
  Cartoon choices (not data): about 100 drawn units for the acid; free hydroxide capped at 40; sodium not drawn; 24 water
    molecules drawn faintly; "Run" adds titrant over about 8 s; a held button repeats about 8 times a second after 0.4 s;
    a 50 mL burette (longer if needed); the 2-minute idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student adds titrant or presses Play.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f6; --fg: #1d1e1c; --muted: #4b4d49; --rule: #7f8378; --grid: #e2e3dd; --control-bg: #ffffff; --focus: #7a3a10;
    --win-bg: #f1f2ee; --body: #8a6a1c; --body-edge: #3a2c08; --sign: #ffffff; --curve: #3b3f45; --band: rgba(138, 90, 0, 0.16);
    --h: #ffffff; --h-edge: #4a4f57; --o: #c8392b; --o-edge: #5a1610; --cl: #2f8a3c; --water: rgba(120, 124, 118, 0.38);
    --notice-bg: #fff3d1; --notice-fg: #3d2c00; --notice-rule: #8a6a00;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #18191b; --fg: #e9eaec; --muted: #b6bac0; --rule: #8d949d; --grid: #303338; --control-bg: #222428; --focus: #ffb38a;
    --win-bg: #202226; --body: #e0c060; --body-edge: #fff1c4; --sign: #18191b; --curve: #e9eaec; --band: rgba(240, 178, 90, 0.20);
    --h: #e9eaec; --h-edge: #a49aa8; --o: #ff7366; --o-edge: #ffd2cc; --cl: #5cc46a; --water: rgba(190, 194, 200, 0.32);
    --notice-bg: #3a3010; --notice-fg: #ffe9a8; --notice-rule: #c9a63a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 8px 12px; max-width: 640px; }
  h1 { font-size: 0.95rem; font-weight: 600; margin: 0 0 4px; }
  .notice { margin: 0 0 6px; padding: 5px 9px; background: var(--notice-bg); color: var(--notice-fg); border-left: 4px solid var(--notice-rule); font-size: 0.85rem; }
  .top { display: flex; gap: 10px; align-items: stretch; }

  #scene { width: 196px; height: 172px; flex: 0 0 196px; border-radius: 4px; }

  .readings h2 { font-size: 0.8rem; font-weight: 600; margin: 0 0 2px; color: var(--muted); }
  .readings table { border-collapse: collapse; width: 100%; }
  .readings td { padding: 0; line-height: 1.08; font-size: 0.76rem; white-space: nowrap; }
  .readings td:first-child { white-space: normal; }

  button { font: inherit; font-size: 0.82rem; color: var(--fg); background: var(--control-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 7px; cursor: pointer; touch-action: manipulation; }
  select { font: inherit; font-size: 0.82rem; color: var(--fg); background: var(--control-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }

<body>
  <h1 id="title"></h1>
  <p class="notice" id="notice" role="status" hidden></p>

  <div class="top">
    <canvas id="scene" role="img" aria-label="The burette over the flask on a stir plate, with a pH probe. A text description follows." aria-describedby="descScene"></canvas>
    <div class="readings">
      <h2>Readings</h2>
      <table>
        <tr><td>Acid</td><td class="v" id="rAcid"></td></tr>
        <tr><td>Ka</td><td class="v" id="rKa"></td></tr>
        <tr><td>Acid at the start</td><td class="v" id="rNa"></td></tr>
        <tr><td>NaOH added</td><td class="v" id="rNb"></td></tr>
        <tr><td>NaOH volume</td><td class="v" id="rVb"></td></tr>
        <tr><td>Total volume</td><td class="v" id="rV"></td></tr>
        <tr><td>[H₃O⁺]</td><td class="v" id="rH"></td></tr>
        <tr><td>[OH⁻]</td><td class="v" id="rOH"></td></tr>
        <tr><td>pH</td><td class="v" id="rpH"></td></tr>
        <tr><td>pOH</td><td class="v" id="rpOH"></td></tr>
        <tr><td>Indicator color</td><td class="v" id="rInd"></td></tr>
      </table>
    </div>
  </div>
  <p class="status" id="status"></p>

  <div class="row">
    <button type="button" id="add1">Add 1.00 mL</button>
    <button type="button" id="add01">Add 0.10 mL</button>
    <button type="button" id="drop">One drop</button>
    <button type="button" id="run"></button>
    <button type="button" id="reset">Reset</button>
  </div>
  <div class="row">
    <button type="button" id="play">Play</button>
    <label for="acid" class="lab">Acid</label>
    <select id="acid"></select>
    <label for="ind" class="lab">Indicator</label>
    <select id="ind"><option value="php">phenolphthalein</option><option value="mr">methyl red</option></select>
  </div>
  <div class="views">
    <canvas id="curve" role="img" aria-label="The titration curve: pH against mL of NaOH added. A text description follows." aria-describedby="descCurve"></canvas>
    <canvas id="panel" role="img" aria-label="A sketch of the particles in the flask. A text description follows." aria-describedby="descPanel"></canvas>
  </div>
  <p class="small" id="caption"></p>
  <p class="small" id="caption2"></p>
  <p class="small" id="quick"></p>

  <div class="sr-only" id="descScene"></div>
  <div class="sr-only" id="descCurve"></div>
  <div class="sr-only" id="descPanel"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 17 Oct 2026).
  // ===========================================================================
  var KW = 1.0e-14;   // OpenStax 14.1
  var ACIDS = {
    acetic: { K: 1.8e-5,  Kshow: '1.8 × 10⁻⁵',  show: 'CH₃COOH', base: 'CH₃COO⁻', name: 'acetic acid' },    // Appendix H
    lactic: { K: 1.36e-4, Kshow: '1.36 × 10⁻⁴', show: 'HC₃H₅O₃', base: 'C₃H₅O₃⁻', name: 'lactic acid' },    // Exercise 63
    HCl:    { K: null,    Kshow: 'strong',      show: 'HCl',     base: 'Cl⁻',     name: 'hydrochloric acid' } // complete ionization, 14.2
  };
  var INDICATORS = {   // OpenStax 14.7
    php: { name: 'phenolphthalein', lo: 8.2, hi: 10.0 },
    mr:  { name: 'methyl red',      lo: 4.4, hi: 6.2 }
  };
  var DEFAULT = { species: 'acetic', ca: 0.0800, va: 25.00, cb: 0.100, vb: 0 };   // problem V1
  var STEPS = { add1: 100, add01: 10, drop: 5 };   // in hundredths of a mL: 1.00, 0.10 and one drop of 0.05 mL

  // Cartoon choices:
  var N_UNITS = 100, FREE_CAP = 40, N_WATER = 24, RUN_S = 8, REPEAT_DELAY = 400, REPEAT_MS = 120, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var key = DEFAULT.species, raw = (params.get('species') || '').trim(), pair = (params.get('pair') || '').trim().toLowerCase();
  if (raw) { var hit = Object.keys(ACIDS).filter(function (k) { return k.toLowerCase() === raw.toLowerCase(); })[0]; if (hit) key = hit; else notices.push('No data for “' + raw.slice(0, 40) + '”; showing acetic acid.'); }
  if (pair === 'strong') key = 'HCl';
  else if (pair === 'weak' && key === 'HCl') key = 'acetic';
  else if (pair && pair !== 'weak') notices.push('Could not read pair; using the acid named.');
  function rd(name, lo, hi, def, unit) {
    var r = params.get(name); if (r === null || r.trim() === '') return def;
    var v = Number(r); if (isFinite(v) && v >= lo * (1 - 1e-9) && v <= hi * (1 + 1e-9)) return Math.min(Math.max(v, lo), hi);
    notices.push('Could not read ' + name + '; using ' + fmtN(def, 3) + ' ' + unit + '.'); return def;
  }
  var start0 = { ca: rd('ca', 0.0010, 2.0, DEFAULT.ca, 'M'), va: rd('va', 1.0, 100, DEFAULT.va, 'mL'), cb: rd('cb', 0.0010, 1.0, DEFAULT.cb, 'M') };
  start0.vbMax = Math.round(200 * start0.ca * start0.va / start0.cb);   // twice the matching volume, in hundredths of a mL
  start0.vb = Math.round(100 * rd('vb', 0, start0.vbMax / 100, DEFAULT.vb, 'mL'));
  var key0 = key, A = ACIDS[key];
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry: the brief's charge balance, solved by bisection on the pH, in every state.
  // vb is kept in hundredths of a mL so every step is exact.
  // ===========================================================================
  var st;
  function nA() { return st.ca * st.va / 1000; }
  function nB(vb) { return st.cb * (vb === undefined ? st.vb : vb) / 100000; }
  function volL(vb) { return (st.va + (vb === undefined ? st.vb : vb) / 100) / 1000; }
  function pHat(vb) {
    var V = volL(vb), C = nA() / V, Na = nB(vb) / V, lo = -2, hi = 16;
    for (var i = 0; i < 80; i++) {
      var p = (lo + hi) / 2, h = Math.pow(10, -p);
      var f = h + Na - (A.K === null ? C : A.K * C / (A.K + h)) - KW / h;
      if (f > 0) lo = p; else hi = p;
    }
    return (lo + hi) / 2;
  }
  function amounts() { var a = nA() - nB(), free = 0; if (a < 0) { free = -a; a = 0; } return { a: a, b: nA() - a, freeOH: free }; }
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }
  function vEq() { return 100000 * nA() / st.cb; }   // the volume of NaOH whose moles equal the acid's, in hundredths of a mL

  // ===========================================================================
  // Formatting: pH to 2 decimals (decided at the shown value); amounts to 3 significant figures; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function supE(e) { return String(e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function fmtN(v, sf) {
    if (!(v > 0)) return '0';
    var e = Math.floor(Math.log10(v)), k = Math.pow(10, sf - 1), r = Math.round(v / Math.pow(10, e) * k + 1e-7) / k; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(sf - 1) + ' × 10' + supE(e);
    return (r * Math.pow(10, e)).toFixed(Math.max(0, sf - 1 - e));
  }
  function fmt(v) { return fmtN(v, 3); }
  function fmtP(x) { var h = hundredths(x), a = Math.abs(h); return (h < 0 ? '−' : '') + Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); }
  function fmtML(h) { return (h / 100).toFixed(2) + ' mL'; }
  function spoken(t) {
    return t.replace(/( × )?10(⁻?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (a, times, minus, d) { return (times ? ' times ' : '') + '10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); })
      .replace(/−(\d)/g, 'minus $1').replace(/H₃O⁺/g, 'hydronium').replace(/OH⁻/g, 'hydroxide').replace(/(\d) M\b/g, '$1 molar').replace(/(\d) mL\b/g, '$1 milliliters')
      .replace(/CH₃COOH/g, 'acetic acid').replace(/CH₃COO⁻/g, 'acetate').replace(/HC₃H₅O₃/g, 'lactic acid').replace(/C₃H₅O₃⁻/g, 'lactate').replace(/Cl⁻/g, 'chloride');
  }

  // ===========================================================================
  // The indicator, decided at the shown pH so its words always agree with the reading
  // ===========================================================================
  function indicator(p) {
    var I = INDICATORS[st.ind], q = hundredths(p) / 100;
    if (st.ind === 'php') {
      var f = Math.max(0, Math.min(1, (q - I.lo) / (I.hi - I.lo)));
      return { word: q < I.lo ? 'colorless' : q < I.hi ? 'pale pink' : 'pink', rgba: 'rgba(214, 51, 132, ' + (0.65 * f).toFixed(3) + ')', f: f };
    }
    var g = Math.max(0, Math.min(1, (q - I.lo) / (I.hi - I.lo)));   // red to yellow through orange
    var r = Math.round(210 + (232 - 210) * g), gg = Math.round(50 + (205 - 50) * g), b = Math.round(40 + (50 - 40) * g);
    return { word: q < I.lo ? 'red' : q > I.hi ? 'yellow' : 'orange', rgba: 'rgba(' + r + ', ' + gg + ', ' + b + ', 0.62)', f: g };
  }

  // ===========================================================================
  // The sketch (not to scale): about 100 units for the acid, split by mole number. Weak acid: acid and conjugate units;
  // HCl: hydronium units that become water, with chloride as a spectator. Extra hydroxide after the acid is used is drawn free.
  // ===========================================================================
  var PW = { w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function P(kind, x, y) { return { k: kind, x: x, y: y, vx: rnd(-18, 18), vy: rnd(-18, 18), a: rnd(0, 6.3) }; }
  function count(k, f) { var n = 0; st.parts.forEach(function (p) { if (p.k === k && (!f || f(p))) n++; }); return n; }
  function targets() {
    var m = amounts(), a = Math.round(N_UNITS * m.a / nA()), fo = N_UNITS * m.freeOH / nA();
    return { a: a, freeOH: Math.min(FREE_CAP, Math.round(fo)), capped: fo > FREE_CAP + 0.5 };
  }
  function seedAll() {
    st.parts = []; st.moves = [];
    for (var i = 0; i < N_WATER; i++) st.parts.push(P('W', rnd(6, PW.w - 6), rnd(6, PW.h - 6)));
    var t = targets();
    for (i = 0; i < N_UNITS; i++) st.parts.push(P(i < t.a ? 'HA' : (A.K === null ? 'W' : 'A'), rnd(6, PW.w - 6), rnd(6, PW.h - 6)));
    if (A.K === null) for (i = 0; i < N_UNITS; i++) st.parts.push(P('CL', rnd(6, PW.w - 6), rnd(6, PW.h - 6)));   // chloride, a spectator
    settleFree(t);
  }
  function settleFree(t) {
    var have = count('OH', function (p) { return p.free; });
    while (have < t.freeOH) { var q = P('OH', rnd(6, PW.w - 6), rnd(6, PW.h - 6)); q.free = true; st.parts.push(q); have++; }
    while (have > t.freeOH) { var i = st.parts.findIndex(function (p) { return p.k === 'OH' && p.free; }); st.parts.splice(i, 1); have--; }
  }
  function takeProton(animate) {   // an added hydroxide takes a proton from an acid unit (or from a hydronium ion, for HCl)
    var list = st.parts.filter(function (p) { return p.k === 'HA' && !p.busy; }); if (!list.length) return false;
    var u = list[Math.floor(Math.random() * list.length)], done = A.K === null ? 'W' : 'A';
    if (!animate) { u.k = done; return true; }
    var t = rnd(0, 6.283), ion = P('OH', u.x + 10 * Math.cos(t), u.y + 10 * Math.sin(t)); ion.busy = true; st.parts.push(ion); u.busy = true;
    st.moves.push({ from: u, to: ion, t: -0.45, dur: 0.3, after: function () {
      u.k = done; u.busy = false; ion.k = 'W'; ion.busy = false;   // the hydroxide becomes water
      if (count('W') > N_WATER + N_UNITS + 6) { var i = st.parts.findIndex(function (p) { return p.k === 'W' && p !== ion && p !== u; }); if (i >= 0) st.parts.splice(i, 1); }
    } });
    return true;
  }
  function reconcile(animate) {
    var t = targets(), guard = 0;
    if (!animate) {
      st.moves.slice().forEach(function (mv) { mv.after(); }); st.moves = [];
      while (count('HA') > t.a && guard++ < 200) takeProton(false);
      if (count('HA') < t.a) { st.seeded = false; return; }   // only reached on a fresh batch
      settleFree(t); return;
    }
    if (count('HA') - st.moves.length > t.a && st.moves.length < 6) takeProton(true);
    if (!st.moves.length) settleFree(t);
  }

  // ===========================================================================
  // State and time
  // ===========================================================================
  function initState(keepAcidChoice) {
    if (!keepAcidChoice) { key = key0; A = ACIDS[key]; }
    st = { ca: start0.ca, va: start0.va, cb: start0.cb, vb: start0.vb, vbMax: start0.vbMax, ind: st && keepAcidChoice ? st.ind : 'php',
           running: false, started: false, runTo: null, lastInput: 0, parts: [], moves: [], seeded: false, next: 0, pts: [],
           fx: { drops: [], ripples: [], stir: 0, flaskP: null, runDrop: 0, fall: 40 } };
    record(0, true); if (st.vb > 0) record(st.vb, true);
  }
  function record(vb, single) {   // the curve keeps every state the student has reached
    st.pts.push(vb);
    st.pts.sort(function (a, b) { return a - b; }); st.pts = st.pts.filter(function (v, i, a) { return i === 0 || v !== a[i - 1]; });
  }
  function setVb(v, msg) {
    v = Math.max(0, Math.min(st.vbMax, v)); if (v === st.vb) { render(); return; }
    var d = v - st.vb; st.vb = v; record(v); st.lastInput = performance.now();
    if (!isReduced() && d > 0) spawnDrops(d >= 100 ? 5 : d >= 10 ? 2 : 1);
    if (isReduced()) { if (st.seeded) reconcile(false); st.fx.flaskP = pHat(); } else start();
    render(); announce(msg);
  }
  var restTimer = null;
  function announce(msg) { if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500); }
  // The bench in motion: drops fall from the burette tip, ripple where they land, the stir bar turns, and the flask's color
  // follows the indicator over about half a second (the meter reads at once).
  function spawnDrops(n) { for (var i = 0; i < n; i++) st.fx.drops.push({ y: 0, v: 0, wait: i * 0.12 }); }
  function benchTick(dt) {
    var fx = st.fx, p = pHat();
    if (fx.flaskP === null) fx.flaskP = p;
    fx.flaskP += (p - fx.flaskP) * Math.min(1, dt * 5);
    fx.stir += dt * 9;
    if (st.runTo !== null) { fx.runDrop += dt * 6; while (fx.runDrop >= 1) { fx.runDrop -= 1; spawnDrops(1); } }
    fx.drops.forEach(function (d) { if (d.wait > 0) { d.wait -= dt; return; } d.v += 600 * dt; d.y += d.v * dt; });

  function schedule() { if (st.running && !isReduced() && !rafId) rafId = requestAnimationFrame(frame); }
  function start() { st.lastInput = performance.now(); st.started = true; if (isReduced()) return; if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; st.runTo = null; st.fx.drops = []; st.fx.ripples = []; st.fx.flaskP = pHat(); if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (st.seeded) reconcile(false); render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  function holdable(id, fn) {   // pointer press adds once, then repeats while held; a keyboard or screen-reader press adds once
    var b = el(id), timer = null, fromPointer = false;
    function stopRep() { if (timer) { clearTimeout(timer); timer = null; } }
    b.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || b.disabled) return; fromPointer = true; fn();
      var rep = function () { if (b.disabled) return stopRep(); fn(); timer = setTimeout(rep, REPEAT_MS); };
      timer = setTimeout(rep, REPEAT_DELAY);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(function (ev) { b.addEventListener(ev, stopRep); });
    b.addEventListener('click', function () { if (fromPointer) { fromPointer = false; return; } fn(); });
  }
  holdable('add1', function () { if (st.runTo === null) setVb(st.vb + STEPS.add1, 'Added 1.00 mL of NaOH.'); });
  holdable('add01', function () { if (st.runTo === null) setVb(st.vb + STEPS.add01, 'Added 0.10 mL of NaOH.'); });
  holdable('drop', function () { if (st.runTo === null) setVb(st.vb + STEPS.drop, 'Added one drop, 0.05 mL, of NaOH.'); });
  el('run').addEventListener('click', function () {
    if (st.vb >= st.vbMax) return;
    if (isReduced()) { for (var v = st.vb + 5; v <= st.vbMax; v += 5) record(v); st.vb = st.vbMax; if (st.seeded) reconcile(false); render(); announce('Reached ' + fmtML(st.vb) + '.'); return; }
    st.runTo = st.vbMax; start(); say('Running to ' + fmtML(st.vbMax) + '.');
  });
  Object.keys(ACIDS).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = ACIDS[k].name; el('acid').appendChild(o); });
  el('acid').addEventListener('change', function () {   // a fresh sample of the chosen acid, same amounts, nothing added
    var k = el('acid').value; if (!ACIDS[k] || k === key) return;
    stop(); key = k; A = ACIDS[k]; initState(true); st.vb = 0; st.pts = [0]; render(); say('Now showing ' + A.name + ', nothing added. ' + readout());
  });
  el('ind').addEventListener('change', function () { st.ind = el('ind').value === 'mr' ? 'mr' : 'php'; render(); say('Indicator: ' + INDICATORS[st.ind].name + '. ' + readout()); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(false); render(); say('Reset. ' + readout()); });

  // ===========================================================================
  // Start: the problem's own sample, paused.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) stop(); render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  st = null; initState(false);
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
