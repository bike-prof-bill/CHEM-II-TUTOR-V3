<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: reactions_add_haber.json (instructor, 10 Oct 2026).
  // ===========================================================================
  var KC = 0.060;                // N2 + 3H2 <=> 2NH3 at 500 °C, concentrations in mol/L
  var RT = 0.08206 * 773.15;     // L·atm/mol at 500 °C, from the request
  var SP = ['N2', 'H2', 'NH3'], COEF = [-1, -3, 2];
  var NAME = { N2: 'nitrogen', H2: 'hydrogen', NH3: 'ammonia' };
  var LABEL = { N2: 'N₂', H2: 'H₂', NH3: 'NH₃' };
  var DEFAULT = { N2: 0.80, H2: 1.20, NH3: 0, V: 1 };
  var SLIDER_MAX = { N2: 1.00, H2: 3.00, NH3: 1.00 };   // the problems' ranges (opener limits file)
  var PAIR = { N2: 0.25, H2: 0.75, NH3: 0.50 };          // two starts, one finish: the request's example

  // Cartoon choices, as accepted by the instructor for the earlier Haber page and the Martian page:
  var MOLECULES_AT_START = 60, SETTLE_S = 5, EXCHANGE_PER_S = 3, ADD_FRACTION = 0.10, IDLE_STOP_S = 120, WINDOW_S = 20;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  function rd(name) { var r = params.get(name); if (r === null || r.trim() === '') return null; var v = parseFloat(r); return (isFinite(v) && v >= 0 && v <= 10) ? v : NaN; }
  var g = { N2: rd('nN2'), H2: rd('nH2'), NH3: rd('nNH3'), V: rd('V') };
  var start0 = { N2: DEFAULT.N2, H2: DEFAULT.H2, NH3: DEFAULT.NH3, V: DEFAULT.V };
  if (SP.concat(['V']).some(function (k) { return g[k] !== null && isNaN(g[k]); })) notices.push('Some numbers from the tutor could not be read; showing a sample mixture instead.');
  else {
    if (SP.some(function (k) { return g[k] !== null; })) {
      var m = { N2: g.N2 || 0, H2: g.H2 || 0, NH3: g.NH3 || 0 };
      if ((m.N2 > 0 && m.H2 > 0) || m.NH3 > 0) SP.forEach(function (k) { start0[k] = m[k]; if (m[k] > SLIDER_MAX[k]) SLIDER_MAX[k] = Math.ceil(m[k]); });
      else notices.push('This mixture cannot react (it needs nitrogen with hydrogen, or ammonia); showing a sample mixture instead.');
    }
    if (g.V !== null) { if ([1, 2, 5].indexOf(g.V) >= 0) start0.V = g.V; else notices.push('The vessel volume from the tutor is not 1.00, 2.00 or 5.00 L; showing 1.00 L.'); }
  }
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Model (kept from haber_equilibrium.html). Extent x in mol/L:
  // [N2] = a0 − x, [H2] = b0 − 3x, [NH3] = c0 + 2x.
  // ===========================================================================
  function rateOf(v, x) {
    var a = Math.max(0, v.a0 - x), b = Math.max(0, v.b0 - 3 * x), c = Math.max(0, v.c0 + 2 * x);
    return { f: v.kf * a * b * b * b, r: v.kr * c * c, conc: [a, b, c] };
  }
  function dxdt(v, x) { var q = rateOf(v, x); return q.f - q.r; }
  function rk4(v, x, h) { var k1 = dxdt(v, x), k2 = dxdt(v, x + h * k1 / 2), k3 = dxdt(v, x + h * k2 / 2), k4 = dxdt(v, x + h * k3); return x + h * (k1 + 2 * k2 + 2 * k3 + k4) / 6; }
  function xEq(a, b, c) {   // where Q = Kc, by halving the interval
    var lo = -c / 2, hi = Math.min(a, b / 3);
    for (var i = 0; i < 200; i++) { var m = (lo + hi) / 2; if (KC * (a - m) * Math.pow(b - 3 * m, 3) - (c + 2 * m) * (c + 2 * m) > 0) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  function canReact(a, b, c) { return (a > 0 && b > 0) || c > 0; }
  function Q(c) { var bot = c[0] * c[1] * c[1] * c[1], top = c[2] * c[2]; if (bot > 1e-18) return top / bot; return top > 1e-18 ? Infinity : NaN; }
  function pressure(c) { return (c[0] + c[1] + c[2]) * RT; }
  function setOrigin(v, conc) {
    v.a0 = conc[0]; v.b0 = conc[1]; v.c0 = conc[2]; v.x = 0; v.start = conc.slice();
    v.live = canReact(v.a0, v.b0, v.c0);
    v.xe = v.live ? xEq(v.a0, v.b0, v.c0) : 0;
    v.eq = [v.a0 - v.xe, v.b0 - 3 * v.xe, v.c0 + 2 * v.xe];
    v.dir = !v.live || Math.abs(v.xe) < 1e-12 ? 'none' : v.xe > 0 ? 'right' : 'left';
    v.near = false; v.settled = !v.live || Math.abs(v.xe) < 1e-12;
    if (!v.live) return;
    if (v.kr === undefined) { v.kr = EXCHANGE_PER_S / (v.eq[2] * v.eq[2] * v.S); v.kf = KC * v.kr; }
    var x = 0, t = 0, guard = 0, xe = v.xe;
    if (Math.abs(xe) > 1e-12) {
      while (Math.abs(x - xe) > 0.1 * Math.abs(xe) && guard < 2e6) { var h = Math.max(1e-9, 0.002 * Math.abs(xe) / (Math.abs(dxdt(v, x)) + 1e-15)); x = rk4(v, x, h); t += h; guard++; }
      v.g0 = t / SETTLE_S;
    } else { v.g0 = 1; v.near = true; }
  }
  function makeVessel(n, V, perMol, label) {
    var v = { label: label, n0: n, V: V, perMol: perMol, S: perMol * V, w: 0, hist: [], accF: 0, accR: 0, evF: [], evR: [], mols: [], flashes: [], added: 0 };
    setOrigin(v, [n.N2 / V, n.H2 / V, n.NH3 / V]);
    v.first = v.start.slice(); v.firstDir = v.dir;
    v.hist.push(sample(v));
    return v;
  }
  function conc(v) { return rateOf(v, v.x).conc; }
  function sample(v) { var q = rateOf(v, v.x); return { t: v.w, c: q.conc, f: q.f, r: q.r }; }

  // ===========================================================================
  // Molecules (the window's counts follow the concentrations in proportion)
  // ===========================================================================
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function addMol(v, kind, x, y) { v.mols.push({ kind: kind, x: x, y: y, vx: rnd(-26, 26), vy: rnd(-26, 26), a: rnd(0, 6.3), va: rnd(-1, 1) }); }
  function seedMols(v, W, H) {
    v.mols = []; v.flashes = []; v.W = W; v.H = H;
    var c = conc(v);
    SP.forEach(function (k, i) { var n = Math.round(c[i] * v.V * v.perMol); for (var j = 0; j < n; j++) addMol(v, k, rnd(12, W - 12), rnd(12, H - 12)); });
  }
  function count(v, k) { var n = 0; v.mols.forEach(function (m) { if (m.kind === k) n++; }); return n; }
  function takeNear(v, kind, x, y, n) {
    var cand = v.mols.map(function (m, i) { return { i: i, d: (m.x - x) * (m.x - x) + (m.y - y) * (m.y - y), m: m }; }).filter(function (o) { return o.m.kind === kind; }).sort(function (p, q) { return p.d - q.d; }).slice(0, n);
    var pos = cand.map(function (o) { return { x: o.m.x, y: o.m.y }; });
    cand.map(function (o) { return o.i; }).sort(function (p, q) { return q - p; }).forEach(function (i) { v.mols.splice(i, 1); });
    return pos;
  }
  function forming(v) {   // one N2 and three H2 become two NH3
    if (count(v, 'N2') < 1 || count(v, 'H2') < 3) return false;
    var ns = v.mols.filter(function (m) { return m.kind === 'N2'; }), p = ns[Math.floor(Math.random() * ns.length)], px = p.x, py = p.y;
    var from = takeNear(v, 'N2', px, py, 1).concat(takeNear(v, 'H2', px, py, 3));
    addMol(v, 'NH3', px - 6, py); addMol(v, 'NH3', px + 6, py);
    v.flashes.push({ x: px, y: py, from: from, life: 0.9 }); return true;
  }
  function breaking(v) {   // two NH3 become one N2 and three H2
    if (count(v, 'NH3') < 2) return false;
    var ns = v.mols.filter(function (m) { return m.kind === 'NH3'; }), p = ns[Math.floor(Math.random() * ns.length)], px = p.x, py = p.y;
    var from = takeNear(v, 'NH3', px, py, 2);
    addMol(v, 'N2', px, py - 6); addMol(v, 'H2', px - 8, py + 4); addMol(v, 'H2', px + 8, py + 4); addMol(v, 'H2', px, py + 10);
    v.flashes.push({ x: px, y: py, from: from, life: 0.9 }); return true;
  }
  function moveMols(v, dt) {
    v.mols.forEach(function (m) {
      m.vx += rnd(-30, 30) * dt; m.vy += rnd(-30, 30) * dt;
      var sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy); if (sp > 40) { m.vx *= 40 / sp; m.vy *= 40 / sp; }
      m.x += m.vx * dt; m.y += m.vy * dt; m.a += m.va * dt;
      if (m.x < 10) { m.x = 10; m.vx = Math.abs(m.vx); } if (m.x > v.W - 10) { m.x = v.W - 10; m.vx = -Math.abs(m.vx); }
      if (m.y < 10) { m.y = 10; m.vy = Math.abs(m.vy); } if (m.y > v.H - 10) { m.y = v.H - 10; m.vy = -Math.abs(m.vy); }
    });
  }

  // ===========================================================================
  // State
  // ===========================================================================
  var st, vessels, molLayoutDirty = true, lastSettled = [];
  function totalMol(n) { return n.N2 + n.H2 + n.NH3; }
  function buildVessels() {
    if (!st.compare) {
      var n = { N2: st.n.N2, H2: st.n.H2, NH3: st.n.NH3 }, tot = totalMol(n);
      vessels = [makeVessel(n, st.V, tot > 0 ? MOLECULES_AT_START / tot : 1, 'your vessel')];
    } else {
      var per = MOLECULES_AT_START / (PAIR.N2 + PAIR.H2);
      vessels = [makeVessel({ N2: PAIR.N2, H2: PAIR.H2, NH3: 0 }, st.V, per, 'N2 and H2 start'), makeVessel({ N2: 0, H2: 0, NH3: PAIR.NH3 }, st.V, per, 'NH3 start')];
    }
    molLayoutDirty = true; lastSettled = vessels.map(function (v) { return v.settled; });
  }
  function initState() {
    st = { n: { N2: start0.N2, H2: start0.H2, NH3: start0.NH3 }, V: start0.V, compare: false, view: 'mol', running: false, lastInput: 0 };
    buildVessels();
  }

  // ===========================================================================
  // Time step: the smooth model drives the readings and curves; the same rates fire whole-molecule
  // events, forming and breaking separately, so the window keeps reacting both ways at equilibrium.
  // ===========================================================================
  function clockRate(v) {
    if (!v.near && Math.abs(v.x - v.xe) <= 0.03 * Math.abs(v.xe)) { v.near = true; v.nearW = v.w; }
    if (!v.near) return v.g0;
    return v.g0 + (1 - v.g0) * Math.min(1, (v.w - (v.nearW || 0)) / 1.5);
  }
  function advance(v, dt) {
    if (!v.live) { v.w += dt; if (v.w - v.hist[v.hist.length - 1].t >= 0.05) v.hist.push(sample(v)); return; }
    var n = Math.max(1, Math.ceil(dt / 0.01)), hw = dt / n;
    for (var i = 0; i < n; i++) {
      var h = hw * clockRate(v), q = rateOf(v, v.x);
      v.accF += q.f * v.S * h; v.accR += q.r * v.S * h;
      v.x = rk4(v, v.x, h); v.w += hw;
      while (v.accF >= 1) { v.accF -= 1; if (forming(v)) v.evF.push(v.w); }

  function captionText() {
    if (st.view === 'mol') return 'Nitrogen blue, hydrogen white. One forming event: one N₂ and three H₂ become two NH₃. Every atom is kept.';
    if (st.view === 'curves') return st.compare ? 'Thick lines: the N₂ + H₂ start. Thin lines: the NH₃ start. Diamond and circle on the Q line: the two vessels.' : 'Q moves toward K as the curves flatten; the forming and breaking rates meet.';
    return 'The page is the solver you chose: it finds x by running the reaction until it settles.';
  }
  var live = el('live'), restTimer = null;
  function say(m) { live.textContent = ''; setTimeout(function () { live.textContent = m; }, 30); }
  function checkSettled() {
    vessels.forEach(function (v, k) {
      if (v.settled && !lastSettled[k] && v.live) say(spoken((st.compare ? (k === 0 ? 'N₂ and H₂ start: ' : 'NH₃ start: ') : '') + 'Equilibrium reached. ' + readout(v) + ' Ammonia still forms and breaks apart at equal rates.'));
      lastSettled[k] = v.settled;
    });
  }
  function announceAtRest() { if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say(spoken(vessels.map(readout).join(' '))); }, 700); }
  // Safari cancels a click if a button's text is rewritten between press and release, so text, attributes and
  // control states are written only when they change (the page redraws many times a second while running).
  function setT(e, t) { if (e.textContent !== t) e.textContent = t; }
  function setA(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setD(e, d) { if (e.disabled !== d) e.disabled = d; }
  function updateText() {
    var v = vessels[0], c = conc(v);
    setT(el('rN2'), fmtM(c[0])); setT(el('rH2'), fmtM(c[1])); setT(el('rNH3'), fmtM(c[2]));
    setT(el('rQ'), fmtQ(c)); setT(el('rP'), fmtP(c));
    setT(el('status'), statusText());
    setT(el('descScene'), describeScene()); setT(el('descPanel'), describePanel()); setT(el('caption'), captionText());
    SP.forEach(function (k) { setT(el('v' + k), st.n[k].toFixed(2) + ' mol'); setA(el('s' + k), 'aria-valuetext', st.n[k].toFixed(2) + ' moles of ' + NAME[k]); setD(el('s' + k), st.compare); });
    var canAdd = !st.compare && v.live && v.settled;
    setD(el('add'), !canAdd); setD(el('addWhich'), !canAdd);
    setA(el('add'), 'aria-label', canAdd ? 'Add a little of the chosen gas' : 'Add a little of the chosen gas (available once the vessel settles)');
    setT(el('play'), st.running ? 'Pause' : 'Play');
  }

  // ===========================================================================
  // Loop
  // ===========================================================================
  var rafId = null, timerId = null, lastT = 0;
  function tick(dt) {
    vessels.forEach(function (v) {
      advance(v, dt);
      if (!isReduced() && v.W) moveMols(v, dt);
      v.flashes.forEach(function (f) { f.life -= dt; }); v.flashes = v.flashes.filter(function (f) { return f.life > 0; });
    });
    checkSettled();
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(now) { rafId = null; var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; tick(dt); render(); schedule(); }
  function schedule() {
    if (!st.running) return;
    if (isReduced()) { if (!timerId) timerId = setTimeout(function () { timerId = null; var now = performance.now(), dt = Math.min(1, (now - lastT) / 1000); lastT = now; tick(dt); render(); schedule(); }, 1000); }
    else if (!rafId) rafId = requestAnimationFrame(frame);
  }
  function start() { st.lastInput = performance.now(); if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (timerId) { clearTimeout(timerId); timerId = null; } render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  function newRun() { buildVessels(); start(); announceAtRest(); }
  SP.forEach(function (k) {
    var s = el('s' + k); s.max = String(SLIDER_MAX[k]);
    s.addEventListener('input', function () { st.n[k] = Math.round(Number(s.value) * 100) / 100; newRun(); });
    s.addEventListener('keydown', function (e) {
      var key = e.key, d = null;
      if (key === 'ArrowRight' || key === 'ArrowUp') d = e.shiftKey ? 0.01 : 0.1; else if (key === 'ArrowLeft' || key === 'ArrowDown') d = e.shiftKey ? -0.01 : -0.1;
      else if (key === 'PageUp') d = 0.5; else if (key === 'PageDown') d = -0.5;
      else if (key === 'Home') { e.preventDefault(); st.n[k] = 0; s.value = '0'; newRun(); return; } else if (key === 'End') { e.preventDefault(); st.n[k] = SLIDER_MAX[k]; s.value = String(SLIDER_MAX[k]); newRun(); return; }
      if (d !== null) { e.preventDefault(); st.n[k] = Math.round(Math.min(SLIDER_MAX[k], Math.max(0, st.n[k] + d)) * 100) / 100; s.value = String(st.n[k]); newRun(); }
    });
  });
  el('vessel').addEventListener('change', function () { st.V = Number(el('vessel').value); newRun(); });
  el('compare').addEventListener('change', function () { st.compare = el('compare').checked; el('top').classList.toggle('compare', st.compare); newRun(); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(); syncControls(); render(); say('Reset to your starting mixture, paused.'); });
  el('add').addEventListener('click', function () {
    var v = vessels[0], k = el('addWhich').value, i = SP.indexOf(k), c = conc(v);
    var tot = (c[0] + c[1] + c[2]) * v.V, nMol = Math.max(1, Math.round(ADD_FRACTION * tot * v.perMol)), mol = nMol / v.perMol;
    c[i] += mol / v.V; setOrigin(v, c); v.added += 1; v.gaugeMax = 0;
    if (v.W) for (var j = 0; j < nMol; j++) addMol(v, k, rnd(10, 40), rnd(10, v.H - 10));
    lastSettled[0] = false; start();
    say('Added ' + mol.toFixed(2) + ' mol of ' + NAME[k] + '. ' + spoken(readout(v)));
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="view"]'), function (r) { r.addEventListener('change', function () { if (r.checked) { st.view = r.value; render(); } }); });
  function syncControls() {
    SP.forEach(function (k) { el('s' + k).value = String(st.n[k]); });
    el('vessel').value = String(st.V); el('compare').checked = st.compare; el('top').classList.toggle('compare', st.compare);
    document.querySelector('input[name="view"][value="' + st.view + '"]').checked = true;
  }

  // ===========================================================================
  // Start: the student's own problem, paused at time zero.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  initState(); syncControls();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
