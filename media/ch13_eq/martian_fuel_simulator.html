<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: reactions_add_wgs.json (instructor, 11 Oct 2026).
  // ===========================================================================
  var KC = 4.0;                  // CO + H2O <=> CO2 + H2 at 800 K, based on NIST thermodynamic values
  var T_K = 800;                 // fixed
  var R_GAS = 0.08206;           // L·atm/(mol·K), from the request
  var SP = ['CO', 'H2O', 'CO2', 'H2'];
  var NAME = { CO: 'carbon monoxide', H2O: 'steam', CO2: 'carbon dioxide', H2: 'hydrogen' };   // spoken names
  var DEFAULT = { CO: 5.00, H2O: 5.00, CO2: 0, H2: 0, V: 10 };

  var MOLECULES_AT_START = 44;   // cartoon choice; accepted by the instructor, 13 Oct 2026: about this many molecules drawn in a window at the start
  var SETTLE_S = 5;              // cartoon choice; accepted by the instructor, 13 Oct 2026: about 5 s on screen to get 90% of the way
  var EXCHANGE_PER_S = 3;        // cartoon choice; accepted by the instructor, 13 Oct 2026: about 3 swaps a second each way at equilibrium
  var ADD_FRACTION = 0.10;       // cartoon choice; accepted by the instructor, 13 Oct 2026: "a little" = one tenth of the moles in the chamber
  var WINDOW_S = 20, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search);
  var notices = [];
  function rd(name, lo, hi) { var r = params.get(name); if (r === null || r.trim() === '') return null; var v = parseFloat(r); return (isFinite(v) && v >= lo && v <= hi) ? v : NaN; }
  var g = { CO: rd('nCO', 0, 5), H2O: rd('nH2O', 0, 5), CO2: rd('nCO2', 0, 5), H2: rd('nH2', 0, 5), V: rd('V', 0.01, 100) };
  var start0 = { CO: DEFAULT.CO, H2O: DEFAULT.H2O, CO2: DEFAULT.CO2, H2: DEFAULT.H2, V: DEFAULT.V };
  var anyN = SP.some(function (k) { return g[k] !== null; });
  if (SP.concat(['V']).some(function (k) { return g[k] !== null && isNaN(g[k]); })) notices.push('Some numbers from the tutor could not be read (amounts must be 0 to 5.00 mol); showing a sample mixture instead.');
  else {
    if (anyN) SP.forEach(function (k) { start0[k] = g[k] || 0; });
    if (g.V !== null) {
      if ([1, 2, 5, 10].indexOf(g.V) >= 0) start0.V = g.V;
      else notices.push('The vessel volume from the tutor is not one of 1.00, 2.00, 5.00 or 10.0 L; showing 10.0 L.');
    }
  }
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Model. Extent x in mol/L: [CO] = a0 − x, [H2O] = b0 − x, [CO2] = c0 + x, [H2] = d0 + x.
  // ===========================================================================
  function roots(a, b, c, d) {   // Kc (a − x)(b − x) = (c + x)(d + x)
    var A = KC - 1, B = -(KC * (a + b) + (c + d)), Cq = KC * a * b - c * d, D = B * B - 4 * A * Cq;
    if (D < 0) return null;
    var s = Math.sqrt(D), r = [(-B - s) / (2 * A), (-B + s) / (2 * A)].sort(function (p, q) { return p - q; });
    var lo = -Math.min(c, d), hi = Math.min(a, b), tol = 1e-12;
    var inside = r.filter(function (x) { return x >= lo - tol && x <= hi + tol; });
    var phys = inside.length ? inside[0] : null, other = r.filter(function (x) { return x !== phys; })[0];
    return { phys: phys, other: other, lo: lo, hi: hi };
  }
  function canReact(a, b, c, d) { return (a > 0 && b > 0) || (c > 0 && d > 0); }
  function rateOf(ch, x) {
    var a = Math.max(0, ch.a0 - x), b = Math.max(0, ch.b0 - x), c = Math.max(0, ch.c0 + x), d = Math.max(0, ch.d0 + x);
    return { f: ch.kf * a * b, r: ch.kr * c * d, conc: [a, b, c, d] };
  }
  function dxdt(ch, x) { var q = rateOf(ch, x); return q.f - q.r; }
  function rk4(ch, x, h) { var k1 = dxdt(ch, x), k2 = dxdt(ch, x + h * k1 / 2), k3 = dxdt(ch, x + h * k2 / 2), k4 = dxdt(ch, x + h * k3); return x + h * (k1 + 2 * k2 + 2 * k3 + k4) / 6; }
  function setOrigin(ch, conc) {
    ch.a0 = conc[0]; ch.b0 = conc[1]; ch.c0 = conc[2]; ch.d0 = conc[3]; ch.x = 0;
    ch.live = canReact(ch.a0, ch.b0, ch.c0, ch.d0);
    ch.rt = roots(ch.a0, ch.b0, ch.c0, ch.d0);
    ch.xe = ch.live && ch.rt && ch.rt.phys !== null ? ch.rt.phys : 0;
    ch.eq = [ch.a0 - ch.xe, ch.b0 - ch.xe, ch.c0 + ch.xe, ch.d0 + ch.xe];
    ch.near = false; ch.settled = !ch.live || Math.abs(ch.xe) < 1e-12;
    if (!ch.live) return;
    if (ch.kr === undefined) {   // rate constants fixed for the run: ~EXCHANGE_PER_S swaps a second each way at equilibrium
      ch.kr = EXCHANGE_PER_S / (ch.eq[2] * ch.eq[3] * ch.S); ch.kf = KC * ch.kr;
    }
    var x = 0, t = 0, guard = 0, xe = ch.xe;   // clock: model seconds to get 90% of the way, shown over SETTLE_S
    if (Math.abs(xe) > 1e-12) {
      while (Math.abs(x - xe) > 0.1 * Math.abs(xe) && guard < 2e6) { var h = Math.max(1e-9, 0.002 * Math.abs(xe) / (Math.abs(dxdt(ch, x)) + 1e-15)); x = rk4(ch, x, h); t += h; guard++; }
      ch.g0 = t / SETTLE_S;
    } else { ch.g0 = 1; ch.near = true; }
  }
  function makeChamber(n, V, perMol, label) {
    var ch = { label: label, n0: n, V: V, perMol: perMol, S: perMol * V, w: 0, hist: [], accF: 0, accR: 0, evF: [], evR: [], mols: [], flashes: [], added: 0 };
    setOrigin(ch, [n.CO / V, n.H2O / V, n.CO2 / V, n.H2 / V]);

  function sample(ch) { var q = rateOf(ch, ch.x); return { t: ch.w, c: q.conc, Q: Q(q.conc) }; }

  // Molecules
  // ===========================================================================
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function seedMols(ch, W, H) {
    ch.mols = []; ch.flashes = []; ch.W = W; ch.H = H;
    var c = conc(ch);
    SP.forEach(function (k, i) { var n = Math.round(c[i] * ch.V * ch.perMol); for (var j = 0; j < n; j++) addMol(ch, k, rnd(12, W - 12), rnd(12, H - 12)); });
  }
  function addMol(ch, kind, x, y) { ch.mols.push({ kind: kind, x: x, y: y, vx: rnd(-28, 28), vy: rnd(-28, 28), a: rnd(0, 6.3), va: rnd(-1, 1) }); }
  function countOf(ch, k) { var n = 0; ch.mols.forEach(function (m) { if (m.kind === k) n++; }); return n; }
  function swap(ch, dir) {
    var A = dir === 'f' ? 'CO' : 'CO2', B = dir === 'f' ? 'H2O' : 'H2';
    var as = ch.mols.filter(function (m) { return m.kind === A; }), bs = ch.mols.filter(function (m) { return m.kind === B; });
    if (!as.length || !bs.length) return false;
    var m1 = as[Math.floor(Math.random() * as.length)], best = null, bd = Infinity;
    bs.forEach(function (m) { var d = (m.x - m1.x) * (m.x - m1.x) + (m.y - m1.y) * (m.y - m1.y); if (d < bd) { bd = d; best = m; } });
    // the pair meets, swaps an oxygen atom, and each molecule leaves as the other kind

    ch.flashes.push({ x: mx, y: my, from: [{ x: m1.x, y: m1.y }, { x: best.x, y: best.y }], life: 0.9 });
    m1.x = mx - 8; m1.y = my; best.x = mx + 8; best.y = my;
    if (dir === 'f') { m1.kind = 'CO2'; best.kind = 'H2'; } else { m1.kind = 'CO'; best.kind = 'H2O'; }

  }
  function moveMols(ch, dt) {
    ch.mols.forEach(function (m) {
      m.vx += rnd(-30, 30) * dt; m.vy += rnd(-30, 30) * dt;
      var sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy); if (sp > 40) { m.vx *= 40 / sp; m.vy *= 40 / sp; }
      m.x += m.vx * dt; m.y += m.vy * dt; m.a += m.va * dt;
      if (m.x < 10) { m.x = 10; m.vx = Math.abs(m.vx); } if (m.x > ch.W - 10) { m.x = ch.W - 10; m.vx = -Math.abs(m.vx); }

    });
  }

  // ===========================================================================
  // State
  // ===========================================================================
  var st, chambers;
  function totalMol(n) { return n.CO + n.H2O + n.CO2 + n.H2; }
  function buildChambers() {
    var n = { CO: st.n.CO, H2O: st.n.H2O, CO2: st.n.CO2, H2: st.n.H2 }, tot = totalMol(n);
    var perMol = tot > 0 ? MOLECULES_AT_START / tot : 1;
    if (!st.compare) chambers = [makeChamber(n, st.V, perMol, 'your chamber')];
    else {
      var half = tot / 2;   // the same atoms two ways: equal CO and H2O, or equal CO2 and H2
      chambers = [makeChamber({ CO: half, H2O: half, CO2: 0, H2: 0 }, st.V, perMol, 'CO and H2O start'),
                  makeChamber({ CO: 0, H2O: 0, CO2: half, H2: half }, st.V, perMol, 'CO2 and H2 start')];
    }
    molLayoutDirty = true;
    lastAnnouncedSettled = chambers.map(function (c) { return c.settled; });
  }
  function initState() {
    st = { n: { CO: start0.CO, H2O: start0.H2O, CO2: start0.CO2, H2: start0.H2 }, V: start0.V, compare: false, view: 'mol', running: false, lastInput: 0 };
    buildChambers();
  }

  // ===========================================================================
  // Time step
  // ===========================================================================
  function clockRate(ch) {
    if (!ch.near && Math.abs(ch.x - ch.xe) <= 0.03 * Math.abs(ch.xe)) { ch.near = true; ch.nearW = ch.w; }
    if (!ch.near) return ch.g0;
    return ch.g0 + (1 - ch.g0) * Math.min(1, (ch.w - (ch.nearW || 0)) / 1.5);
  }
  function advance(ch, dt) {
    if (!ch.live) { ch.w += dt; if (ch.w - ch.hist[ch.hist.length - 1].t >= 0.05) ch.hist.push(sample(ch)); return; }
    var n = Math.max(1, Math.ceil(dt / 0.01)), hw = dt / n;
    for (var i = 0; i < n; i++) {
      var h = hw * clockRate(ch), q = rateOf(ch, ch.x);
      ch.accF += q.f * ch.S * h; ch.accR += q.r * ch.S * h;
      ch.x = rk4(ch, ch.x, h); ch.w += hw;
      while (ch.accF >= 1) { ch.accF -= 1; if (swap(ch, 'f')) ch.evF.push(ch.w); }
      while (ch.accR >= 1) { ch.accR -= 1; if (swap(ch, 'r')) ch.evR.push(ch.w); }
    }
    var c = conc(ch), m = Math.max.apply(null, ch.eq.concat([1e-9]));

    if (rt.other !== undefined && isFinite(rt.other) && X(rt.other) >= pad.l && X(rt.other) <= pad.l + pw) { mark(ctx, X(rt.other), Y(KC), false); ctx.font = '600 11px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; halo(ctx, 'second root', X(rt.other), Y(KC) + 9); }
  }
  function mark(ctx, x, y, filled) {
    ctx.lineWidth = 2; ctx.beginPath();
    if (filled) { ctx.moveTo(x, y - 7); ctx.lineTo(x + 7, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 7, y); ctx.closePath(); ctx.fillStyle = C('fg'); ctx.fill(); ctx.strokeStyle = C('bg'); ctx.stroke(); }
    else { ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.fillStyle = C('bg'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.stroke(); }
  }
  function niceTicks(a, b, n) { var raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = []; for (var v = Math.ceil(a / step - 1e-9) * step; v <= b + 1e-9; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : v); return out; }

  // ===========================================================================
  // Text
  // ===========================================================================
  var el = function (id) { return document.getElementById(id); };
  function stateOf(ch) {
    if (!ch.live) return 'none';
    if (ch.settled) return 'settled';
    var q = rateOf(ch, ch.x); return q.f > q.r ? 'forward' : 'reverse';
  }
  var WORDS = {
    none: 'These gases cannot swap atoms (a swap needs CO with H₂O, or CO₂ with H₂). Nothing changes.',
    forward: 'Forward swaps outpace reverse ones: CO and H₂O are being used up, CO₂ and H₂ are being made.',
    reverse: 'Reverse swaps outpace forward ones: CO₂ and H₂ are being used up, CO and H₂O are being made.',
    settled: 'Settled: the amounts have stopped changing. Both swaps keep running at equal rates, and the pressure has not moved.'
  };
  function statusText() {
    if (st.compare) {
      var s = chambers.map(stateOf);
      if (s[0] === 'settled' && s[1] === 'settled') return 'Both chambers have settled at the same place. Both swaps keep running at equal rates in each.';
      return 'Same atoms, two starts: one chamber runs forward, the other in reverse.';
    }
    return WORDS[stateOf(chambers[0])] + (chambers[0].added ? ' (Gas was added: the pressure rose because there are more molecules; swapping does not change it.)' : '');
  }
  function describeScene() {
    return chambers.map(function (ch) {
      var c = conc(ch);
      return (st.compare ? (ch.label === 'CO and H2O start' ? 'Chamber started with CO and H₂O: ' : 'Chamber started with CO₂ and H₂: ') : 'A sealed steel chamber on the Martian surface at 800 K. ') +
        'Pressure gauge ' + pressure(c).toPrecision(3) + ' atm. Gas analyzer: CO ' + fmtM(c[0]) + ', H₂O ' + fmtM(c[1]) + ', CO₂ ' + fmtM(c[2]) + ', H₂ ' + fmtM(c[3]) + '. Q ' + fmtQ(c) + '.';
    }).join(' ') + ' ' + statusText();
  }
  function describePanel() {
    if (st.view === 'mol') {
      return chambers.map(function (ch) {
        return (st.compare ? (ch.label === 'CO and H2O start' ? 'CO and H₂O start: ' : 'CO₂ and H₂ start: ') : '') + 'a window into the gas shows ' + countOf(ch, 'CO') + ' CO, ' + countOf(ch, 'H2O') + ' H₂O, ' + countOf(ch, 'CO2') + ' CO₂ and ' + countOf(ch, 'H2') + ' H₂ molecules. ' +
          'In a forward swap a CO and an H₂O meet and leave as a CO₂ and an H₂; in a reverse swap, the opposite. Forward swaps ' + perSecond(ch, ch.evF).toFixed(1) + ' a second, reverse ' + perSecond(ch, ch.evR).toFixed(1) + ' a second.';
      }).join(' ');
    }
    if (st.view === 'curves') {
      return 'Q on a number line, with K = 4.00 marked; ' + chambers.map(function (ch) { return 'Q is ' + fmtQ(conc(ch)); }).join(' and ') + '. Below, concentration against time for CO (solid), H₂O (dashed), CO₂ (dotted) and H₂ (dash-dot); ' +
        (chambers.every(function (ch) { return ch.settled; }) ? 'the lines have gone flat.' : 'the lines are still bending toward flat.');
    }
    var ch = chambers[0];
    if (!ch.live) return 'No swap is possible with this mixture.';
    return 'The expression [CO₂][H₂] / ([CO][H₂O]) plotted against x, with a dashed line at Kc = 4.00. The curve crosses the line twice. One crossing, marked with a filled diamond, lies where every concentration is zero or more: the chamber settles there. ' +
      'The other, the second root, lies in a shaded region labelled "less than nothing", where some concentration would be below zero; the chamber never goes there.';
  }
  function captionText() {
    if (st.view === 'mol') return 'Carbon grey, oxygen red, hydrogen white. A swap moves one oxygen atom; every atom is kept. No oxygen gas is made.';
    if (st.view === 'curves') return st.compare ? 'Thick lines: the CO + H₂O start. Thin lines: the CO₂ + H₂ start. Diamond and circle on the Q line: the two chambers.' : 'Q moves toward K = 4.00 as the analyzer readings go flat.';
    return (st.compare ? 'Shown for the CO + H₂O start. ' : '') + 'Shaded: x that would leave some concentration below zero.';
  }
  var live = el('live'), restTimer = null, lastAnnouncedSettled = [];
  function say(m) { live.textContent = ''; setTimeout(function () { live.textContent = m; }, 30); }
  function readout(ch) { var c = conc(ch); return 'CO ' + fmtM(c[0]) + ', H₂O ' + fmtM(c[1]) + ', CO₂ ' + fmtM(c[2]) + ', H₂ ' + fmtM(c[3]) + '; Q ' + fmtQ(c) + '; pressure ' + pressure(c).toPrecision(3) + ' atm.'; }
  function checkSettled() {
    chambers.forEach(function (ch, k) {
      if (ch.settled && !lastAnnouncedSettled[k] && ch.live) say((st.compare ? (k === 0 ? 'CO and H₂O start: ' : 'CO₂ and H₂ start: ') : '') + 'Equilibrium reached. ' + readout(ch) + ' Both swaps continue at equal rates.');
      lastAnnouncedSettled[k] = ch.settled;
    });
  }
  function announceAtRest() { if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say(chambers.map(readout).join(' ')); }, 700); }
  // Safari cancels a click if a button's text is rewritten between press and release, so text, attributes and
  // control states are written only when they change (the page redraws many times a second while running).
  function setT(e, t) { if (e.textContent !== t) e.textContent = t; }
  function setA(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setD(e, d) { if (e.disabled !== d) e.disabled = d; }
  function updateText() {
    var ch = chambers[0], c = conc(ch);
    setT(el('rCO'), fmtM(c[0])); setT(el('rH2O'), fmtM(c[1])); setT(el('rCO2'), fmtM(c[2])); setT(el('rH2'), fmtM(c[3]));
    setT(el('rQ'), fmtQ(c)); setT(el('rP'), pressure(c).toPrecision(3) + ' atm');
    setT(el('status'), statusText());
    setT(el('descScene'), describeScene()); setT(el('descPanel'), describePanel()); setT(el('caption'), captionText());
    SP.forEach(function (k) { setT(el('v' + k), st.n[k].toFixed(2) + ' mol'); setA(el('s' + k), 'aria-valuetext', st.n[k].toFixed(2) + ' moles of ' + NAME[k]); });
    var canAdd = !st.compare && chambers[0].live && chambers[0].settled;
    setD(el('add'), !canAdd); setD(el('addWhich'), !canAdd);
    setT(el('addNote'), st.compare ? '' : canAdd ? '' : '(once settled)');
    setT(el('play'), st.running ? 'Pause' : 'Play');
  }

  // ===========================================================================
  // Loop
  // ===========================================================================
  var rafId = null, timerId = null, lastT = 0;
  function tick(dt) {
    chambers.forEach(function (ch) {
      advance(ch, dt);
      if (!isReduced() && ch.W) moveMols(ch, dt);
      ch.flashes.forEach(function (f) { f.life -= dt; }); ch.flashes = ch.flashes.filter(function (f) { return f.life > 0; });
    });
    checkSettled();
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(now) { rafId = null; var dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; tick(dt); render(); schedule(); }
  function schedule() {
    if (!st.running) return;
    if (isReduced()) { if (!timerId) timerId = setTimeout(function () { timerId = null; var now = performance.now(), dt = Math.min(1, (now - lastT) / 1000); lastT = now; tick(dt); render(); schedule(); }, 1000); }
    else if (!rafId) rafId = requestAnimationFrame(frame);
  }
  function start() { st.lastInput = performance.now(); if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (timerId) { clearTimeout(timerId); timerId = null; } render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  function newRun() { buildChambers(); start(); announceAtRest(); }   // a control change restarts from the new mixture and runs
  SP.forEach(function (k) {
    var s = el('s' + k);
    s.addEventListener('input', function () { st.n[k] = Math.round(Number(s.value) * 100) / 100; newRun(); });
    s.addEventListener('keydown', function (e) {
      var key = e.key, d = null;
      if (key === 'ArrowRight' || key === 'ArrowUp') d = e.shiftKey ? 0.01 : 0.1; else if (key === 'ArrowLeft' || key === 'ArrowDown') d = e.shiftKey ? -0.01 : -0.1;
      else if (key === 'PageUp') d = 1; else if (key === 'PageDown') d = -1;
      else if (key === 'Home') { e.preventDefault(); st.n[k] = 0; s.value = '0'; newRun(); return; } else if (key === 'End') { e.preventDefault(); st.n[k] = 5; s.value = '5'; newRun(); return; }
      if (d !== null) { e.preventDefault(); st.n[k] = Math.round(Math.min(5, Math.max(0, st.n[k] + d)) * 100) / 100; s.value = String(st.n[k]); newRun(); }
    });
  });
  el('vessel').addEventListener('change', function () { st.V = Number(el('vessel').value); newRun(); });
  el('compare').addEventListener('change', function () { st.compare = el('compare').checked; el('top').classList.toggle('compare', st.compare); newRun(); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(); syncControls(); render(); say('Reset to your starting mixture, paused.'); });
  el('add').addEventListener('click', function () {
    var ch = chambers[0], k = el('addWhich').value, i = SP.indexOf(k), c = conc(ch);
    var tot = (c[0] + c[1] + c[2] + c[3]) * ch.V, nMol = Math.max(1, Math.round(ADD_FRACTION * tot * ch.perMol)), mol = nMol / ch.perMol;
    c[i] += mol / ch.V; setOrigin(ch, c); ch.added += 1;
    if (ch.W) for (var j = 0; j < nMol; j++) addMol(ch, k, rnd(10, 40), rnd(10, ch.H - 10));
    lastAnnouncedSettled[0] = false; start();
    say('Added ' + mol.toFixed(2) + ' mol of ' + NAME[k] + '. ' + readout(ch));
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="view"]'), function (r) { r.addEventListener('change', function () { if (r.checked) { st.view = r.value; render(); } }); });
  function syncControls() {
    SP.forEach(function (k) { el('s' + k).value = String(st.n[k]); });
    el('vessel').value = String(st.V); el('compare').checked = st.compare; el('top').classList.toggle('compare', st.compare);
    document.querySelector('input[name="view"][value="' + st.view + '"]').checked = true;
  }

  // ===========================================================================
  // Start: the student's own problem, paused at time zero.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  initState(); syncControls();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
