  Brief (one line): ch13_eq opener "The Silent Beaker" (a floater), opens at the meaning question: a sealed beaker
    at 25 °C, water over solid AgX (X = Cl, Br, I); a radioactive tracer shows dissolving and settling going on at
    equal rates; adding the salt's own anion makes settling win for a while. No sentence compares Q with K or says
    which way the reaction goes.
  Data source: the brief's table (instructor, 13 Oct 2026). Ksp at 25 °C from OpenStax Chemistry 2e, Appendix J,
    Table J1: AgCl 1.6 × 10^-10, AgBr 5.0 × 10^-13, AgI 1.5 × 10^-16. Starting states and the amounts the sodium

    state) is a display value, not a measurement.
  Model (cartoon, the textbook's simple model: no activities, no dissolved complexes):
    breaking-away rate = kd while solid is present (it depends on the solid's surface, not on the water);
    settling rate      = ks [Ag+][X-], while solid is present or [Ag+][X-] > Ksp; kd/ks = Ksp.

    Tracer: radioactive silver leaves the solid in proportion to its share of the solid and settles in proportion
    to its share of the dissolved silver; the count is proportional to radioactive silver in the water.
    Time is not to scale: the clock runs slower during an approach and at full speed near the end.
  URL parameters (new; Fable to add salt, Ag, X, solid to the tutor's list):
    salt    AgCl | AgBr | AgI, read case-insensitively. Default AgCl; unknown values fall back with a notice.
    Ag, X   mol/L, 0 to 1. Default: that salt's starting state.

    theme   light | dark. Default: the system setting.
  Cartoon choices (not data; listed under Needs your decision when first sent): dots per mol/L (the starting
    [Ag+] draws as 20 dots), the solid drawn as 60 cells, the pellet as 20 cells, about 6 break-away events a
    second at the end, the 60-dot cap per ion, the 5 s approach, the 2-minute idle stop.

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 13 Oct 2026). Ksp at 25 °C, OpenStax Chemistry 2e, Appendix J, Table J1.
  // ===========================================================================
  var SALTS = {
    AgCl: { name: 'silver chloride', X: 'Cl⁻', Xword: 'chloride', sodium: 'sodium chloride', K: 1.6e-10, Kshow: '1.6 × 10⁻¹⁰',
            Ag0: 2.0e-5, X0: 8.0e-6, add: 1.0e-3, addShow: '1.0 × 10⁻³', solid: '#ffffff', solidWord: 'white', ion: 'cl' },
    AgBr: { name: 'silver bromide', X: 'Br⁻', Xword: 'bromide', sodium: 'sodium bromide', K: 5.0e-13, Kshow: '5.0 × 10⁻¹³',
            Ag0: 1.0e-6, X0: 5.0e-7, add: 1.0e-3, addShow: '1.0 × 10⁻³', solid: '#f3e6c0', solidWord: 'pale cream', ion: 'br' },
    AgI:  { name: 'silver iodide', X: 'I⁻', Xword: 'iodide', sodium: 'sodium iodide', K: 1.5e-16, Kshow: '1.5 × 10⁻¹⁶',
            Ag0: 3.0e-8, X0: 5.0e-9, add: 1.0e-5, addShow: '1.0 × 10⁻⁵', solid: '#f2e07a', solidWord: 'pale yellow', ion: 'i' }
  };
  var PLATEAU_CPM = 1000;   // display value for the starting state, not a measurement (instructor, 13 Oct)

  // Cartoon choices:
  var DOTS_AT_START = 20, SOLID_CELLS = 60, PELLET_CELLS = 20, EXCHANGE_PER_S = 6, CAP = 60, MAX_ROWS = 7;
  var SETTLE_S = 5, IDLE_STOP_S = 120;
  var CPM_PER_DOT = PLATEAU_CPM / (PELLET_CELLS * DOTS_AT_START / (DOTS_AT_START + SOLID_CELLS + PELLET_CELLS));

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var saltKey = 'AgCl', rawSalt = (params.get('salt') || '').trim();
  if (rawSalt) {
    var hit = Object.keys(SALTS).filter(function (k) { return k.toLowerCase() === rawSalt.toLowerCase(); })[0];
    if (hit) saltKey = hit; else notices.push('No data for “' + rawSalt.slice(0, 40) + '” here; showing silver chloride.');
  }
  var S = SALTS[saltKey];
  function rd(name) { var r = params.get(name); if (r === null || r.trim() === '') return null; var v = Number(r); return (isFinite(v) && v >= 0 && v <= 1) ? v : NaN; }
  var gAg = rd('Ag'), gX = rd('X'), start0 = { Ag: S.Ag0, X: S.X0, solid: true };
  if ((gAg !== null && isNaN(gAg)) || (gX !== null && isNaN(gX))) notices.push('A concentration could not be read; showing the starting state.');
  else { if (gAg !== null) start0.Ag = gAg; if (gX !== null) start0.X = gX; }
  var rs = (params.get('solid') || '').trim();
  if (rs === '0') start0.solid = false; else if (rs !== '' && rs !== '1') notices.push('The solid setting could not be read; showing solid present.');
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var UNIT = S.Ag0 / DOTS_AT_START;   // mol/L drawn as one dot (cartoon)
  var RD = EXCHANGE_PER_S * UNIT;     // breaking-away rate, mol/L per model second
  var KS = RD / S.K;                  // settling constant, so that RD/KS = Ksp
  var EPS = 1e-6 * UNIT;

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Model. Origin: [Ag+] = A0, [X-] = X0, solid N0 (mol/L of salt), radioactive silver P in all.
  // x = amount dissolved since the origin (negative when solid forms); y = radioactive silver in the water.
  // ===========================================================================
  var m;   // model state
  function at(x) { return { A: Math.max(0, m.A0 + x), X: Math.max(0, m.X0 + x), N: Math.max(0, m.N0 - x) }; }
  function active(c) { return c.N > EPS || c.A * c.X > S.K; }
  function rates(c) {
    if (!active(c)) return { d: 0, s: 0 };
    return { d: c.N > EPS ? RD : 0, s: KS * c.A * c.X };
  }
  function deriv(x, y) {
    var c = at(x), r = rates(c), dx = r.d - r.s;
    if (c.N <= EPS && dx > 0) dx = 0;
    var ts = Math.max(0, m.P - y), dy = 0;
    if (r.d > 0 && c.N > EPS) dy += r.d * Math.min(1, ts / c.N);
    if (r.s > 0) dy -= KS * c.X * y;   // settling of radioactive silver: rate × (y / [Ag+])
    return [dx, dy];
  }
  function stiffness(x) { var c = at(x); return KS * (c.A + c.X) + RD / Math.max(c.N, UNIT) + 1e-9; }
  function step(h) {   // RK4, split so each piece is small against the fastest change
    var need = Math.ceil(h * stiffness(m.x) / 0.3);
    if (need > 4000 && m.near) { m.x = m.xe; m.y = endState().y; m.done = true; return; }   // far faster than the screen can show
    var n = Math.min(4000, Math.max(1, need)), k = h / n;
    for (var i = 0; i < n; i++) {
      var x = m.x, y = m.y;
      var a = deriv(x, y), b = deriv(x + k * a[0] / 2, y + k * a[1] / 2), c = deriv(x + k * b[0] / 2, y + k * b[1] / 2), d = deriv(x + k * c[0], y + k * c[1]);
      m.x = x + k * (a[0] + 2 * b[0] + 2 * c[0] + d[0]) / 6; m.y = Math.max(0, y + k * (a[1] + 2 * b[1] + 2 * c[1] + d[1]) / 6);
    }
  }
  function xEnd(A0, X0, N0) {   // where [Ag+][X-] = Ksp, written to avoid losing digits
    var r = 2 * (S.K - A0 * X0) / ((A0 + X0) + Math.sqrt((A0 - X0) * (A0 - X0) + 4 * S.K));
    return Math.min(r, N0);
  }
  function setOrigin(A, X, N) {
    var keepY = m ? m.y : 0, keepP = m ? m.P : 0;
    m = { A0: A, X0: X, N0: N, x: 0, y: keepY, P: keepP, near: false, w0: 0 };
    var c = at(0);
    m.live = active(c);
    m.xe = m.live ? xEnd(A, X, N) : 0;
    if (!m.live || Math.abs(m.xe) < 1e-9 * (A + X + UNIT)) { m.g0 = 1; m.near = true; return; }
    // time for 90% of the change at full speed, so the approach can be stretched to about SETTLE_S on screen
    var x = 0, t = 0, guard = 0;
    while (Math.abs(x - m.xe) > 0.1 * Math.abs(m.xe) && guard < 200000) {
      var dx = deriv(x, 0)[0], h = Math.min(0.002 * Math.abs(m.xe) / (Math.abs(dx) + 1e-30), 0.3 / stiffness(x));
      var k1 = dx, k2 = deriv(x + h * k1 / 2, 0)[0], k3 = deriv(x + h * k2 / 2, 0)[0], k4 = deriv(x + h * k3, 0)[0];
      x += h * (k1 + 2 * k2 + 2 * k3 + k4) / 6; t += h; guard++;
    }
    m.g0 = t / SETTLE_S;
  }
  function now() { return at(m.x); }
  function endState() { var c = at(m.xe); return { A: c.A, X: c.X, N: c.N, y: c.N + c.A > 0 ? m.P * c.A / (c.A + c.N) : 0 }; }
  function countOf(y) { return CPM_PER_DOT * y / UNIT; }
  function clockRate() {
    if (!m.near && Math.abs(m.x - m.xe) <= 0.1 * Math.abs(m.xe)) { m.near = true; m.nearW = st.w; }
    if (!m.near) return m.g0;
    return m.g0 + (1 - m.g0) * Math.min(1, (st.w - (m.nearW || 0)) / 1.0);
  }

  // ===========================================================================
  // Formatting (3 significant figures, rounded half up; no carets)
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function sci(v) {
    if (!(v > 0)) return null;
    var e = Math.floor(Math.log10(v)), mant = v / Math.pow(10, e), r = Math.round(mant * 100 + 1e-7) / 100;
    if (r >= 10) { r = r / 10; e += 1; }
    return { m: r.toFixed(2), e: e };
  }
  function fmtSci(v) { var s = sci(v); if (!s) return '0'; return s.m + ' × 10' + String(s.e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function sayNum(v) { var s = sci(v); if (!s) return 'zero'; return s.m + ' times 10 to the ' + (s.e < 0 ? 'minus ' + (-s.e) : s.e); }
  function fmtM(v) { return fmtSci(v) + ' M'; }
  function fmtCount(v) { if (v < 0.5) return '0'; var s = sci(v); return String(Math.round(Number(s.m) * Math.pow(10, s.e))); }
  function sayK() { return S.Kshow.split(' ×')[0] + ' times 10 to the minus ' + (-Math.floor(Math.log10(S.K))); }

  // ===========================================================================
  // State
  // ===========================================================================
  var st;
  function initState() {
    m = null;
    st = { nStart: 0, running: false, w: 0, lastInput: 0, pellet: false, added: false, started: false, steady: null, dropT: 0, pourT: 0,
           dots: [], sprites: [], cols: null, accD: 0, accS: 0 };
    setOrigin(start0.Ag, start0.X, start0.solid ? SOLID_CELLS * UNIT : 0);
    st.nStart = m.N0 / UNIT;
    layoutDirty = true;
  }

  // ===========================================================================
  // The drawing inside the beaker: dots in the water, cells in the solid.
  // Counts follow the model: dots = concentration / UNIT (capped), cells = solid / UNIT.
  // ===========================================================================
  var layoutDirty = true, PW = { x: 0, y: 0, w: 0, h: 0 }, CELL = 9;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function nCols() { return Math.max(8, Math.floor(PW.w / CELL)); }
  function cellCount() { var n = 0; st.cols.forEach(function (c) { n += c.length; }); return n; }
  function markedCells() { var n = 0; st.cols.forEach(function (c) { c.forEach(function (k) { if (k) n++; }); }); return n; }
  function maxCells() { return nCols() * MAX_ROWS; }
  function topY(col) { return PW.h - st.cols[col].length * CELL; }
  function waterBottom() { var hi = 0; st.cols.forEach(function (c) { hi = Math.max(hi, c.length); }); return PW.h - hi * CELL - 6; }
  function addDot(kind, marked, x, y, up) { st.dots.push({ k: kind, mk: !!marked, x: x, y: y, vx: rnd(-24, 24), vy: up ? rnd(-40, -20) : rnd(-24, 24) }); }
  function countDots(kind, mk) { var n = 0; st.dots.forEach(function (d) { if (d.k === kind && (mk === undefined || d.mk === mk)) n++; }); return n; }
  function targets() {
    var c = now(), ts = Math.max(0, m.P - m.y);
    var ag = Math.round(c.A / UNIT), xx = Math.round(c.X / UNIT), cells = Math.round(c.N / UNIT);
    return { ag: Math.min(CAP, ag), agTrue: ag, x: Math.min(CAP, xx), xTrue: xx, mk: Math.round(m.y / UNIT),
             cells: Math.min(maxCells(), cells), cellsTrue: cells, mkCells: Math.round(ts / UNIT) };
  }
  function seed() {
    st.dots = []; st.sprites = [];
    var n = nCols(), t = targets(); st.cols = []; for (var i = 0; i < n; i++) st.cols.push([]);
    var full = Math.floor(t.cells / n), order = []; for (i = 0; i < n; i++) { for (var j = 0; j < full; j++) st.cols[i].push(false); order.push(i); }
    order.sort(function () { return Math.random() - 0.5; }); for (i = 0; i < t.cells - full * n; i++) st.cols[order[i]].push(false);
    var wb = waterBottom();
    for (i = 0; i < t.ag; i++) addDot('Ag', i < Math.min(t.mk, t.ag), rnd(8, PW.w - 8), rnd(8, Math.max(10, wb)));
    for (i = 0; i < t.x; i++) addDot('X', false, rnd(8, PW.w - 8), rnd(8, Math.max(10, wb)));
    reconcile(true);
    layoutDirty = false;
  }
  // a site on the surface: the lower (or higher) of three random columns, so the surface stays rough but level
  function lowestCol() { var n = st.cols.length, best = Math.floor(Math.random() * n); for (var k = 0; k < 2; k++) { var c = Math.floor(Math.random() * n); if (st.cols[c].length < st.cols[best].length) best = c; } return best; }
  function highestCol() { var n = st.cols.length, best = -1; for (var k = 0; k < 6; k++) { var c = Math.floor(Math.random() * n); if (st.cols[c].length && (best < 0 || st.cols[c].length > st.cols[best].length || k < 3 && best >= 0 && st.cols[best].length === st.cols[c].length)) best = c; if (k >= 2 && best >= 0) break; } if (best < 0) { st.cols.forEach(function (c, i) { if (c.length && (best < 0 || c.length > st.cols[best].length)) best = i; }); } return Math.max(0, best); }
  function reconcile(exact) {
    var t = targets(), tol = exact ? 0 : 1, wb = waterBottom();
    // cells: exact
    var guard = 0;
    while (cellCount() < t.cells && guard++ < 500) st.cols[lowestCol()].push(false);
    while (cellCount() > t.cells && guard++ < 1000) { var hc = highestCol(); var col = st.cols[hc]; var j = col.lastIndexOf(false); if (j < 0) j = col.length - 1; col.splice(j, 1); }
    var mc = markedCells(); guard = 0;
    while (mc < Math.min(t.mkCells, cellCount()) && guard++ < 500) { var ci = Math.floor(Math.random() * st.cols.length), cc = st.cols[ci], u = cc.lastIndexOf(false); if (u >= 0) { cc[u] = true; mc++; } }
    while (mc > t.mkCells && guard++ < 1000) { var cj = Math.floor(Math.random() * st.cols.length), cd = st.cols[cj], v = cd.indexOf(true); if (v >= 0) { cd[v] = false; mc--; } }
    // dots: within one of the target, so the events stay visible
    ['Ag', 'X'].forEach(function (kind) {
      var want = kind === 'Ag' ? t.ag : t.x, g2 = 0;
      while (countDots(kind) < want - tol && g2++ < 200) {
        var fromTop = kind === 'X' && st.pourT > 0;
        addDot(kind, false, rnd(8, PW.w - 8), fromTop ? rnd(4, 18) : rnd(8, Math.max(10, wb)));
      }
      while (countDots(kind) > want + tol && g2++ < 400) {
        var mkNow = countDots('Ag', true), pickMarked = kind === 'Ag' && mkNow > t.mk;
        var idx = -1; for (var i = st.dots.length - 1; i >= 0; i--) if (st.dots[i].k === kind && (kind === 'X' || st.dots[i].mk === pickMarked)) { idx = i; break; }
        if (idx < 0) for (i = st.dots.length - 1; i >= 0; i--) if (st.dots[i].k === kind) { idx = i; break; }
        st.dots.splice(idx, 1);
      }
    });

    if (isReduced()) { jumpToEnd(); st.running = false; st.steady = true; render(); return; }
    if (st.steady === null) st.steady = shown().concSteady && shown().cntSteady;
    if (!st.running) { st.running = true; lastT = performance.now(); }
    schedule(); render();
  }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(); render(); say('Reset to the starting state, paused. ' + readoutWords()); });
  el('pellet').addEventListener('click', function () {
    if (st.pellet || now().N <= EPS) return;
    st.pellet = true; st.dropT = 0; m.P = PELLET_CELLS * UNIT; m.N0 += PELLET_CELLS * UNIT; st.steady = false;
    if (st.cols && !layoutDirty) {   // the pellet lands on the solid as a lump of marked cells
      var n = nCols(), mid = Math.floor(n * 0.62);
      for (var i = 0; i < PELLET_CELLS; i++) st.cols[Math.min(n - 1, Math.max(0, mid - 5 + (i % 10)))].push(true);
    }
    start(); say('The radioactive pellet dropped onto the solid. ' + readoutWords());
  });
  el('add').addEventListener('click', function () {
    if (st.added) return;
    var c = now(); st.added = true; st.pourT = 1.5; st.steady = false;
    setOrigin(c.A, c.X + S.add, c.N);
    start(); say(cap1(S.sodium) + ' added: ' + S.Xword + ' up by ' + sayNum(S.add) + ' molar. ' + readoutWords());
  });

  // ===========================================================================
  // Start: the problem's own beaker, paused at time zero.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  el('title').textContent = cap1(S.name) + ': ' + saltKey + '(s) ⇌ Ag⁺(aq) + ' + S.X + '(aq), 25 °C';
  el('lX').textContent = '[' + S.X + ']';
  el('add').textContent = 'Add ' + S.sodium;
  initState();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) { stop(); jumpToEnd(); } render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  render();
})();
</script>
</body>
</html>
