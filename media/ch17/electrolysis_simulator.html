    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(bathName(x), bx + 4, sy + 2 > by + bh - 12 ? by : by + bh - 12);
    // progress through the set time
    ctx.fillStyle = C('grid'); ctx.fillRect(bx, H - 6, bw, 3); ctx.fillStyle = C('focus'); ctx.fillRect(bx, H - 6, bw * prog, 3);
  }

  // ===========================================================================
  // b. Close-up of the cathode surface: each ion that lands takes n electrons (n small e⁻ marks)
  // ===========================================================================
  var panelCv = el('panel'), landers = [], lattice = 6;
  function newLander() { return { x: rand() * 0.6, y: 0.15 + rand() * 0.7, stage: 0, e: 0 }; }
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, x = X(), surf = W - 70, molten = x.bath === 'molten';
    ctx.font = '600 10px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('b. At the cathode surface: a simulated sketch, not to scale', 4, 3);
    ctx.fillStyle = molten ? C('molten') : C('water'); ctx.fillRect(4, 16, surf + 18, H - 20); if (x.col) { ctx.globalAlpha = 0.3; ctx.fillStyle = x.col; ctx.fillRect(4, 16, surf + 18, H - 20); ctx.globalAlpha = 1; }
    ctx.fillStyle = C('cathode'); ctx.fillRect(surf + 22, 16, W - surf - 26, H - 20);
    var cols = 3, rows = 6, cell = (H - 20) / rows;   // the metal laid down so far, in a lattice beside the cathode
    var filled = Math.min(cols * rows, lattice);
    for (var k = 0; k < cols * rows; k++) { var c = Math.floor(k / rows), r = k % rows, px = surf + 18 - c * cell * 0.9, py = 16 + cell / 2 + r * cell; if (k < filled) { ctx.beginPath(); ctx.arc(px, py, cell * 0.38, 0, 6.283); ctx.fillStyle = x.metal; ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 0.7; ctx.stroke(); } }
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(4.5, 16.5, W - 9, H - 21);
    landers.forEach(function (p) {
      var px = 10 + p.x * (surf - 40), py = 16 + p.y * (H - 20);
      ctx.beginPath(); ctx.arc(px, py, 6, 0, 6.283); ctx.fillStyle = x.col || C('muted'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = C('fg'); ctx.font = '700 8px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(x.n > 1 ? x.n + '+' : '+', px, py);
      for (var j = 0; j < p.e; j++) { var ang = -Math.PI / 2 + j * 2 * Math.PI / x.n, ex = px + Math.cos(ang) * 10, ey = py + Math.sin(ang) * 10; drawE(ctx, ex, ey, 3.0); }
    });
    ctx.fillStyle = C('muted'); ctx.font = '9px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(x.ion + ' + ' + x.n + ' e⁻ → ' + x.id + '(' + (molten && x.id === 'Na' ? 'l' : x.id === 'Al' ? 'l' : 's') + ')', 10, H - 6);
  }
  function stepPanel(dt) {
    var x = X(); if (landers.length < 3 && rand() < dt * 2) landers.push(newLander());
    landers.forEach(function (p) {
      if (p.stage === 0) { p.x += dt * 0.35; if (p.x >= 1) { p.x = 1; p.stage = 1; p.clock = 0; } }
      else if (p.stage === 1) { p.clock += dt; if (p.clock > 0.25) { p.clock = 0; p.e += 1; if (p.e >= x.n) { p.stage = 2; p.clock = 0; } } }
      else { p.clock += dt; if (p.clock > 0.35) { p.done = true; lattice += 1; } }
    });
    landers = landers.filter(function (p) { return !p.done; });
    if (lattice > 18) lattice = 18;
  }

  // ===========================================================================
  // Controls: current on a log slider, 0.10 to 100 A, arrows a tenth of a power of ten; the smelter box gives 1.00 × 10⁵ A
  // ===========================================================================
  function posFromI(v) { return Math.max(-100, Math.min(200, Math.round(Math.log10(v) * 100))); }
  function IFromPos(p) { var v = Math.pow(10, p / 100), e = Math.floor(Math.log10(v)); return Math.round(v / Math.pow(10, e - 2)) * Math.pow(10, e - 2); }
  function unitSec(u) { return u === 'h' ? 3600 : u === 'min' ? 60 : 1; }

  // ===========================================================================
  // Text
  // ===========================================================================
  function readout() { var T = totals(); return 'Current ' + sig(st.I, 4) + ' A for ' + sig(T.t, 4) + ' s: ' + massText(T.g) + ' of ' + X().id + '.'; }
  function updateText() {
    var x = X(), T = totals(), smelt = st.I === ISMELT;
    setText('rI', sig(st.I, 4) + ' A'); setText('rTs', sig(T.t, 4) + ' s'); setText('rTh', sig(T.t / 3600, 4) + ' h');
    setText('rQ', sig(T.Q, 4) + ' C'); setText('rE', sig(T.ne, 4)); setText('rM', sig(T.nm, 4)); setText('rG', massText(T.g));
    var s = el('I'), p = String(posFromI(Math.min(st.I, IMAX))); if (s.value !== p) s.value = p; setDisabled('I', smelt);
    setText('vI', smelt ? '1.00 × 10⁵ A' : sig(st.I, 4) + ' A'); setAttr(s, 'aria-valuetext', spoken(sig(st.I, 4) + ' A'));
    if (el('smelter').checked !== smelt) el('smelter').checked = smelt;
    if (el('ion').value !== st.ion) el('ion').value = st.ion; if (el('mode').value !== st.mode) el('mode').value = st.mode;
    setHidden('timeBox', st.mode !== 'mass'); setHidden('massBox', st.mode !== 'time');
    var tv = String(Number((st.t / unitSec(st.unit)).toPrecision(6))); if (document.activeElement !== el('tnum') && el('tnum').value !== tv) el('tnum').value = tv;
    if (el('tunit').value !== st.unit) el('tunit').value = st.unit;
    var mv = String(st.m); if (document.activeElement !== el('mnum') && el('mnum').value !== mv) el('mnum').value = mv;
    var out = x.ion + ' (' + bathName(x) + ') at ' + sig(st.I, 4) + ' A for ' + sig(T.t, 4) + ' s. ' + (st.running ? 'Plating; ' + Math.round(st.prog * 100) + '% of the time has passed.' : 'Readings are steady.');
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused. Press Play to watch.';
    setText('status', out);
    setText('play', st.running ? 'Pause' : 'Play');
    setText('caption', 'a. Not to scale. The supply pushes electrons (e⁻, open circles) into the cathode and draws them from the anode; ' + (x.id === 'Na' ? 'Cl⁻ gives up electrons at a graphite anode as Cl₂.' : x.id === 'Al' ? 'oxide ions give up electrons at a carbon anode, which burns to CO₂.' : 'the ' + x.id + ' anode dissolves as the cathode plates, so the bath stays the same.') + ' The bar shows the set time passing; 100% current efficiency.');
    setText('caption2', 'b. Each ' + x.ion + ' that lands takes ' + x.n + ' electron' + (x.n > 1 ? 's' : '') + ' (e⁻, open circles) and joins the metal.');
    setText('quick', 'Quick start: press Play, pick an ion, set the current, and type a time or a mass.');
    setText('descScene', spoken(x.ion + ' in ' + bathName(x) + '. Power supply: electrons drawn leaving the ' + anodeName(x) + ' toward the + terminal and entering the steel cathode from the − terminal. The cathode carries a ' + (st.prog > 0 ? 'thicker' : 'thin') + ' layer of ' + x.id + '. ' + readout()));
    setText('descPanel', 'Close-up of the cathode surface: ' + x.ion + ' ions arrive one at a time; each takes ' + x.n + ' electron' + (x.n > 1 ? 's' : '') + ' and joins the metal lattice.');
  }

  // ===========================================================================
  // Loop
  // ===========================================================================
  var rafId = null, lastT = 0;
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(t) {
    rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
    st.prog = Math.min(1, st.prog + dt / RUN_S); phase += dt;
    for (var i = 0; i < wireU.length; i++) wireU[i] = (wireU[i] + dt * 0.25) % 1;
    bathIons.forEach(function (p) { p.u += dt * 0.12 * p.s; if (p.u > 1) { p.u = 0; p.v = rand(); } });
    if (X().bath === 'molten' && rand() < dt * 3) bubbles.push({ y: BOX ? BOX.y + BOX.h - 8 : 120, dx: (rand() - 0.5) * 12 });
    bubbles.forEach(function (b) { b.y -= dt * 30; }); bubbles = bubbles.filter(function (b) { return BOX && b.y > BOX.y; });
    stepPanel(dt); render();
    if (st.prog >= 1) { st.running = false; render(); say('The set time has passed. ' + readout()); return; }
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); return; }
    schedule();
  }
  function schedule() { if (st.running && !rafId) { if (isReduced()) { st.prog = 1; lattice = 18; st.running = false; render(); } else rafId = requestAnimationFrame(frame); } }
  function start() { st.lastInput = performance.now(); st.started = true; if (st.prog >= 1) { st.prog = 0; seedPanel(); } if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } render(); }

  var restTimer = null;
  function changed(msg) { st.lastInput = performance.now(); st.prog = 0; seedPanel(); render(); if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500); }
  IONS.forEach(function (x) { var o = document.createElement('option'); o.value = x.id; o.textContent = x.ion + ' → ' + x.id + (x.bath === 'molten' ? ' (' + bathName(x) + ')' : ''); el('ion').appendChild(o); });
  el('ion').addEventListener('change', function () { st.ion = el('ion').value; seedBath(); changed('Now plating ' + X().id + '.'); });
  el('mode').addEventListener('change', function () { st.mode = el('mode').value; changed(st.mode === 'time' ? 'Finding the time needed.' : 'Finding the mass.'); });
  el('tnum').addEventListener('change', function () { var v = parseFloat(el('tnum').value); if (isFinite(v) && v > 0) st.t = v * unitSec(st.unit); changed(''); });
  el('tunit').addEventListener('change', function () { st.unit = el('tunit').value; render(); });
  el('mnum').addEventListener('change', function () { var v = parseFloat(el('mnum').value); if (isFinite(v) && v > 0) st.m = v; changed(''); });
  el('I').addEventListener('input', function () { st.I = IFromPos(parseInt(el('I').value, 10)); changed(''); });
  el('I').addEventListener('keydown', function (e) {
    var p = posFromI(st.I), ok = true;
    switch (e.key) { case 'ArrowRight': case 'ArrowUp': p += 10; break; case 'ArrowLeft': case 'ArrowDown': p -= 10; break; case 'PageUp': p += 100; break; case 'PageDown': p -= 100; break; case 'Home': p = -100; break; case 'End': p = 200; break; default: ok = false; }
    if (ok) { e.preventDefault(); st.I = IFromPos(Math.max(-100, Math.min(200, p))); changed(''); }
  });
  el('smelter').addEventListener('change', function () { st.I = el('smelter').checked ? ISMELT : 10.0; changed(el('smelter').checked ? 'Smelter current, 1.00 × 10⁵ A.' : 'Current 10.0 A.'); });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });

  // ===========================================================================
  // Start: paused
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  seedBath();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
