    with more ions per formula unit; ΔTf = i × Kf × (mol salt ÷ kg water), Tf = 0 − ΔTf. No words that assume when the page
    opens or what came before; no answer to the instrument task.
  Data source: the brief's table only (OpenStax Chemistry 2e, Table 11.2 and Appendix E for Kf = 1.86 °C·kg/mol; Appendix A

    assumes. Any Kf or i the tutor passes is ignored.

  Model: n = salt_g ÷ M; molality = n ÷ water_kg (mol/kg); ΔTf = i × 1.86 × molality (°C); Tf = 0 − ΔTf (°C).

  URL parameters:
    salt       NaCl | KCl | CaCl2 | MgCl2. Default NaCl. Unrecognised or placeholder: NaCl, with a notice.
    salt_g     g, the problem's salt; the slider starts here. 0 to 600. Default 265 (RS1).
    water_kg   kg, the problem's meltwater. 0.50 to 2.50. Default 1.50 (RS1).
    T_student  °C, signed, optional: the student's freezing point, marked at the problem's grams.
    pred       rises | falls | unchanged, optional: the student's prediction for twice the salt, a short arrow from that point.
    theme      light | dark. Default: the system setting.
  Controls (ids fixed; the tutor's telemetry reads them):
    salt_select  menu: NaCl, KCl, CaCl2, MgCl2; starts at salt.
    salt_g       slider: 0 to 600 g, step 1 g; starts at salt_g.
    water_kg     slider: 0.50 to 2.50 kg, step 0.05 kg; starts at water_kg.
    view_toggle  menu: graph, surface; starts at graph.
  Readings (ids fixed):
    m_readout  mol/kg; i_readout (2 or 3); dT_readout °C (positive); Tf_readout °C (signed);

    MgCl2 −33.6 °C, CaCl2 −50.0 °C. The selected salt's limit is a dashed floor ("brine limit"), and its ideal line is dashed

    salt and water and are drawn faint when the menu or the water slider differs from them. View b is drawn at the freezing
    point of pure water: the leaving rate is fixed, the joining rate is drawn in proportion to the fraction of water among the

<body>
  <h1 id="title">Freezing point of a salt solution</h1>
  <p class="notice" id="notice" role="status" hidden></p>

  <div class="top">

        <tr><td>i</td><td class="v" id="i_readout"></td><td class="gap"></td><td>ΔT<sub>f</sub></td><td class="v" id="dT_readout"></td></tr>
        <tr><td colspan="3"></td><td>At twice the problem’s salt</td><td class="v" id="Tf_twice_salt_marker"></td></tr>
      </table>
    </div>
  </div>
  <p class="status" id="status"></p>

  <div class="row">

    <label for="view_toggle" class="lab">View</label>

    <label for="salt_select" class="lab">Salt</label>

  </div>
  <div class="sl"><label for="salt_g">Salt</label><input type="range" id="salt_g" min="0" max="600" step="1"><span class="val" id="vg" aria-hidden="true"></span></div>
  <div class="sl"><label for="water_kg">Water</label><input type="range" id="water_kg" min="0.5" max="2.5" step="0.05"><span class="val" id="vw" aria-hidden="true"></span></div>
  <p class="small" id="caption"></p>
  <p class="small" id="quick"></p>

  <div class="sr-only" id="descView"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table only. M in g/mol; i ideal; ions per formula unit.
  // ===========================================================================
  var SALTS = {
    NaCl: { label: 'NaCl', M: 58.44, i: 2, cation: 'Na⁺', cq: 1, anions: 1 },
    KCl: { label: 'KCl', M: 74.55, i: 2, cation: 'K⁺', cq: 1, anions: 1 },
    CaCl2: { label: 'CaCl₂', M: 110.98, i: 3, cation: 'Ca²⁺', cq: 2, anions: 2 },
    MgCl2: { label: 'MgCl₂', M: 95.21, i: 3, cation: 'Mg²⁺', cq: 2, anions: 2 }
  };
  var ORDER = ['NaCl', 'KCl', 'CaCl2', 'MgCl2'];
  // The lowest temperature each real brine stays liquid (eutectic, °C), supplied by the instructor 21 Oct 2026. Drawing only:
  // a dashed floor on the graph; the readouts stay the ideal values the brief asks for.
  var LIMIT = { KCl: -10.7, NaCl: -21.1, MgCl2: -33.6, CaCl2: -50.0 };
  var KF = 1.86, GMAX = 600, WMIN = 0.5, WMAX = 2.5;
  var WATER_MOL_PER_KG = 1000 / 18.02;   // confirmed by the instructor 21 Oct 2026; drawing only (view b bar lengths)
  var IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  function isPlaceholder(v) { return /^\{.*\}$/.test(v || ''); }
  function numParam(key, def, lo, hi, what) {
    if (!params.has(key)) return def; var raw = params.get(key), v = parseFloat(raw);
    if (!isFinite(v)) { notices.push(isPlaceholder(raw) ? 'No ' + what + ' given; using ' + def + '.' : 'Could not read ' + what + '; using ' + def + '.'); return def; }
    if (v < lo || v > hi) { var c = v < lo ? lo : hi; notices.push(what.charAt(0).toUpperCase() + what.slice(1) + ' ' + raw.slice(0, 10) + ' is outside ' + lo + ' to ' + hi + '; using ' + c + '.'); return c; }
    return v;
  }
  var saltId = (params.get('salt') || '').trim();
  if (!saltId) saltId = 'NaCl'; else if (!SALTS[saltId]) { notices.push(isPlaceholder(saltId) ? 'No salt given; showing NaCl.' : 'No data for “' + saltId.slice(0, 16) + '”; showing NaCl.'); saltId = 'NaCl'; }
  var g0 = numParam('salt_g', 265, 0, GMAX, 'salt mass (g)');
  var w0 = numParam('water_kg', 1.50, WMIN, WMAX, 'water mass (kg)');
  var wSnap = Math.round(w0 / 0.05) * 0.05; if (Math.abs(wSnap - w0) > 1e-9) { notices.push('Water rounded to the slider’s 0.05 kg step: ' + wSnap.toFixed(2) + ' kg.'); w0 = Math.round(wSnap * 100) / 100; }
  var Tstu = null; if (params.has('T_student')) { var ts = parseFloat(params.get('T_student')); if (isFinite(ts)) Tstu = ts; else if (!isPlaceholder(params.get('T_student'))) notices.push('Could not read the student’s freezing point; no mark drawn.'); }
  var pred = (params.get('pred') || '').trim().toLowerCase(); if (['rises', 'falls', 'unchanged'].indexOf(pred) < 0) { if (pred && !isPlaceholder(pred)) notices.push('Could not read the prediction; no arrow drawn.'); pred = null; }
  // the problem (the reveal is drawn for it); the state the student changes
  var P = { salt: saltId, g: g0, w: w0 };
  var st = { salt: saltId, g: g0, w: w0, prevSalt: null, view: 'graph', running: false, started: false, lastInput: 0 };
  var notice = document.getElementById('notice'); if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }
  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // The model
  // ===========================================================================
  function molality(salt, g, w) { return g / SALTS[salt].M / w; }
  function Tf(salt, g, w) { return 0 - SALTS[salt].i * KF * molality(salt, g, w); }
  function sig3(x) { if (x === 0) return '0'; var d = Math.max(0, 2 - Math.floor(Math.log10(Math.abs(x)) + 1e-12)); return x.toFixed(d); }
  function one(x) { var s = x.toFixed(1); if (s === '-0.0') s = '0.0'; return s.replace('-', '−'); }
  function oneNum(x) { var v = Math.round(x * 10) / 10; return v === 0 ? 0 : v; }   // the number a reading message carries: what the page displays

  // ===========================================================================
  // Helpers (labels and attributes written only when they change: the Safari fix)
  // ===========================================================================
  var el = function (id) { return document.getElementById(id); };
  function setText(id, t) { var e = el(id); if (e.textContent !== t) e.textContent = t; }
  function setAttr(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setDisabled(id, d) { var e = el(id); if (e.disabled !== d) e.disabled = d; }
  var live = el('live'); function say(m) { live.textContent = ''; setTimeout(function () { live.textContent = m.replace(/−/g, 'minus '); }, 30); }
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  function C(n) { if (!colours) colours = {}; if (!(n in colours)) colours[n] = getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); return colours[n]; }
  function sizeCanvas(cv, bg) {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = Math.max(2, Math.ceil((window.devicePixelRatio || 1) * 2) / 2); if (!w || !h) return null;   // at least 2×: sharp when zoomed
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = bg || C('bg'); ctx.fillRect(0, 0, w, h); return { ctx: ctx, W: w, H: h };
  }

  // ===========================================================================
  // Messages to the tutor (34_CONTRACT v1): one way, never read, never waited on
  // ===========================================================================
  function post(msg) { try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* opened alone: nothing to do */ } }
  var UNIT = { salt_select: '', salt_g: 'g', water_kg: 'kg', view_toggle: '' };
  var track = {}, readTimer = null;
  function valueOf(id) { return id === 'salt_select' ? st.salt : id === 'salt_g' ? st.g : id === 'water_kg' ? st.w : st.view; }
  function touch(id, before) {   // a control moved: start or extend its interaction
    var v = valueOf(id), k = track[id];
    if (!k) { k = track[id] = { start: before, min: before, max: before, moves: 0, t0: performance.now(), timer: null }; }
    k.moves++; if (typeof v === 'number') { k.min = Math.min(k.min, v); k.max = Math.max(k.max, v); }
    if (k.timer) clearTimeout(k.timer); k.timer = setTimeout(function () { rest(id); }, 600);
    if (readTimer) { clearTimeout(readTimer); readTimer = null; }
  }
  function postChoice(id, choice, previous) { post({ type: 'sim', v: 1, kind: 'control', id: id, choice: choice, previous: previous }); }   // a menu or view: its choice by name
  function rest(id) {   // the control came to rest: one "control" message; for salt_g and water_kg, a reading after 1 s more
    var k = track[id]; if (!k) return; if (k.timer) clearTimeout(k.timer); delete track[id];
    var end = valueOf(id), msg = { type: 'sim', v: 1, kind: 'control', id: id, start: k.start, end: end, moves: k.moves, seconds: Math.round((performance.now() - k.t0) / 100) / 10, unit: UNIT[id] };
    if (typeof end === 'number') { msg.min = k.min; msg.max = k.max; }
    post(msg);
    if (id === 'salt_g' || id === 'water_kg') {
      if (readTimer) clearTimeout(readTimer);
      readTimer = setTimeout(function () { readTimer = null; post({ type: 'sim', v: 1, kind: 'reading', id: 'Tf_readout', value: oneNum(Tf(st.salt, st.g, st.w)), unit: '°C', at: { salt_select: st.salt, salt_g: st.g, water_kg: st.w } }); }, 1000);
    }
  }

  // ===========================================================================
  // a. The graph
  // ===========================================================================
  var viewCv = el('view'), XMAX = Math.min(700, Math.max(GMAX, Math.ceil(2 * P.g / 100) * 100)), YMIN = -30;
  function drawGraph() {
    var cv = sizeCanvas(viewCv, C('win-bg')); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, px0 = 42, px1 = W - 12, py0 = 36, py1 = H - 32;
    var X = function (g) { return px0 + g / XMAX * (px1 - px0); }, Y = function (t) { return py0 + Math.min(1, Math.max(0, t / YMIN)) * (py1 - py0); };
    ctx.font = '600 11px ' + FONT; ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('a. Freezing point (°C) against grams of salt', 6, 4);
    ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(px0 + 0.5, py0 + 0.5, px1 - px0, py1 - py0);
    ctx.font = '10.5px ' + FONT; ctx.fillStyle = C('muted');
    [0, -10, -20, -30].forEach(function (t) { var y = Math.round(Y(t)) + 0.5; ctx.strokeStyle = C('grid'); ctx.beginPath(); ctx.moveTo(px0, y); ctx.lineTo(px1, y); ctx.stroke(); ctx.fillStyle = C('fg'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(t === 0 ? '0' : '−' + Math.abs(t), px0 - 4, Y(t)); });
    for (var g = 0; g <= XMAX; g += 100) { var x = Math.round(X(g)) + 0.5; ctx.strokeStyle = C('rule'); ctx.beginPath(); ctx.moveTo(x, py1); ctx.lineTo(x, py1 + 3); ctx.stroke(); ctx.fillStyle = C('fg'); ctx.textAlign = g === XMAX ? 'right' : 'center'; ctx.textBaseline = 'top'; ctx.fillText(String(g), X(g) + (g === XMAX ? 2 : 0), py1 + 4); }
    ctx.textAlign = 'center'; ctx.fillText('salt, g', (px0 + px1) / 2, py1 + 16);
    function gAt(salt, t, w) { return -t / (SALTS[salt].i * KF) * SALTS[salt].M * w; }   // grams where the ideal line reaches t
    function line(salt, w, colour, width) {   // the straight line, clipped at −30 °C; dashed below the salt's brine limit
      var gEnd = Math.min(XMAX, gAt(salt, YMIN, w)), gL = Math.min(gEnd, gAt(salt, LIMIT[salt], w));
      ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(gL), Y(Tf(salt, gL, w))); ctx.stroke();
      if (gL < gEnd) { ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(gL), Y(Tf(salt, gL, w))); ctx.lineTo(X(gEnd), Y(Tf(salt, gEnd, w))); ctx.stroke(); ctx.setLineDash([]); }
      return gEnd;
    }
    var lim = LIMIT[st.salt];
    ctx.font = '10.5px ' + FONT;
    if (lim >= YMIN) {   // the brine limit: a dashed floor across the plot
      ctx.strokeStyle = C('limit'); ctx.lineWidth = 1.6; ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(px0, Math.round(Y(lim)) + 0.5); ctx.lineTo(px1, Math.round(Y(lim)) + 0.5); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('brine limit, ' + SALTS[st.salt].label + ': ' + one(lim) + ' °C', px0 + 6, Y(lim) + 4);   // under the floor at the left, where the line is far above
    } else { ctx.fillStyle = C('fg'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('brine limit, ' + SALTS[st.salt].label + ': ' + one(lim) + ' °C (below the plot)', px1 - 4, py1 - 3); }
    function nameLine(salt, colour) {   // the salt's name under its line, near its start
      var ge = Math.min(XMAX, -YMIN / (SALTS[salt].i * KF) * SALTS[salt].M * st.w), gx = Math.max(ge * 0.14, XMAX * 0.08);
      ctx.fillStyle = colour; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText(SALTS[salt].label, X(gx) - 4, Y(Tf(salt, gx, st.w)) + 6);
    }
    if (st.prevSalt && st.prevSalt !== st.salt) { line(st.prevSalt, st.w, C('faint'), 1.6); nameLine(st.prevSalt, C('muted')); }
    line(st.salt, st.w, C('curve'), 2); nameLine(st.salt, C('fg'));
    // pure water
    ctx.beginPath(); ctx.arc(X(0), Y(0), 4, 0, 6.283); ctx.fillStyle = C('bg'); ctx.fill(); ctx.strokeStyle = C('fg'); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('pure water, 0 °C', X(0) + 7, Y(0) - 4);
    // the reveal marks, for the problem's salt and water; faint when the menu or the water slider differs

      ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('prediction', ex + 4, ey + (dy > 0 ? 6 : dy < 0 ? -6 : 0));

  // ===========================================================================
  // b. The ice surface, at the freezing point of pure water

  function drawIon(ctx, x, y, kind) {

  // ===========================================================================
