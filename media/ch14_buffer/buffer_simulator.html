<title>Buffers</title>
<!--
  DRAFT: not for students until the instructor approves it.
  Date: 17 Oct 2026. Built by Simulation_Claude to 00_README_BRIEF_buffer.md (SCENARIO_CLAUDE, 17 Oct 2026), from
    weak_acid_base_simulator.html (444fc0c5): its layout, meters, scale, menu, keyboard steps, captions, themes,
    accessibility and the Safari fix (labels are written only when they change).
  Brief (one line): ch14_buffer, every buffer scenario (first: "The Stubborn Beaker"), opens at the meaning question: a buffer
    holds a weak acid and its conjugate base; added strong acid or base is consumed by one partner, so only their ratio changes
    and the pH moves little until a partner runs out; pure water beside it gets the same additions. No sentence states which
    way an addition moves the pH, or why.
  Data source: the brief's table (instructor, 17 Oct 2026): Ka at 25 °C, OpenStax Appendix H (acetic 1.8 × 10^-5,
    formic 1.8 × 10^-4, hypochlorous 2.9 × 10^-8, nitrous 4.6 × 10^-4); Kw = 1.0 × 10^-14 (OpenStax 14.1).
    Added 17 Oct by change brief (instructor): blood, H2CO3/HCO3-, pKa 6.1 at body temperature (OpenStax 14.6);
    phosphate, H2PO4-/HPO4 2-, Ka 6.2 × 10^-8 (Appendix H); ammonium, NH4+/NH3, Ka = Kw ÷ Kb with Kb 1.8 × 10^-5
    (Appendix I; OpenStax 14.3). In the charge balance [Na+] is read as (base partner + NaOH added) ÷ volume and
    [Cl-] as HCl added ÷ volume, exact for all seven. A titrant strength choice, 1.0 M or 0.10 M (0.10 M for blood).
    The pH of every state solves the charge balance h + [Na+] = Ka C / (Ka + h) + Kw / h + [Cl-] by bisection on the pH;
    pure water is the same with C = 0 and no salt. The total volume includes every addition.
    Display choices: additions of 1.0 M NaOH and 1.0 M HCl in 1.0 mL steps; one drop = 0.050 mL of 2.0 M HCl;
    default acetic, ca 0.10 M, cb 0.10 M, V 1.00 L (problem B1).
  URL parameters:
    species  acetic | formic | hypochlorous | nitrous | blood | phosphate | ammonium. Default acetic; unknown values fall
             back with a notice.
    ca, cb   mol/L of the acid partner and the base partner, 0.0010 to 1.0 (0.0010 so blood's 0.0012 fits). Default 0.10 each.
    V        L, 0.050 to 2.0. Default 1.00.
    theme    light | dark. Default: the system setting.
  Cartoon choices (not data): 100 drawn units for acid plus base whatever the amounts; free hydroxide or hydronium drawn on
    the same scale and capped at 40; sodium and chloride ions not drawn; 30 water molecules drawn faintly; a held button
    repeats about 8 times a second after 0.4 s; at most 1000 mL of each reagent; the 2-minute idle stop.
  Nothing is fetched, stored, or sent. Nothing moves until the student presses Play or adds something.
-->

<body>

<script>
(function () {
  'use strict';

  // ===========================================================================
  // DATA: the brief's table (instructor, 17 Oct 2026). Ka at 25 °C from OpenStax Appendix H.
  // ===========================================================================
  var KW = 1.0e-14;   // OpenStax 14.1
  var SPECIES = {
    acetic:       { K: 1.8e-5, show: 'CH₃COOH', base: 'CH₃COO⁻', name: 'acetic acid',       buffer: 'acetate buffer',     salt: 'sodium acetate' },
    formic:       { K: 1.8e-4, show: 'HCOOH',   base: 'HCOO⁻',   name: 'formic acid',       buffer: 'formate buffer',     salt: 'sodium formate' },
    hypochlorous: { K: 2.9e-8, show: 'HClO',    base: 'ClO⁻',    name: 'hypochlorous acid', buffer: 'hypochlorite buffer', salt: 'sodium hypochlorite' },
    nitrous:      { K: 4.6e-4, show: 'HNO₂',    base: 'NO₂⁻',    name: 'nitrous acid',      buffer: 'nitrite buffer',     salt: 'sodium nitrite' },
    // change brief, 17 Oct 2026:
    blood:        { K: Math.pow(10, -6.1), show: 'H₂CO₃', base: 'HCO₃⁻', name: 'carbonic acid', buffer: 'blood buffer', short: 'blood', temp: '37 °C (body temperature)', strength: 0.10 },   // pKa 6.1 at body temperature, OpenStax 14.6
    phosphate:    { K: 6.2e-8, show: 'H₂PO₄⁻', base: 'HPO₄²⁻', name: 'dihydrogen phosphate', buffer: 'phosphate buffer', acidCharge: '−', baseCharge: '2−' },   // Appendix H, second ionization
    ammonium:     { K: 1.0e-14 / 1.8e-5, show: 'NH₄⁺', base: 'NH₃', name: 'ammonium', buffer: 'ammonium buffer', acidCharge: '+', baseCharge: '' }   // Ka = Kw ÷ Kb, Kb from Appendix I
  };
  Object.keys(SPECIES).forEach(function (k) { var z = SPECIES[k]; if (z.acidCharge === undefined) z.acidCharge = ''; if (z.baseCharge === undefined) z.baseCharge = '−';
    if (!z.temp) z.temp = '25 °C'; if (!z.strength) z.strength = 1.0; if (!z.menu) z.menu = z.buffer; if (!z.short) z.short = z.buffer.replace(' buffer', ''); });
  var STRENGTHS = [1.0, 0.10], STEP_ML = 1.0, DROP_ML = 0.050, M_DROP = 2.0;   // display choices (brief)
  var DEFAULT = { species: 'acetic', ca: 0.10, cb: 0.10, V: 1.00 };

  // Cartoon choices:
  var N_UNITS = 100, FREE_CAP = 40, N_WATER = 30, MAX_ML = 1000, REPEAT_DELAY = 400, REPEAT_MS = 120, IDLE_STOP_S = 120;

  // ===========================================================================
  // URL parameters
  // ===========================================================================
  var params = new URLSearchParams(window.location.search), notices = [];
  var key = DEFAULT.species, raw = (params.get('species') || '').trim().toLowerCase();
  if (raw) { if (SPECIES[raw]) key = raw; else notices.push('No data for “' + raw.slice(0, 40) + '”; showing the acetate buffer.'); }
  function rd(name, lo, hi, def) {
    var r = params.get(name); if (r === null || r.trim() === '') return def;
    var v = Number(r); if (isFinite(v) && v >= lo * (1 - 1e-9) && v <= hi * (1 + 1e-9)) return Math.min(Math.max(v, lo), hi);
    notices.push('Could not read ' + name + '; using ' + def.toFixed(2) + (name === 'V' ? ' L.' : ' M.')); return def;
  }
  var start0 = { ca: rd('ca', 0.0010, 1.0, DEFAULT.ca), cb: rd('cb', 0.0010, 1.0, DEFAULT.cb), V: rd('V', 0.050, 2.0, DEFAULT.V) };
  var key0 = key, S = SPECIES[key];
  var notice = document.getElementById('notice');
  if (notices.length) { notice.textContent = notices.join(' '); notice.hidden = false; }

  var themeParam = (params.get('theme') || '').trim().toLowerCase();
  var darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var reduceQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var colours = null;
  function applyTheme() { var t = (themeParam === 'light' || themeParam === 'dark') ? themeParam : (darkQ && darkQ.matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-theme', t); colours = null; }
  function isReduced() { return !!(reduceQ && reduceQ.matches); }

  // ===========================================================================
  // Chemistry. Moles: na0, nb0 at the start; nOH (mol NaOH), nH (mol HCl from both the 1.0 M bottle and the drops).
  // The pH solves the brief's charge balance by bisection; the stoichiometric amounts give the readouts and the drawing.
  // ===========================================================================
  var st;
  // mL added at each strength: OH[0], H[0] at 1.0 M; OH[1], H[1] at 0.10 M
  function vol() { return st.V + (st.mlOH[0] + st.mlOH[1] + st.mlH[0] + st.mlH[1] + st.drops * DROP_ML) / 1000; }
  function nOH() { return (st.mlOH[0] * STRENGTHS[0] + st.mlOH[1] * STRENGTHS[1]) / 1000; }
  function nH() { return (st.mlH[0] * STRENGTHS[0] + st.mlH[1] * STRENGTHS[1]) / 1000 + st.drops * DROP_ML / 1000 * M_DROP; }
  function solvePH(Ka, C, Na, Cl) {   // f(pH) = h + Na − Ka C/(Ka + h) − Kw/h − Cl falls as the pH rises; halve the interval
    var lo = -2, hi = 16;
    for (var i = 0; i < 80; i++) {
      var p = (lo + hi) / 2, h = Math.pow(10, -p);
      var f = h + Na - (C > 0 ? Ka * C / (Ka + h) : 0) - KW / h - Cl;
      if (f > 0) lo = p; else hi = p;
    }
    return (lo + hi) / 2;
  }
  function bufferPH() { var V = vol(); return solvePH(S.K, (st.na0 + st.nb0) / V, (st.nb0 + nOH()) / V, nH() / V); }
  function waterPH() { var V = vol(); return solvePH(S.K, 0, nOH() / V, nH() / V); }
  function amounts() {   // what the student would write: the strong base or acid is consumed by its partner first
    var net = nOH() - nH(), a = st.na0 - net, b = st.nb0 + net, freeOH = 0, freeH = 0;
    if (a < 0) { freeOH = -a; b = st.na0 + st.nb0; a = 0; }
    if (b < 0) { freeH = -b; a = st.na0 + st.nb0; b = 0; }
    return { a: a, b: b, freeOH: freeOH, freeH: freeH };
  }
  function hundredths(x) { return (x < 0 ? -1 : 1) * Math.floor(Math.abs(x) * 100 + 0.5 + 1e-9); }

  // ===========================================================================
  // Formatting: pH to 2 decimals; amounts to 3 significant figures; no carets
  // ===========================================================================
  var SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  function supE(e) { return String(e).split('').map(function (ch) { return SUP[ch]; }).join(''); }
  function fmtN(v, sf) {
    if (!(v > 0)) return '0';
    var e = Math.floor(Math.log10(v)), k = Math.pow(10, sf - 1), r = Math.round(v / Math.pow(10, e) * k + 1e-7) / k; if (r >= 10) { r /= 10; e++; }
    if (e < -3 || e > 3) return r.toFixed(sf - 1) + ' × 10' + supE(e);
    return (r * Math.pow(10, e)).toFixed(Math.max(0, sf - 1 - e));
  }
  function fmt(v) { return fmtN(v, 3); }
  function fmtP(x) { var h = hundredths(x), a = Math.abs(h); return (h < 0 ? '−' : '') + Math.floor(a / 100) + '.' + ('0' + (a % 100)).slice(-2); }
  function fmtML(ml) { return ml.toFixed(1) + ' mL'; }
  function spoken(t) {
    return t.replace(/( × )?10(⁻?)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, function (a, times, minus, d) { return (times ? ' times ' : '') + '10 to the ' + (minus ? 'minus ' : '') + d.split('').map(function (ch) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch); }).join(''); })
      .replace(/−(\d)/g, 'minus $1').replace(/H₃O⁺/g, 'hydronium').replace(/OH⁻/g, 'hydroxide').replace(/(\d) M\b/g, '$1 molar').replace(/(\d) mL\b/g, '$1 milliliters').replace(/(\d) L\b/g, '$1 liters')
      .replace(/CH₃COOH/g, 'acetic acid').replace(/CH₃COO⁻/g, 'acetate').replace(/HCOOH/g, 'formic acid').replace(/HCOO⁻/g, 'formate').replace(/HClO/g, 'hypochlorous acid').replace(/ClO⁻/g, 'hypochlorite')
      .replace(/H₂CO₃/g, 'carbonic acid').replace(/HCO₃⁻/g, 'bicarbonate').replace(/H₂PO₄⁻/g, 'dihydrogen phosphate').replace(/HPO₄²⁻/g, 'hydrogen phosphate').replace(/NH₄⁺/g, 'ammonium').replace(/NH₃/g, 'ammonia').replace(/HNO₂/g, 'nitrous acid').replace(/NO₂⁻/g, 'nitrite').replace(/pKa/g, 'p K a');
  }

  // ===========================================================================
  // The drawing (not to scale): 100 units for acid plus base, split by their mole number; free hydroxide or hydronium on the
  // same scale, capped. An added hydroxide takes a proton from an acid unit; an added hydronium gives one to a base unit.
  // ===========================================================================
  var PW = { w: 0, h: 0 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function P(kind, x, y) { return { k: kind, x: x, y: y, vx: rnd(-20, 20), vy: rnd(-20, 20), a: rnd(0, 6.3) }; }
  function count(k, f) { var n = 0; st.parts.forEach(function (p) { if (p.k === k && (!f || f(p))) n++; }); return n; }
  function targets() {
    var m = amounts(), tot = st.na0 + st.nb0, a = Math.round(N_UNITS * m.a / tot);
    var fo = N_UNITS * m.freeOH / tot, fh = N_UNITS * m.freeH / tot;
    return { a: a, b: N_UNITS - a, freeOH: Math.min(FREE_CAP, Math.round(fo)), freeH: Math.min(FREE_CAP, Math.round(fh)), capped: fo > FREE_CAP + 0.5 || fh > FREE_CAP + 0.5 };
  }
  function seedAll() {
    st.parts = []; st.moves = [];
    for (var i = 0; i < N_WATER; i++) st.parts.push(P('W', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    var t = targets();
    for (i = 0; i < t.a; i++) st.parts.push(P('HA', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    for (i = 0; i < t.b; i++) st.parts.push(P('A', rnd(8, PW.w - 8), rnd(8, PW.h - 8)));
    settleFree(t);
  }
  function settleFree(t) {   // free hydroxide or hydronium: set to the target at once
    ['OH', 'H3O'].forEach(function (k) {
      var want = k === 'OH' ? t.freeOH : t.freeH, have = count(k, function (p) { return p.free; });
      while (have < want) { var q = P(k, rnd(8, PW.w - 8), rnd(8, PW.h - 8)); q.free = true; st.parts.push(q); have++; }
      while (have > want) { var i = st.parts.findIndex(function (p) { return p.k === k && p.free; }); st.parts.splice(i, 1); have--; }
    });
  }
  function convert(toBase, animate) {   // one acid unit becomes base (an added OH- takes its proton), or the reverse
    var from = toBase ? 'HA' : 'A', list = st.parts.filter(function (p) { return p.k === from && !p.busy; }); if (!list.length) return false;
    var u = list[Math.floor(Math.random() * list.length)];
    if (!animate) { u.k = toBase ? 'A' : 'HA'; return true; }
    var t = rnd(0, 6.283), ion = P(toBase ? 'OH' : 'H3O', u.x + 11 * Math.cos(t), u.y + 11 * Math.sin(t)); ion.busy = true; ion.fresh = 0.5; st.parts.push(ion);
    u.busy = true;
    st.moves.push({ from: toBase ? u : ion, to: toBase ? ion : u, t: -0.5, dur: 0.35, after: function () {
      u.k = toBase ? 'A' : 'HA'; u.busy = false; ion.k = 'W'; ion.busy = false; delete ion.fresh;   // the ion becomes water
      if (count('W') > N_WATER + 6) { var i = st.parts.findIndex(function (p) { return p.k === 'W' && p !== ion; }); if (i >= 0) st.parts.splice(i, 1); }
    } });
    return true;
  }
  function pending() { var n = 0; st.moves.forEach(function (mv) { n += mv.to.k === 'OH' || mv.from.k === 'OH' ? 1 : -1; }); return n; }   // acid units on their way to base (minus the reverse)
  function reconcile(animate) {
    var t = targets(), guard = 0;
    if (!animate) {
      st.moves.slice().forEach(function (mv) { mv.after(); }); st.moves = [];
      while (count('HA') > t.a && guard++ < 200) convert(true, false);
      while (count('HA') < t.a && guard++ < 400) convert(false, false);
      settleFree(t); return;
    }
    var aNow = count('HA') - pending();
    if (aNow > t.a && st.moves.length < 6) convert(true, true);
    else if (aNow < t.a && st.moves.length < 6) convert(false, true);
    if (!st.moves.length) settleFree(t);
  }

  // ===========================================================================
  // State and time
  // ===========================================================================
  function initState() {
    key = key0; S = SPECIES[key];
    st = { V: start0.V, na0: start0.ca * start0.V, nb0: start0.cb * start0.V, mlOH: [0, 0], mlH: [0, 0], drops: 0, water: true, str: S.strength === 0.10 ? 1 : 0,
           running: false, started: false, lastInput: 0, parts: [], moves: [], seeded: false, next: 0 };
  }
  function tick(dt) {
    st.moves.forEach(function (mv) { mv.t += dt; }); st.moves = st.moves.filter(function (mv) { if (mv.t < mv.dur) return true; mv.after(); return false; });
    st.next -= dt; if (st.next <= 0) { reconcile(true); st.next = 0.12; }
    st.parts.forEach(function (p) {
      if (p.busy) return;
      p.vx += rnd(-30, 30) * dt; p.vy += rnd(-30, 30) * dt; var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy); if (sp > 24) { p.vx *= 24 / sp; p.vy *= 24 / sp; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += dt * 0.5;
      if (p.x < 8) { p.x = 8; p.vx = Math.abs(p.vx); } if (p.x > PW.w - 8) { p.x = PW.w - 8; p.vx = -Math.abs(p.vx); }
      if (p.y < 8) { p.y = 8; p.vy = Math.abs(p.vy); } if (p.y > PW.h - 8) { p.y = PW.h - 8; p.vy = -Math.abs(p.vy); }
    });
    if ((performance.now() - st.lastInput) / 1000 > IDLE_STOP_S) { stop(); say('Paused after two minutes without input.'); }
  }

  // ===========================================================================
  // Drawing helpers
  // ===========================================================================
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  function C(n) { if (!colours) colours = {}; if (!(n in colours)) colours[n] = getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); return colours[n]; }
  function sizeCanvas(cv, bg) {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w || !h) return null;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = bg || C('bg'); ctx.fillRect(0, 0, w, h);
    return { ctx: ctx, W: w, H: h };
  }
  function atom(ctx, x, y, r, f, e) { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = C(f); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = C(e); ctx.stroke(); }
  function charge(ctx, x, y, t) { ctx.font = '700 9px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('fg'); ctx.fillText(t, x, y); }
  function drawWater(ctx, x, y, a) {
    ctx.strokeStyle = C('water'); ctx.lineWidth = 1; var c = Math.cos(a), s = Math.sin(a);
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + c * 4.6 - s * 2.4, y + s * 4.6 + c * 2.4, 2, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - c * 4.6 - s * 2.4, y - s * 4.6 + c * 2.4, 2, 0, 2 * Math.PI); ctx.stroke();
  }
  function body(ctx, x, y) {
    ctx.beginPath(); ctx.arc(x, y, 5.6, 0, 2 * Math.PI); ctx.fillStyle = C('body'); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = C('body-edge'); ctx.stroke();
    ctx.font = '700 7.5px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('sign'); ctx.fillText('A', x, y + 0.5);
  }
  function drawP(ctx, p) {
    var x = p.x, y = p.y, c = Math.cos(p.a), s = Math.sin(p.a);
    if (p.k === 'W') return drawWater(ctx, x, y, p.a);
    if (p.k === 'HA') { body(ctx, x, y); if (S.acidCharge) charge(ctx, x - 13, y - 7, S.acidCharge); if (!(p.busy && st.moves.some(function (mv) { return mv.from === p && mv.t >= 0; }))) atom(ctx, x + c * 7, y + s * 7, 2.6, 'h', 'h-edge'); return; }
    if (p.k === 'A') { body(ctx, x, y); if (S.baseCharge) charge(ctx, x + 6, y - 7, S.baseCharge); return; }
    if (p.k === 'H3O') { atom(ctx, x, y, 4.6, 'o', 'o-edge'); for (var i = 0; i < 3; i++) { var t = p.a + i * 2.094; atom(ctx, x + Math.cos(t) * 5.2, y + Math.sin(t) * 5.2, 2.5, 'h', 'h-edge'); } charge(ctx, x + 7, y - 7, '+'); return; }
    if (p.k === 'OH') { atom(ctx, x, y, 4.6, 'o', 'o-edge'); atom(ctx, x + c * 5.2, y + s * 5.2, 2.7, 'h', 'h-edge'); charge(ctx, x + 6, y - 7, '−'); }
  }

  // ---------------------------------------------------------------------------
  // The bench: the buffer beaker and the water beaker, each with a meter, on one scale
  // ---------------------------------------------------------------------------
  var sceneCv = document.getElementById('scene');
  function sceneText(ctx, text, x, y) { ctx.lineWidth = 3; ctx.strokeStyle = '#f4f2ec'; ctx.strokeText(text, x, y); ctx.fillStyle = '#1d1e1c'; ctx.fillText(text, x, y); }
  function beaker(ctx, cx, label, pHtext) {   // a meter above a beaker with its probe
    ctx.fillStyle = '#3f434a'; ctx.fillRect(cx - 50, 4, 100, 28); ctx.fillStyle = '#f4f2ec'; ctx.fillRect(cx - 45, 8, 90, 20);
    ctx.font = '700 12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1d1e1c'; ctx.fillText(pHtext, cx, 18.5);
    var x = cx - 24;
    ctx.fillStyle = '#e3e6df'; ctx.fillRect(x, 58, 48, 34); ctx.strokeStyle = '#3f434a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 44); ctx.lineTo(x, 92); ctx.lineTo(x + 48, 92); ctx.lineTo(x + 48, 44); ctx.stroke();
    ctx.strokeStyle = '#9ea39a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 1, 58.5); ctx.lineTo(x + 47, 58.5); ctx.stroke();
    ctx.strokeStyle = '#2f3237'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 38, 32); ctx.lineTo(x + 38, 84); ctx.stroke();
    ctx.font = '600 10px ' + FONT; ctx.textBaseline = 'top';
    var words = label.split(' ');   // "pure water" stacks on two lines to stay inside the beaker
    if (words.length > 1) { sceneText(ctx, words[0], cx - 4, 62); sceneText(ctx, words[1], cx - 4, 74); } else sceneText(ctx, label, cx - 4, 70);
  }
  function drawScene() {
    var cv = sizeCanvas(sceneCv, '#ebe8df'); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, pb = bufferPH(), pw = waterPH();
    ctx.fillStyle = '#f4f2ec'; ctx.fillRect(0, 0, W, 94); ctx.fillStyle = '#b9b2a2'; ctx.fillRect(0, 92, W, 7);
    beaker(ctx, st.water ? 56 : 114, 'buffer', 'pH ' + fmtP(pb));
    if (st.water) beaker(ctx, 170, 'pure water', 'pH ' + fmtP(pw));
    ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '600 10px ' + FONT; sceneText(ctx, S.temp, W - 4, 36);
    var x0 = 12, x1 = W - 12, y = 124, px = function (p) { return x0 + (p + 1) / 16 * (x1 - x0); };
    ctx.fillStyle = '#d9d4c4'; ctx.fillRect(px(0), y - 10, px(14) - px(0), 20);
    ctx.strokeStyle = '#3f434a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.font = '10px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#1d1e1c';
    for (var p = -1; p <= 15; p++) { var tall = p === 0 || p === 7 || p === 14 || p === -1 || p === 15; ctx.beginPath(); ctx.moveTo(px(p), y - (tall ? 6 : 3)); ctx.lineTo(px(p), y + (tall ? 6 : 3)); ctx.stroke(); if (p === 0 || p === 7 || p === 14) ctx.fillText(String(p), px(p), y + 8); }   // labels at 0, 7 and 14 only (instructor, 17 Oct)
    ctx.font = '600 10px ' + FONT; ctx.fillText('usual range (shaded)', px(7), y + 20);
    function marker(pH, filled, name, lift) {
      var mx = px(Math.max(-1, Math.min(15, pH)));
      ctx.beginPath(); ctx.moveTo(mx, y - 1); ctx.lineTo(mx - 6, y - 13); ctx.lineTo(mx + 6, y - 13); ctx.closePath();
      if (filled) { ctx.fillStyle = '#7a1f10'; ctx.fill(); } else { ctx.fillStyle = '#f4f2ec'; ctx.fill(); ctx.strokeStyle = '#7a1f10'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.strokeStyle = '#7a1f10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx, y - 1); ctx.lineTo(mx, y + 9); ctx.stroke();
      ctx.font = '600 9px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; sceneText(ctx, name, mx, y - 14 - (lift || 0));
    }
    marker(pb, true, 'buffer');
    if (st.water) marker(pw, false, 'pure water', Math.abs(pw - pb) < 3.5 ? 11 : 0);
  }

  // ---------------------------------------------------------------------------
  // The panel: the buffer's particles
  // ---------------------------------------------------------------------------
  var panelCv = document.getElementById('panel');
  function drawPanel() {
    var cv = sizeCanvas(panelCv); if (!cv) return;
    var ctx = cv.ctx, W = cv.W, H = cv.H, nw = { w: W - 12, h: H - 18 - 22 };
    if (PW.w && (PW.w !== nw.w || PW.h !== nw.h)) st.parts.forEach(function (p) { p.x *= nw.w / PW.w; p.y *= nw.h / PW.h; });
    PW = nw;
    if (!st.seeded) { seedAll(); st.seeded = true; }
    ctx.font = '600 11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C('fg');
    ctx.fillText('The Buffer: a simulated sketch, spectator ions not depicted', 6, 3);
    ctx.save(); ctx.translate(6, 18);
    ctx.fillStyle = C('win-bg'); ctx.fillRect(0, 0, PW.w, PW.h); ctx.strokeStyle = C('rule'); ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, PW.w - 1, PW.h - 1);
    ctx.beginPath(); ctx.rect(0, 0, PW.w, PW.h); ctx.clip();
    ['W', 'HA', 'A', 'H3O', 'OH'].forEach(function (k) { st.parts.forEach(function (p) { if (p.k === k) drawP(ctx, p); }); });
    st.moves.forEach(function (mv) { if (mv.t < 0) return; var f = Math.min(1, mv.t / mv.dur); atom(ctx, mv.from.x + (mv.to.x - mv.from.x) * f, mv.from.y + (mv.to.y - mv.from.y) * f, 2.8, 'h', 'h-edge'); });
    ctx.restore();
    var y = H - 10, x = 14;
    function item(p, label) { p.x = x; p.y = y; p.a = 0; drawP(ctx, p); ctx.font = '11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('fg'); ctx.fillText(label, x + 12, y); x += 12 + ctx.measureText(label).width + 16; }
    item({ k: 'HA' }, S.show + ' (' + count('HA') + ')'); item({ k: 'A' }, S.base + ' (' + count('A') + ')'); item({ k: 'OH' }, 'OH⁻'); item({ k: 'H3O' }, 'H₃O⁺');   // drawn counts moved here from the title line
    drawWater(ctx, x, y, 0); ctx.fillStyle = C('fg'); ctx.textAlign = 'left'; ctx.fillText('water', x + 10, y);
  }

  // ===========================================================================
  // Text (labels and attributes are written only when they change: the Safari fix)
  // ===========================================================================
  var el = function (id) { return document.getElementById(id); };
  function setText(id, t) { var e = el(id); if (e.textContent !== t) e.textContent = t; }
  function setAttr(e, n, v) { if (e.getAttribute(n) !== v) e.setAttribute(n, v); }
  function setHidden(id, h) { var e = el(id); if (e.hidden !== h) e.hidden = h; }
  function setDisabled(id, d) { var e = el(id); if (e.disabled !== d) e.disabled = d; }
  var MSHOW = ['1.0 M', '0.10 M'];
  function ratioText(m) { return m.a <= 0 ? 'no acid left' : m.b <= 0 ? '0 (no base left)' : fmt(m.b / m.a); }
  function addedText() {
    var bits = [];
    [0, 1].forEach(function (i) { if (st.mlOH[i]) bits.push(fmtML(st.mlOH[i]) + ' of ' + MSHOW[i] + ' NaOH'); });
    [0, 1].forEach(function (i) { if (st.mlH[i]) bits.push(fmtML(st.mlH[i]) + ' of ' + MSHOW[i] + ' HCl'); });
    if (st.drops) bits.push(st.drops + (st.drops === 1 ? ' drop' : ' drops') + ' of 2.0 M HCl');
    return bits.length ? bits.join(', ') : 'nothing';
  }
  function readout() {
    var m = amounts();
    return S.buffer + ': ' + S.show + ' ' + fmt(m.a) + ' mol, ' + S.base + ' ' + fmt(m.b) + ' mol, ratio ' + ratioText(m) + '; buffer pH ' + fmtP(bufferPH()) +
      (st.water ? '; pure water pH ' + fmtP(waterPH()) : '') + '; added: ' + addedText() + '.';
  }
  function statusText() {
    var out = cap1(S.buffer) + ', ' + fmt(st.na0 / st.V) + ' M ' + S.show + ' and ' + fmt(st.nb0 / st.V) + ' M ' + S.base + ' in ' + fmt(st.V) + ' L. Added: ' + addedText() + '.';
    if (!st.running && !isReduced()) out += st.started ? ' Paused.' : ' Paused.';
    return out;
  }
  function cap1(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function captionText() {   // DRAFT wording: the quick start, for the instructor to approve
    return 'Quick start: press Add NaOH or Add HCl (hold to repeat), or One drop of 2.0 M HCl, and read both meters. Choose the buffer and strength ' +
      'from the menus; Pure water beaker shows or hides the comparison. The sketch shows about 100 units of acid and base, split by their mole number.';
  }
  function describeScene() {
    return spoken('Two beakers at ' + S.temp + (st.water ? ', the buffer and pure water of the same volume, each with a pH meter. The buffer reads pH ' + fmtP(bufferPH()) + ' and the pure water reads pH ' + fmtP(waterPH()) + '.' : ': the buffer, with a pH meter reading pH ' + fmtP(bufferPH()) + '; the pure water beaker is hidden.') +
      ' Both readings are marked on one scale, labeled at 0, 7 and 14, with the usual range 0 to 14 shaded. ' + readout());
  }
  function describePanel() {
    var fo = count('OH', function (p) { return p.free; }), fh = count('H3O', function (p) { return p.free; });
    return spoken('A drawing of the buffer among faint water molecules: ' + count('HA') + ' ' + S.show + ' units, each with its proton, and ' + count('A') + ' ' + S.base + ' units.' +
      (fo ? ' ' + fo + ' free hydroxide ions.' : '') + (fh ? ' ' + fh + ' free hydronium ions.' : '') +
      ' Each added hydroxide ion takes a proton from a ' + S.show + ' unit; each added hydronium ion gives its proton to a ' + S.base + ' unit.');
  }
  var live = el('live');
  function say(msg) { live.textContent = ''; setTimeout(function () { live.textContent = spoken(msg); }, 30); }
  function updateText() {
    var m = amounts();
    setText('title', 'Buffers: the ' + S.menu + ', ' + S.temp.replace(' (body temperature)', ''));
    setText('rSp', S.short); setText('lA', 'Acid partner, ' + S.show); setText('lB', 'Base partner, ' + S.base);
    setText('rA', fmt(m.a) + ' mol'); setText('rB', fmt(m.b) + ' mol'); setText('rR', ratioText(m)); setText('rPKa', fmtP(-Math.log10(S.K)));
    setText('rpH', fmtP(bufferPH())); setText('rpHw', fmtP(waterPH())); setHidden('rowW', !st.water);
    setText('rOH', fmtML(st.mlOH[0])); setText('rOH2', fmtML(st.mlOH[1])); setText('rHCl', fmtML(st.mlH[0])); setText('rHCl2', fmtML(st.mlH[1])); setText('rDrop', String(st.drops));
    if (el('str').value !== String(st.str)) el('str').value = String(st.str);
    setText('status', statusText()); setText('caption', captionText()); setText('descScene', describeScene()); setText('descPanel', describePanel());
    setText('play', st.running ? 'Pause' : 'Play'); setDisabled('play', isReduced());
    setDisabled('addOH', st.mlOH[st.str] >= MAX_ML); setDisabled('addH', st.mlH[st.str] >= MAX_ML);
    setAttr(el('water'), 'aria-pressed', String(st.water)); if (el('sp').value !== key) el('sp').value = key;
  }

  // ===========================================================================
  // Loop
  // ===========================================================================
  var rafId = null, lastT = 0;
  function render() { drawScene(); drawPanel(); updateText(); }
  function frame(t) { rafId = null; var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; tick(dt); render(); schedule(); }
  function schedule() { if (st.running && !isReduced() && !rafId) rafId = requestAnimationFrame(frame); }
  function start() { st.lastInput = performance.now(); st.started = true; if (isReduced()) return; if (!st.running) { st.running = true; lastT = performance.now(); } schedule(); render(); }
  function stop() { st.running = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } if (st.seeded) reconcile(false); render(); }

  // ===========================================================================
  // Controls
  // ===========================================================================
  var restTimer = null;
  function changed(msg) {   // every addition reaches both beakers; the drawing follows, animated unless paused by reduced motion
    st.lastInput = performance.now();
    if (isReduced()) { if (st.seeded) reconcile(false); }
    else start();
    render();
    if (restTimer) clearTimeout(restTimer); restTimer = setTimeout(function () { restTimer = null; say((msg ? msg + ' ' : '') + readout()); }, 500);
  }
  function addOH() { var i = st.str; if (st.mlOH[i] >= MAX_ML) return; st.mlOH[i] = Math.round((st.mlOH[i] + STEP_ML) * 10) / 10; changed('Added 1.0 mL of ' + MSHOW[i] + ' NaOH to each beaker.'); }
  function addH() { var i = st.str; if (st.mlH[i] >= MAX_ML) return; st.mlH[i] = Math.round((st.mlH[i] + STEP_ML) * 10) / 10; changed('Added 1.0 mL of ' + MSHOW[i] + ' HCl to each beaker.'); }
  el('str').addEventListener('change', function () { st.str = el('str').value === '1' ? 1 : 0; render(); say('Strength for the add buttons: ' + MSHOW[st.str] + '.'); });
  function addDrop() { st.drops += 1; changed('Added one drop of 2.0 M HCl to each beaker.'); }
  // Hold to repeat: pointer press adds once, then repeats while held; a keyboard or screen-reader click adds once.
  function holdable(id, fn) {
    var b = el(id), timer = null, fromPointer = false;
    function stopRep() { if (timer) { clearTimeout(timer); timer = null; } }
    b.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || b.disabled) return; fromPointer = true; fn();
      var rep = function () { if (b.disabled) return stopRep(); fn(); timer = setTimeout(rep, REPEAT_MS); };
      timer = setTimeout(rep, REPEAT_DELAY);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach(function (ev) { b.addEventListener(ev, stopRep); });
    b.addEventListener('click', function () { if (fromPointer) { fromPointer = false; return; } fn(); });
  }
  holdable('addOH', addOH); holdable('addH', addH);
  el('drop').addEventListener('click', addDrop);
  el('water').addEventListener('click', function () { st.water = !st.water; render(); say(st.water ? 'Pure water beaker shown.' : 'Pure water beaker hidden.'); });
  Object.keys(SPECIES).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = SPECIES[k].short; el('sp').appendChild(o); });
  el('sp').addEventListener('change', function () {   // a fresh batch of the chosen buffer, same amounts, nothing added
    var k = el('sp').value; if (!SPECIES[k] || k === key) return;
    key = k; S = SPECIES[k]; st.mlOH = [0, 0]; st.mlH = [0, 0]; st.drops = 0; st.str = S.strength === 0.10 ? 1 : 0; st.seeded = false; st.moves = [];
    render(); say('Now showing the ' + S.buffer + ', nothing added. ' + readout());
  });
  el('play').addEventListener('click', function () { if (st.running) stop(); else start(); });
  el('reset').addEventListener('click', function () { stop(); initState(); render(); say('Reset. ' + readout()); });

  // ===========================================================================
  // Start: the problem's own buffer, paused, nothing added.
  // ===========================================================================
  applyTheme();
  if (darkQ && themeParam !== 'light' && themeParam !== 'dark') { var cw = function () { applyTheme(); render(); }; if (darkQ.addEventListener) darkQ.addEventListener('change', cw); else if (darkQ.addListener) darkQ.addListener(cw); }
  if (reduceQ) { var rc = function () { if (st.running && isReduced()) stop(); render(); }; if (reduceQ.addEventListener) reduceQ.addEventListener('change', rc); else if (reduceQ.addListener) reduceQ.addListener(rc); }
  initState();
  if (window.ResizeObserver) new ResizeObserver(function () { render(); }).observe(document.body); else window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
